                                        </div>
                                    </div>
                                    <button
                                        onClick={copyRoomCodeToClipboard}
                                        className="bg-jl-dark hover:bg-slate-800 border border-jl-yellow/50 text-jl-yellow font-display font-black text-xs uppercase px-2.5 py-1.5 rounded-xl active:scale-95"
                                    >
                                        📋 Kopiér {roomCode}
                                    </button>
                                </div>

                                {/* Spil-Styring (Fase, Næste Runde, Nyt Spil) */}
                                <div className="text-[10px] font-display font-black uppercase tracking-wider text-jl-cream/60 mb-1.5">
                                    🎮 RUNDE & SPIL-STYRING
                                </div>
                                <div className="grid grid-cols-2 gap-2 mb-3.5">
                                    <button
                                        onClick={() => { handleTogglePhase(); setBurgerMenuOpen(false); }}
                                        className="bg-jl-orange hover:bg-amber-600 text-white font-display font-black text-xs uppercase py-2.5 px-3 rounded-xl shadow flex items-center justify-center gap-1.5"
                                    >
                                        {roomState.phase === 'hiding' ? '🚨 Start Jagten Nu' : '⏱ Start 45m Ur'}
                                    </button>
                                    <button
                                        onClick={() => { handleNextRoundSwapTeams(); setBurgerMenuOpen(false); }}
                                        className="bg-jl-yellow hover:bg-amber-400 text-jl-navy font-display font-black text-xs uppercase py-2.5 px-3 rounded-xl shadow flex items-center justify-center gap-1.5"
                                    >
                                        🔄 Næste Runde (Byt)
                                    </button>
                                    <button
                                        onClick={() => { handleStartNewGame(); setBurgerMenuOpen(false); }}
                                        className="col-span-2 bg-jl-green hover:bg-emerald-500 text-white font-display font-black text-xs uppercase py-2.5 px-3 rounded-xl shadow flex items-center justify-center gap-1.5"
                                    >
                                        🆕 Start Helt Nyt Spil (Nulstil til Runde 1)
                                    </button>
                                </div>

                                {/* Lyd, Musik & Kort-indstillinger */}
                                <div className="text-[10px] font-display font-black uppercase tracking-wider text-jl-cream/60 mb-1.5">
                                    🔊 LYD, MUSIK & KORTVISNING
                                </div>
                                <div className="grid grid-cols-2 gap-2 mb-3.5">
                                    <button
                                        onClick={() => {
                                            const nextMuted = !soundMuted;
                                            setSoundMuted(nextMuted);
                                            JetLagAudio.muted = nextMuted;
                                            if (!nextMuted) JetLagAudio.playIntroStinger();
                                        }}
                                        className={`py-2 px-3 rounded-xl font-display font-bold text-xs uppercase border ${
                                            !soundMuted ? 'bg-jl-green/25 border-jl-green text-white' : 'bg-jl-dark border-jl-cream/20 text-jl-cream/60'
                                        }`}
                                    >
                                        {!soundMuted ? '🔊 Lydeffekter: TIL' : '🔇 Lydeffekter: FRA'}
                                    </button>
                                    <button
                                        onClick={() => {
                                            const active = JetLagAudio.toggleBackgroundMusic();
                                            setMusicPlaying(active);
                                        }}
                                        className={`py-2 px-3 rounded-xl font-display font-bold text-xs uppercase border ${
                                            musicPlaying ? 'bg-jl-yellow text-jl-navy border-white' : 'bg-jl-dark border-jl-cream/20 text-jl-cream/80'
                                        }`}
                                    >
                                        {musicPlaying ? '🎵 Musik: SPILLER' : '🎵 Musik: SLUKKET'}
                                    </button>
                                    <button
                                        onClick={() => {
                                            JetLagAudio.playUiClick();
                                            setMapTheme(t => t === 'map-mint' ? 'map-clean' : t === 'map-clean' ? 'map-dark' : 'map-mint');
                                        }}
                                        className="py-2 px-3 rounded-xl bg-jl-dark border border-jl-cream/25 text-jl-cream font-display font-bold text-xs uppercase"
                                    >
                                        🗺️ Tema: {mapTheme === 'map-mint' ? 'Jet Lag Mint' : mapTheme === 'map-clean' ? 'Normalt Kort' : 'Nat-Kort'}
                                    </button>
                                    <button
                                        onClick={() => {
                                            JetLagAudio.playUiClick();
                                            setShowHubs(!showHubs);
                                        }}
                                        className={`py-2 px-3 rounded-xl font-display font-bold text-xs uppercase border ${
                                            showHubs ? 'bg-jl-yellow/20 border-jl-yellow text-jl-yellow' : 'bg-jl-dark border-jl-cream/20 text-jl-cream/60'
                                        }`}
                                    >
                                        🚆 Stationer: {showHubs ? 'VIS' : 'SKJUL'}
                                    </button>
                                </div>

                                {}
                                {/* GPS & Test-indstillinger */}
                                <div className="text-[10px] font-display font-black uppercase tracking-wider text-jl-cream/60 mb-1.5">
                                    📍 GPS & TEST-FUNKTIONER
                                </div>
                                <div className="grid grid-cols-2 gap-2 mb-3.5">
                                    <button
                                        onClick={() => {
                                            JetLagAudio.playUiClick();
                                            setManualGpsMode(!manualGpsMode);
                                            notify(!manualGpsMode ? "👆 Test-GPS: Tryk på kortet for at flytte din brik!" : "📍 Telefonens Live GPS er nu aktiv.");
                                        }}
                                        className={`py-2 px-3 rounded-xl font-display font-bold text-xs uppercase border ${
                                            manualGpsMode ? 'bg-jl-red text-white border-white' : 'bg-jl-dark border-jl-cream/25 text-jl-cream'
                                        }`}
                                    >
                                        {manualGpsMode ? '👆 Flyt = Tryk Kort' : '📍 Live GPS Aktiv'}
                                    </button>
                                    {myRole === 'hider' ? (
                                        <button
                                            onClick={() => {
                                                JetLagAudio.playUiClick();
                                                setSimulateBotChasers(!simulateBotChasers);
                                            }}
                                            className={`py-2 px-3 rounded-xl font-display font-bold text-xs uppercase border ${
                                                simulateBotChasers ? 'bg-jl-yellow text-jl-navy border-white' : 'bg-jl-dark border-jl-cream/25 text-jl-cream'
                                            }`}
                                        >
                                            {simulateBotChasers ? '🤖 Bot-Finder: TIL' : '🤖 Bot-Finder: FRA'}
                                        </button>
                                    ) : (
                                        <button
                                            onClick={() => {
                                                JetLagAudio.playUiClick();
                                                setActiveTool('room');
                                                setBurgerMenuOpen(false);
                                            }}
                                            className="py-2 px-3 rounded-xl font-display font-bold text-xs uppercase border bg-jl-dark border-jl-cream/25 text-jl-cream"
                                        >
                                            👥 Hold & Spillere ({players.length})
                                        </button>
                                    )}
                                </div>

                                {}
                                <div className="pt-2 border-t border-jl-cream/15 flex gap-2">
                                    <button
                                        onClick={() => {
                                            setActiveTool('room');
                                            setBurgerMenuOpen(false);
                                        }}
                                        className="flex-1 bg-jl-dark hover:bg-slate-800 border border-jl-cream/25 text-jl-cream font-display font-bold text-xs uppercase py-2.5 rounded-xl"
                                    >
                                        👥 Skift Hold
                                    </button>
                                    <button
                                        onClick={handleLeaveAndCleanupRoom}
                                        className="flex-1 bg-jl-red/20 hover:bg-jl-red text-jl-red hover:text-white border border-jl-red/50 font-display font-black text-xs uppercase py-2.5 rounded-xl transition-colors"
                                    >
                                        🚪 Forlad Spil
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Floating Quick-Action Buttons on Map (Centrér på mig, Nærmeste Station & Zoom til Findere) */}
                    <div className="absolute bottom-24 right-2.5 z-[480] flex flex-col items-end gap-2 pointer-events-auto">
                        {showHubs && hiderNearestStation && (
                            <button
                                onClick={() => {
                                    JetLagAudio.playUiClick();
                                    mapInstanceRef.current?.flyTo([hiderNearestStation.lat, hiderNearestStation.lng], 14, { duration: 0.6 });
                                }}
                                className="px-2.5 py-1.5 rounded-2xl bg-jl-navy/95 border-2 border-jl-yellow text-jl-cream shadow-xl flex items-center gap-1.5 active:scale-95 max-w-[210px]"
                                title="Din nærmeste station lige nu (opdaterer automatisk når du rykker dig)"
                            >
                                <span className="text-sm">🚆</span>
                                <div className="text-left truncate">
                                    <div className="text-[8px] font-display font-black uppercase text-jl-yellow leading-none">
                                        NÆRMESTE STATION
                                    </div>
                                    <div className="font-display font-black text-xs text-jl-cream truncate leading-tight">
                                        {hiderNearestStation.name} ({hiderNearestStation.distanceKm < 1 ? `${Math.round(hiderNearestStation.distanceKm * 1000)}m` : `${hiderNearestStation.distanceKm.toFixed(1)}km`})
                                    </div>
                                </div>
                            </button>
                        )}
                        {myRole === 'hider' && chasersWithDistance.length > 0 && (
                            <button
                                onClick={fitMapToChasers}
                                className="px-3 h-10 rounded-2xl bg-jl-navy/95 border-2 border-jl-green text-jl-green font-display font-black text-xs uppercase shadow-xl flex items-center justify-center gap-1 active:scale-95"
                                title="Zoom kortet så alle Findere ses"
                            >
                                <span>👁️ FINDERE</span>
                            </button>
                        )}
                        <button
                            onClick={() => {
                                JetLagAudio.playUiClick();
                                if (mapInstanceRef.current) {
                                    mapInstanceRef.current.flyTo([myCoords.lat, myCoords.lng], 14, { duration: 0.6 });
                                }
                            }}
                            className="w-11 h-11 rounded-2xl bg-jl-navy/95 border-2 border-jl-cream text-jl-yellow shadow-xl flex items-center justify-center text-lg active:scale-95 ml-auto"
                            title="Centrér kortet på min GPS-position"
                        >
                            🎯
                        </button>
                    </div>

                    {/* SYNKRONISERET 5-MIN (GPS) & 20-MIN (FOTO) SPØRGSMÅLS-NEDTÆLLING & GEMMER-ACCEPT MODAL */}
                    {activePendingQuestion && !telemetryMinimized && (
                        <div className="fixed inset-0 z-[700] bg-jl-dark/80 backdrop-blur-sm flex items-center justify-center p-4">
                            {(() => {
                                const secsLeft = Math.max(0, Math.ceil(((activePendingQuestion.deadlineMillis || Date.now()) - nowMillis) / 1000));
                                const totalSecs = activePendingQuestion.durationSecs || (activePendingQuestion.questionType === 'photo' ? 1200 : 300);
                                const pctDone = Math.min(100, Math.max(0, ((totalSecs - secsLeft) / totalSecs) * 100));
                                const isPhotoQ = activePendingQuestion.questionType === 'photo';
                                return (
                                    <div className="jl-anim-center bg-jl-navy border-4 border-jl-cream rounded-3xl max-w-md w-full p-5 sm:p-6 text-center text-jl-cream shadow-2xl relative overflow-hidden">
                                        <div className={`inline-block font-display font-black text-xs uppercase tracking-widest px-3 py-1 rounded jl-slanted-badge mb-3 ${
                                            isPhotoQ ? 'bg-jl-red text-white' : 'bg-jl-yellow text-jl-navy'
                                        }`}>
                                            {isPhotoQ ? '📸 FOTO-UDFORDRING (20 MIN FRIST)' : `🛰️ ${activePendingQuestion.category} (5 MIN AUTO-SVAR)`}
                                        </div>

                                        <h3 className="font-display font-black text-2xl sm:text-3xl uppercase tracking-wide text-jl-cream mb-1">
                                            {activePendingQuestion.title || activePendingQuestion.category}
                                        </h3>
                                        <p className="text-xs text-jl-cream/85 mb-4 px-2 font-semibold">
                                            {activePendingQuestion.questionText}
                                        </p>

                                        {/* Animated Radar Sweep Circle */}
                                        <div className="relative w-32 h-32 sm:w-36 sm:h-36 mx-auto mb-4 rounded-full border-4 border-jl-yellow/40 bg-jl-dark flex flex-col items-center justify-center overflow-hidden shadow-inner">
                                            <div className="absolute inset-0 rounded-full border border-jl-yellow/20 scale-75" />
                                            <div className="absolute inset-0 rounded-full border border-jl-yellow/20 scale-50" />
                                            <div
                                                className="absolute inset-0 jl-radar-sweep"
                                                style={{
                                                    background: isPhotoQ
                                                        ? 'conic-gradient(from 0deg, transparent 70%, rgba(219, 56, 50, 0.55) 100%)'
                                                        : 'conic-gradient(from 0deg, transparent 70%, rgba(243, 178, 41, 0.55) 100%)'
                                                }}
                                            />
                                            <span className="relative z-10 text-[10px] font-display font-bold uppercase text-jl-cream/70 tracking-widest">
                                                {isPhotoQ ? 'FOTO-FRIST' : 'AUTO-SVAR OM'}
                                            </span>
                                            <span className="relative z-10 font-display font-black text-4xl text-jl-yellow tracking-wider">
                                                {formatDurationMmSs(secsLeft)}
                                            </span>
                                        </div>

                                        {/* Progress Bar */}
                                        <div className="w-full h-3 bg-jl-dark rounded-full overflow-hidden border border-jl-cream/20 mb-3">
                                            <div
                                                className="h-full bg-gradient-to-r from-jl-yellow via-jl-orange to-jl-red transition-all duration-700"
                                                style={{ width: `${pctDone}%` }}
                                            />
                                        </div>

                                        {myRole === 'hider' ? (
                                            /* GEMMERENS KONTROLBOKS: Kan acceptere/svare med det samme inden 5 min (eller uploade foto inden 20 min) */
                                            <div className="bg-jl-dark p-3.5 rounded-2xl border-2 border-jl-green/50 mb-3 text-left space-y-2.5">
                                                <div className="font-display font-black text-sm uppercase text-jl-green flex items-center justify-between">
                                                    <span>🏃 GEMMER-HANDLING</span>
                                                    <span className="text-[10px] text-jl-yellow">{activePendingQuestion.cardReward}</span>
                                                </div>
                                                {activePendingQuestion.questionType === 'gps' && activePendingQuestion.autoPayload ? (
                                                    <>
                                                        <div className="text-xs text-jl-cream/90 leading-snug">
                                                            Udregnet GPS-svar: <b className="text-jl-yellow">{activePendingQuestion.autoPayload.headline}</b>.
                                                            Du kan acceptere svaret nu, eller lade systemet svare automatisk når de 5 min udløber:
                                                        </div>
                                                        <button
                                                            onClick={() => finalizePendingQuestion(activePendingQuestion, null, `${playerName} (Gemmer Accepterede)`)}
                                                            className="w-full bg-jl-green hover:bg-emerald-500 text-white font-display font-black text-base uppercase py-2.5 px-3 rounded-xl shadow-lg active:scale-95 transition-transform"
                                                        >
                                                            ✅ ACCEPTÉR & SEND SVAR NU ({activePendingQuestion.autoPayload.headline})
                                                        </button>
                                                        <div className="grid grid-cols-2 gap-1.5 pt-1">
                                                            <button
                                                                onClick={() => finalizePendingQuestion(activePendingQuestion, true, `${playerName} (Manuelt JA)`)}
                                                                className="bg-jl-navy hover:bg-slate-800 border border-jl-green/40 text-jl-green font-display font-bold text-xs uppercase py-1.5 rounded-lg"
                                                            >
                                                                Tving: ✅ JA / VARM
                                                            </button>
                                                            <button
                                                                onClick={() => finalizePendingQuestion(activePendingQuestion, false, `${playerName} (Manuelt NEJ)`)}
                                                                className="bg-jl-navy hover:bg-slate-800 border border-jl-red/40 text-jl-red font-display font-bold text-xs uppercase py-1.5 rounded-lg"
                                                            >
                                                                Tving: ❌ NEJ / KOLD
                                                            </button>
                                                        </div>
                                                    </>
                                                ) : (
                                                    <>
                                                        <div className="text-xs text-jl-cream/90">
                                                            Du har <b>{formatDurationMmSs(secsLeft)}</b> til at tage og sende billedet til Finderne:
                                                        </div>
                                                        <button
                                                            onClick={() => {
                                                                setTelemetryMinimized(true);
                                                                setActiveTool('hider_inbox');
                                                            }}
                                                            className="w-full bg-jl-green hover:bg-emerald-500 text-white font-display font-black text-base uppercase py-2.5 px-3 rounded-xl shadow-lg"
                                                        >
                                                            📷 ÅBN KAMERA / SVAR I INDBAKKE →
                                                        </button>
                                                    </>
                                                )}
                                            </div>
                                        ) : (
                                            /* FINDERENS STATUS-TEKST */
                                            <div className="font-display font-extrabold text-sm uppercase tracking-wider text-jl-green mb-3 animate-pulse">
                                                {isPhotoQ
                                                    ? "📸 Venter på at Gemmeren tager og uploader billedet (20 min frist)..."
                                                    : "📡 Venter på at Gemmeren accepterer (Ellers svarer systemet automatisk ved 00:00)"}
                                            </div>
                                        )}

                                        <div className="flex gap-2">
                                            <button
                                                onClick={() => setTelemetryMinimized(true)}
                                                className="flex-1 bg-jl-dark hover:bg-slate-800 border border-jl-cream/30 text-jl-cream font-display font-bold text-xs uppercase py-2.5 px-3 rounded-xl"
                                            >
                                                🗺️ Se Kort Imens
                                            </button>
                                            {activePendingQuestion.questionType === 'gps' && (
                                                <button
                                                    onClick={skipTelemetryWaitNow}
                                                    className="bg-jl-yellow/20 hover:bg-jl-yellow hover:text-jl-navy border border-jl-yellow/50 text-jl-yellow font-display font-bold text-xs uppercase py-2.5 px-3 rounded-xl transition-colors"
                                                    title="Gennemtving svar med det samme"
                                                >
                                                    ⏩ Svar Nu
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                );
                            })()}
                        </div>
                    )}

                    {/* MINIMERET SVAR-TIMER WIDGET (Når man kigger på kortet under 5-min eller 20-min nedtællingen) */}
                    {activePendingQuestion && telemetryMinimized && (
                        <div className="jl-anim-dropdown fixed top-16 sm:top-20 right-2.5 z-[650] pointer-events-auto bg-jl-navy/95 border-2 border-jl-yellow rounded-2xl p-2.5 shadow-2xl text-jl-cream max-w-xs flex items-center gap-2.5">
                            {(() => {
                                const secsLeft = Math.max(0, Math.ceil(((activePendingQuestion.deadlineMillis || Date.now()) - nowMillis) / 1000));
                                return (
                                    <>
                                        <div
                                            onClick={() => setTelemetryMinimized(false)}
                                            className="w-12 h-12 rounded-full border-2 border-jl-yellow bg-jl-dark flex items-center justify-center relative overflow-hidden cursor-pointer shrink-0"
                                        >
                                            <div
                                                className="absolute inset-0 jl-radar-sweep"
                                                style={{ background: 'conic-gradient(from 0deg, transparent 70%, rgba(243, 178, 41, 0.5) 100%)' }}
                                            />
                                            <span className="relative z-10 font-display font-black text-sm text-jl-yellow">
                                                {formatDurationMmSs(secsLeft)}
                                            </span>
                                        </div>

                    {/* DRAMATISK JET LAG SVAR-REVEAL STAMP OVERLAY */}
                    {revealOverlay && (
                        <div
                            onClick={() => setRevealOverlay(null)}
                            className="fixed inset-x-0 top-24 z-[680] flex justify-center px-4 pointer-events-auto cursor-pointer"

                            <div className={`jl-stamp-reveal max-w-lg w-full rounded-3xl border-4 p-5 shadow-2xl text-center ${
                                revealOverlay.isPositive
                                    ? 'bg-jl-navy border-jl-green text-jl-cream'
                                    : 'bg-jl-navy border-jl-red text-jl-cream'
                            }`}>
                                <div className="inline-block bg-jl-yellow text-jl-navy font-display font-black text-xs uppercase px-3 py-0.5 rounded mb-1">
                                    🚨 OFFICIELT SVAR MODTAGET • {revealOverlay.category}
                                </div>
                                <div className={`font-display font-black text-3xl sm:text-4xl uppercase tracking-wider my-1 ${
                                    revealOverlay.isPositive ? 'text-jl-green' : 'text-jl-red'
                                }`}>
                                    {revealOverlay.headline}
                                </div>
                                <p className="text-xs sm:text-sm font-bold text-jl-cream/90 mb-2">
                                    {revealOverlay.subtext}
                                </p>
                                <div className="flex items-center justify-between text-[11px] text-jl-yellow font-display font-bold uppercase pt-2 border-t border-jl-cream/15">
                                    <span>🃏 {revealOverlay.cardReward}</span>
                                    <span>(Klik for at lukke)</span>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* HIDER EXCLUSIVE TOP-LEFT LIVE CHASER RADAR WIDGET (ALTID SYNLIG FOR GEMMERE & MOBIL-VENLIG) */}
                    {myRole === 'hider' && (
                        <div className="absolute top-16 sm:top-20 left-2 z-[480] pointer-events-auto bg-jl-navy/95 border-2 border-jl-green rounded-2xl p-2 sm:p-3 shadow-2xl w-[225px] sm:w-72 text-jl-cream backdrop-blur-md">
                            <div className="flex items-center justify-between gap-1.5">
                                <button
                                    onClick={() => setTrackerCollapsed(!trackerCollapsed)}
                                    className="font-display font-black text-xs sm:text-sm uppercase tracking-wider text-jl-green flex items-center gap-1 text-left"
                                >
                                    <span>📡 FINDER-RADAR ({chasersWithDistance.length})</span>
                                    <span className="text-[10px] text-jl-cream/60">{trackerCollapsed ? '▼' : '▲'}</span>
                                </button>
                                <div className="flex items-center gap-1">
                                    {chasersWithDistance.length > 0 && (
                                        <button
                                            onClick={fitMapToChasers}
                                            className="text-[10px] bg-jl-green text-white px-2 py-0.5 rounded font-display font-black uppercase shadow active:scale-95"
                                            title="Zoom så alle Findere er synlige på kortet"
                                        >
                                            🔍 Vis Alle
                                        </button>
                                    )}
                                </div>
                            </div>

                            {!trackerCollapsed && (
                                <div className="mt-2">
                                    {chasersWithDistance.length === 0 ? (
                                        <div className="bg-jl-dark/90 border border-jl-cream/15 rounded-xl p-2 text-[11px] text-jl-cream/80 space-y-1.5">
                                            <div>
                                                Venter på at spillere på <b>{roomState.hidingTeam === 'teamA' ? 'Hold 2 (Bravo)' : 'Hold 1 (Alpha)'}</b> tilslutter sig rummet...
                                            </div>
                                            <button
                                                onClick={() => setSimulateBotChasers(true)}
                                                className="w-full bg-jl-yellow/20 hover:bg-jl-yellow hover:text-jl-navy border border-jl-yellow/50 text-jl-yellow font-display font-black text-[11px] uppercase py-1 px-2 rounded-lg transition-colors"
                                            >
                                                🤖 Indsæt Bot-Finder (Test)
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="space-y-1.5 max-h-36 overflow-y-auto no-scrollbar">
                                            {chasersWithDistance.map(ch => (
                                                <div
                                                    key={ch.uid}
                                                    onClick={() => {
                                                        JetLagAudio.playUiClick();
                                                        mapInstanceRef.current?.flyTo([ch.lat, ch.lng], 14, { duration: 0.6 });
                                                    }}
                                                    className={`flex items-center justify-between px-2.5 py-1.5 rounded-xl cursor-pointer border transition-colors ${
                                                        ch.distanceKm < 2
                                                            ? 'bg-jl-red/30 border-jl-red animate-pulse'
                                                            : 'bg-jl-dark border-jl-cream/20 hover:border-jl-yellow'

                                                >
                                                    <div className="min-w-0 pr-1">
                                                        <div className="font-bold text-xs truncate flex items-center gap-1">
                                                            <span>🎯 {ch.name}</span>
                                                        </div>
                                                        <div className="text-[9px] text-jl-cream/60 font-bold uppercase">
                                                            Retning: {ch.compass} • {ch.secsAgo < 5 ? 'LIVE NU' : `${ch.secsAgo}s siden`}
                                                        </div>
                                                    </div>
                                                    <span className="font-display font-black text-sm sm:text-base text-jl-yellow shrink-0">
                                                        {ch.distanceKm < 1
                                                            ? `${Math.round(ch.distanceKm * 1000)} m`
                                                            : `${ch.distanceKm.toFixed(1)} km`}
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* Urgent Banner if Seekers sent a Photo/Manual question! */}
                            {pendingManualQuestions.length > 0 && (
                                <button
                                    onClick={() => setActiveTool('hider_inbox')}

                                >
                                    📸 {pendingManualQuestions.length} NYT SPØRGSMÅL! (SVAR HER)
                                </button>
                            )}
                        </div>
                    )}

                    {/* Toast Notification Banner */}
                    {statusBanner && (
                        <div className="jl-anim-toast absolute top-24 left-1/2 -translate-x-1/2 z-[600] bg-jl-yellow text-jl-navy border-2 border-jl-navy px-5 py-2 rounded-xl font-display font-black text-base sm:text-lg uppercase tracking-wide shadow-2xl text-center max-w-md">
                            {statusBanner}
                        </div>
                    )}

                    {}
                    {/* DYNAMISK KORT-LAG STATUSBAR (Vises når Lufthavne, Jernbaner, Biblioteker, Kommuner osv. er tændt på kortet) */}
                    {effectiveDynamicCategory && dynamicCategoryMeta && (
                        <div className="jl-anim-sheet absolute bottom-24 left-1/2 -translate-x-1/2 z-[490] w-[94%] max-w-md pointer-events-auto">

                                    <div className="flex items-center gap-1.5">
                                        <span className="bg-jl-yellow text-jl-navy font-display font-black text-[10px] uppercase px-1.5 py-0.5 rounded">
                                            {(BUILTIN_GEO_DATA[effectiveDynamicCategory] || []).length} PUNKTER
                                        </span>
                                        <span className="font-display font-black text-sm sm:text-base uppercase text-jl-yellow truncate">
                                            {dynamicCategoryMeta.icon} {dynamicCategoryMeta.label}
                                        </span>
                                    </div>
                                    {nearestDynamicPOI && (
                                        <div className="text-[11px] text-jl-cream/90 truncate mt-0.5">
                                            Nærmeste: <b className="text-jl-green">{nearestDynamicPOI.name}</b> ({nearestDynamicPOI.distanceKm < 1 ? `${Math.round(nearestDynamicPOI.distanceKm * 1000)} m` : `${nearestDynamicPOI.distanceKm.toFixed(2)} km`})

                                </div>
                                <div className="flex items-center gap-1.5 shrink-0">

                                        <button
                                            onClick={() => handleScanLiveOSM(effectiveDynamicCategory)}

                                            className="px-2.5 py-1.5 rounded-xl font-display font-black text-[11px] uppercase bg-jl-dark hover:bg-slate-800 text-jl-yellow border border-jl-yellow/50"
                                            title="Hent alle officielle lokationer i denne kategori live fra OpenStreetMap"
                                        >
                                            {isScanningOsm ? '⏳...' : '🌍 OSM Live'}
                                        </button>
                                    )}
                                    <button
                                        onClick={() => {
                                            JetLagAudio.playUiClick();
                                            setShowAtlasVoronoi(!showAtlasVoronoi);

                                            showAtlasVoronoi
                                                ? 'bg-jl-green text-white border-white'
                                                : 'bg-jl-dark text-jl-cream/70 border-jl-cream/25'
                                        }`}
                                        title="Vis eller skjul Voronoi-skæringslinjer mellem punkterne"
                                    >
                                        📐 Zoner
                                    </button>
                                    {activeAtlasCategory && (
                                        <button
                                            onClick={() => {
                                                JetLagAudio.playUiClick();
                                                setActiveAtlasCategory(null);
                                            }}

                                            title="Sluk kort-lag"
                                        >
                                            ✕
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* FÆLLES KORT-ATLAS & SPØRGSMÅLS-OVERSIGT (Tilgængelig for BÅDE Gemmere og Findere!) */}
                    {activeTool === 'atlas' && (
                        <div className="jl-anim-sheet absolute bottom-24 left-1/2 -translate-x-1/2 z-[550] w-[95%] max-w-lg bg-jl-navy border-3 border-jl-cream rounded-3xl p-4 sm:p-5 shadow-2xl text-jl-cream max-h-[72vh] flex flex-col">
                            <div className="flex justify-between items-center mb-2.5">

                                    <span className="bg-jl-yellow text-jl-navy font-display font-black px-2 py-0.5 rounded text-[10px] uppercase">

                                    </span>
                                    <h3 className="font-display font-black text-2xl uppercase tracking-wide mt-0.5 text-jl-cream">
                                        UDForsk KORT-LAG & SPØRGSMÅL
                                    </h3>
                                </div>
                                <button onClick={() => setActiveTool(null)} className="text-jl-cream/60 hover:text-white font-bold text-xl px-2">✕</button>
                            </div>

                                <button
                                    onClick={() => { JetLagAudio.playUiClick(); setAtlasModalTab('map_layers'); }}

                                        atlasModalTab === 'map_layers'
                                            ? 'bg-jl-yellow text-jl-navy shadow'
                                            : 'text-jl-cream/70 hover:text-white'
                                    }`}
                                >
                                    🗺️ KORT-LAG (LUFTHAVNE, TOG M.M.)
                                </button>
                                <button
                                    onClick={() => { JetLagAudio.playUiClick(); setAtlasModalTab('all_questions'); }}
                                    className={`py-2 rounded-xl font-display font-black uppercase text-xs sm:text-sm transition-all ${
                                        atlasModalTab === 'all_questions'
                                            ? 'bg-jl-green text-white shadow'
                                            : 'text-jl-cream/70 hover:text-white'

                            {atlasModalTab === 'map_layers' ? (

                                        <div className="text-xs text-jl-cream/85 leading-snug">

                                            <button
                                                onClick={() => handleScanLiveOSM(activeAtlasCategory)}
                                                disabled={isScanningOsm}
                                                className="shrink-0 bg-jl-yellow text-jl-navy font-display font-black text-xs uppercase px-3 py-1.5 rounded-xl shadow"
                                            >
                                                {isScanningOsm ? 'Scanner...' : '🌍 Scan OSM Live'}
                                            </button>
                                        )}
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        {ATLAS_CATEGORIES.map(cat => {
                                            const isSelected = activeAtlasCategory === cat.id;
                                            const count = (BUILTIN_GEO_DATA[cat.id] || []).length;
                                            const near = getNearestPOI(myCoords.lat, myCoords.lng, BUILTIN_GEO_DATA[cat.id] || []);
                                            return (
                                                <button
                                                    key={cat.id}
                                                    onClick={() => {
                                                        JetLagAudio.playUiClick();
                                                        if (isSelected) {
                                                            setActiveAtlasCategory(null);
                                                        } else {
                                                            setActiveAtlasCategory(cat.id);
                                                            notify(`🗺️ Viser ${cat.label} på kortet!`);
                                                        }
                                                    }}
                                                    className={`p-2.5 rounded-2xl border-2 text-left transition-all flex flex-col justify-between ${
                                                        isSelected
                                                            ? 'bg-jl-yellow text-jl-navy border-white shadow-lg scale-[1.02]'
                                                            : 'bg-jl-dark hover:bg-slate-800 text-jl-cream border-jl-cream/15'
                                                    }`}

                                                    <div>
                                                        <div className="flex items-center justify-between gap-1">
                                                            <span className="font-display font-black text-sm sm:text-base uppercase leading-tight">
                                                                {cat.icon} {cat.label}
                                                            </span>
                                                            <span className={`text-[10px] font-black px-1.5 py-0.5 rounded-full ${
                                                                isSelected ? 'bg-jl-navy text-jl-yellow' : 'bg-jl-navy text-jl-cream/70'
                                                            }`}>
                                                                {count}
                                                            </span>
                                                        </div>
                                                        <div className={`text-[10px] mt-0.5 line-clamp-1 ${isSelected ? 'text-jl-navy/80 font-bold' : 'text-jl-cream/60'}`}>

                                                    </div>
                                                    {near && (
                                                        <div className={`mt-2 pt-1.5 border-t text-[10px] font-bold truncate ${
                                                            isSelected ? 'border-jl-navy/20 text-jl-navy' : 'border-jl-cream/10 text-jl-yellow'
                                                        }`}>
                                                            📍 Nærmeste: {near.name} ({near.distanceKm.toFixed(1)} km)
                                                        </div>
                                                    )}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            ) : (
                                <div className="flex-1 overflow-y-auto pr-1 no-scrollbar space-y-3 text-xs">
                                    <div className="bg-jl-dark p-3.5 rounded-2xl border border-jl-cream/15">
                                        <div className="font-display font-black text-base text-jl-yellow uppercase mb-1">
                                            🧩 1. MATCHING (20 SPØRGSMÅL • GEMMER TRÆKKER 3, BEHOLDER 1)
                                        </div>
                                        <p className="text-jl-cream/80 mb-2">
                                            Format: <i>"Er din nærmeste ___ den samme som vores ___?"</i> Dela kortet op i eksakte Voronoi-zoner. Tryk på en kategori for at se grænserne på kortet:
                                        </p>
                                        <div className="flex flex-wrap gap-1.5">
                                            {OFFICIAL_MATCHING_QUESTIONS.map(q => (
                                                <button
                                                    key={q.id}
                                                    onClick={() => {
                                                        if (BUILTIN_GEO_DATA[q.id]) {
                                                            setActiveAtlasCategory(q.id);
                                                            setAtlasModalTab('map_layers');
                                                        }
                                                    }}
                                                    className="bg-jl-navy hover:bg-jl-yellow hover:text-jl-navy border border-jl-cream/20 px-2.5 py-1 rounded-lg font-bold transition-colors"
                                                >
                                                    {q.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="bg-jl-dark p-3.5 rounded-2xl border border-jl-cream/15">
                                        <div className="font-display font-black text-base text-jl-orange uppercase mb-1">
                                            📏 2. MEASURING (20 SPØRGSMÅL • GEMMER TRÆKKER 3, BEHOLDER 1)
                                        </div>
                                        <p className="text-jl-cream/80 mb-2">
                                            Format: <i>"Sammenlignet med os, er du tættere på eller længere fra ___?"</i> Tegner afstandscirkler om alle punkter i kategorien:
                                        </p>
                                        <div className="flex flex-wrap gap-1.5">
                                            {OFFICIAL_MEASURING_QUESTIONS.map((q, i) => (
                                                <button
                                                    key={`${q.id}_${i}`}
                                                    onClick={() => {
                                                        if (BUILTIN_GEO_DATA[q.id]) {
                                                            setActiveAtlasCategory(q.id);
                                                            setAtlasModalTab('map_layers');
                                                        }
                                                    }}
                                                    className="bg-jl-navy hover:bg-jl-orange hover:text-white border border-jl-cream/20 px-2.5 py-1 rounded-lg font-bold transition-colors"
                                                >
                                                    {q.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="bg-jl-dark p-3.5 rounded-2xl border border-jl-cream/15">
                                        <div className="font-display font-black text-base text-jl-green uppercase mb-1">
                                            🎯 3. RADARS & 🌡️ 4. THERMOMETERS (GEMMER TRÆKKER 2, BEHOLDER 1)
                                        </div>
                                        <p className="text-jl-cream/80">
                                            <b>Radars (10 stk):</b> 400m, 800m, 1.6km, 4.8km, 8km, 16.1km, 40.2km, 80.5km, 160.9km + Valgfri.<br/>
                                            <b>Thermometers (4 stk):</b> Rejs 800m, 4.8km, 16.1km eller 80.5km og få at vide om du er Varmere eller Koldere.
                                        </p>
                                    </div>

                                    <div className="bg-jl-dark p-3.5 rounded-2xl border border-jl-cream/15">
                                        <div className="font-display font-black text-base text-purple-400 uppercase mb-1">
                                            🐙 5. TENTACLES (GEMMER TRÆKKER 4, BEHOLDER 2) & 📸 6. PHOTOS (TRÆK 1)
                                        </div>
                                        <p className="text-jl-cream/80 mb-2">
                                            <b>Tentacles:</b> Museer, Biblioteker, Biografer, Hospitaler (1,6 km) & Metro, Togstationer, Zoo, Akvarium, Forlystelsesparker (24,1 km).<br/>
                                            <b>Photos (18 stk):</b> Bygning fra station, Bredeste gade, Et træ, Højeste struktur, Selfie, Himlen, 2/5 bygninger, Restaurant, Park, Supermarkedsgang, Togperron m.fl.
                                        </p>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {}
                    {/* GEMMERENS UNDER-MENU: TAKTIK, DE ANDRES ZONER & 500M GEMMEZONE */}
                    {myRole === 'hider' && activeTool === 'hider_tactics' && (
                        <div className="jl-anim-sheet absolute bottom-24 left-1/2 -translate-x-1/2 z-[550] w-[94%] max-w-md bg-jl-navy border-3 border-jl-cream rounded-3xl p-5 shadow-2xl text-jl-cream max-h-[70vh] flex flex-col">
                            <div className="flex justify-between items-center mb-3">
                                <div>
                                    <span className="bg-jl-green text-white font-display font-black px-2 py-0.5 rounded text-[10px] uppercase">
                                        🛡️ GEMMER UNDER-MENU
                                    </span>
                                    <h3 className="font-display font-black text-2xl uppercase tracking-wide mt-0.5 text-jl-yellow">
                                        TAKTIK & FINDERNES ZONER
                                    </h3>
                                </div>
                                <button onClick={() => setActiveTool(null)} className="text-jl-cream/60 hover:text-white font-bold text-xl px-2">✕</button>
                            </div>

                            <div className="flex-1 overflow-y-auto pr-1 no-scrollbar space-y-3">
                                {/* 1. Din 500m Gemmezone & Nærmeste Station */}
                                <div className="bg-jl-dark p-3.5 rounded-2xl border border-jl-green/40 space-y-2">
                                    <div className="flex items-center justify-between">
                                        <span className="font-display font-black text-base uppercase text-jl-green">
                                            🛡️ DIN 500M GEMME-ZONE
                                        </span>
                                        <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-jl-green/20 text-jl-green">

                                    </div>
                                    {hiderNearestStation && (
                                        <div className="text-xs text-jl-cream/85">
                                            Nærmeste togstation: <b className="text-jl-yellow">{hiderNearestStation.name}</b> ({Math.round(hiderNearestStation.distanceKm * 1000)} m væk)

                                                <span className="ml-1 text-jl-green font-bold">✓ Inden for 500m!</span>
                                            ) : (
                                                <span className="ml-1 text-jl-orange font-bold">⚠️ Mere end 500m fra station</span>
                                            )}
                                        </div>
                                    )}
                                    <button
                                        onClick={() => {
                                            JetLagAudio.playUiClick();
                                            if (hiderLockedSpot) {
                                                setHiderLockedSpot(null);
                                                notify("500m Gemme-zone følger nu din GPS igen.");
                                            } else {
                                                setHiderLockedSpot({ lat: myCoords.lat, lng: myCoords.lng });
                                                notify("🛡️ Dit 500m Gemmested er nu låst fast på kortet!");
                                            }
                                        }}
                                        className={`w-full py-2.5 rounded-xl font-display font-black text-sm uppercase shadow transition-colors ${
                                            hiderLockedSpot
                                                ? 'bg-jl-orange text-white'
                                                : 'bg-jl-green text-white hover:bg-emerald-500'
                                        }`}
                                    >
                                        {hiderLockedSpot ? '🔓 Lås 500m Zone Op (Følg GPS)' : '🔒 Lås 500m Zone Fast Her'}

                                        </div>
