                            >
                                🗺️ {mapTheme === 'map-mint' ? 'Mint' : mapTheme === 'map-clean' ? 'Kort' : 'Nat'}
                            </button>
                            <button
                                onClick={() => setShowHubs(!showHubs)}
                                className={`px-2 py-1 rounded-xl font-display font-bold text-[11px] uppercase tracking-wider shrink-0 ${
                                    showHubs ? 'bg-jl-yellow text-jl-navy' : 'bg-jl-dark text-jl-cream/60'
                                }`}
                            >
                                🚆 St.
                            </button>
                            <button
                                onClick={() => {
                                    setManualGpsMode(!manualGpsMode);
                                    notify(!manualGpsMode ? "Test-GPS: Tryk på kortet for at flytte dig!" : "Telefonens Live GPS er aktiv.");
                                }}
                                className={`px-2 py-1 rounded-xl font-display font-bold text-[11px] uppercase tracking-wider shrink-0 ${
                                    manualGpsMode ? 'bg-jl-red text-white animate-pulse' : 'bg-jl-dark text-jl-cream/70'
                                }`}
                            >
                                📍 {manualGpsMode ? 'Flyt=Tryk' : 'Live GPS'}
                            </button>
                        </div>
                    </div>

                    {/* Floating Mobile "Center on my GPS" Button */}
                    <button
                        onClick={() => {
                            if (mapInstanceRef.current) {
                                mapInstanceRef.current.flyTo([myCoords.lat, myCoords.lng], 14, { duration: 0.6 });
                            }
                        }}
                        className="absolute bottom-24 right-3 z-[480] pointer-events-auto w-11 h-11 rounded-2xl bg-jl-navy border-2 border-jl-cream text-jl-yellow shadow-xl flex items-center justify-center active:scale-95"
                        title="Centrér kortet på min position"
                    >
                        🎯
                    </button>

                    {/* 10–15 SEKUNDERS JET LAG TELEMETRI & SPÆNDINGS-OVERLAY */}
                    {pendingTelemetry && (
                        <div className="fixed inset-0 z-[700] bg-jl-dark/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-jl-navy border-4 border-jl-cream rounded-3xl max-w-md w-full p-6 text-center text-jl-cream shadow-2xl relative overflow-hidden">
                                <div className="inline-block bg-jl-yellow text-jl-navy font-display font-black text-xs uppercase tracking-widest px-3 py-1 rounded jl-slanted-badge mb-3">
                                    🛰️ JET LAG TELEMETRI • {pendingTelemetry.category}
                                </div>

                                <h3 className="font-display font-black text-3xl uppercase tracking-wide text-jl-cream mb-1">
                                    {pendingTelemetry.title}
                                </h3>
                                <p className="text-xs text-jl-cream/80 mb-5 px-2">
                                    {pendingTelemetry.questionText}
                                </p>

                                {/* Animated Radar Sweep Circle */}
                                <div className="relative w-32 h-32 mx-auto mb-5 rounded-full border-4 border-jl-yellow/40 bg-jl-dark flex items-center justify-center overflow-hidden shadow-inner">
                                    <div className="absolute inset-0 rounded-full border border-jl-yellow/20 scale-75" />
                                    <div className="absolute inset-0 rounded-full border border-jl-yellow/20 scale-50" />
                                    <div
                                        className="absolute inset-0 jl-radar-sweep"
                                        style={{
                                            background: 'conic-gradient(from 0deg, transparent 70%, rgba(243, 178, 41, 0.55) 100%)'
                                        }}
                                    />
                                    <span className="relative z-10 font-display font-black text-4xl text-jl-yellow">
                                        {pendingTelemetry.secondsLeft}s
                                    </span>
                                </div>

                                <div className="font-display font-extrabold text-base uppercase tracking-wider text-jl-green mb-3 animate-pulse">
                                    {pendingTelemetry.stepText}
                                </div>

                                {/* Progress Bar */}
                                <div className="w-full h-3 bg-jl-dark rounded-full overflow-hidden border border-jl-cream/20 mb-3">
                                    <div
                                        className="h-full bg-gradient-to-r from-jl-yellow via-jl-orange to-jl-red transition-all duration-700"
                                        style={{
                                            width: `${((pendingTelemetry.totalSeconds - pendingTelemetry.secondsLeft) / pendingTelemetry.totalSeconds) * 100}%`
                                        }}
                                    />
                                </div>

                                <div className="text-[11px] font-bold text-jl-cream/60 uppercase">
                                    🃏 Gemmer-belønning: {pendingTelemetry.cardReward}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* DRAMATISK JET LAG SVAR-REVEAL STAMP OVERLAY */}
                    {revealOverlay && (
                        <div
                            onClick={() => setRevealOverlay(null)}
                            className="fixed inset-x-0 top-24 z-[680] flex justify-center px-4 pointer-events-auto cursor-pointer"
                        >
                            <div className={`jl-stamp-reveal max-w-lg w-full rounded-3xl border-4 p-5 shadow-2xl text-center ${
                                revealOverlay.isPositive
                                    ? 'bg-jl-navy border-jl-green text-jl-cream'
                                    : 'bg-jl-navy border-jl-red text-jl-cream'
                            }`}>
                                <div className="inline-block bg-jl-yellow text-jl-navy font-display font-black text-xs uppercase px-3 py-0.5 rounded mb-1">
                                    🚨 OFFICIELT SVAR MODTAGET • {revealOverlay.category}
                                </div>
                                <div className={`font-display font-black text-3xl sm:text-4xl uppercase tracking-wider my-1 ${
                                    revealOverlay.isPositive ? 'text-jl-green' : 'text-jl-red'
                                }`}>
                                    {revealOverlay.headline}
                                </div>
                                <p className="text-xs sm:text-sm font-bold text-jl-cream/90 mb-2">
                                    {revealOverlay.subtext}
                                </p>
                                <div className="flex items-center justify-between text-[11px] text-jl-yellow font-display font-bold uppercase pt-2 border-t border-jl-cream/15">
                                    <span>🃏 {revealOverlay.cardReward}</span>
                                    <span>(Klik for at lukke)</span>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* HIDER EXCLUSIVE TOP-LEFT LIVE CHASER TRACKER WIDGET */}
                    {myRole === 'hider' && (
                        <div className="absolute top-28 sm:top-20 left-2.5 z-[480] pointer-events-auto bg-jl-navy/95 border-2 border-jl-green rounded-2xl p-2.5 sm:p-3 shadow-xl max-w-[250px] sm:max-w-xs text-jl-cream">
                            <div className="flex items-center justify-between gap-2 mb-1">
                                <span className="font-display font-black text-xs uppercase tracking-wider text-jl-green flex items-center gap-1">
                                    📡 LIVE FINDER-AFSTAND
                                </span>
                                <span className="text-[10px] bg-jl-green/20 text-jl-green px-2 py-0.5 rounded font-bold">
                                    500m Zone Aktiv
                                </span>
                            </div>
                            {chasersWithDistance.length === 0 ? (
                                <div className="text-xs text-jl-cream/60">
                                    Ingen spillere på Finder-holdet endnu. (Du kan skifte rolle i Rum/Hold).
                                </div>
                            ) : (
                                <div className="space-y-1.5">
                                    {chasersWithDistance.map(ch => (
                                        <div
                                            key={ch.uid}
                                            onClick={() => mapInstanceRef.current?.flyTo([ch.lat, ch.lng], 13)}
                                            className={`flex items-center justify-between px-2.5 py-1.5 rounded-xl cursor-pointer border transition-colors ${
                                                ch.distanceKm < 2
                                                    ? 'bg-jl-red/30 border-jl-red animate-pulse'
                                                    : 'bg-jl-dark border-jl-cream/15 hover:border-jl-yellow'
                                            }`}
                                        >
                                            <span className="font-bold text-xs">🔍 {ch.name}</span>
                                            <span className="font-display font-black text-sm text-jl-yellow">
                                                {ch.distanceKm < 1
                                                    ? `${Math.round(ch.distanceKm * 1000)} m væk!`
                                                    : `${ch.distanceKm.toFixed(1)} km væk`}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {/* Urgent Banner if Seekers sent a Photo/Manual question! */}
                            {pendingManualQuestions.length > 0 && (
                                <button
                                    onClick={() => setActiveTool('hider_inbox')}
                                    className="mt-2.5 w-full bg-jl-red hover:bg-red-600 text-white font-display font-black text-sm uppercase py-2 px-3 rounded-xl shadow-lg animate-bounce flex items-center justify-center gap-1.5"
                                >
                                    📸 {pendingManualQuestions.length} NYT SPØRGSMÅL FRA FINDERNE! (KLIK)
                                </button>
                            )}
                        </div>
                    )}

                    {/* Toast Notification Banner */}
                    {statusBanner && (
                        <div className="absolute top-24 left-1/2 -translate-x-1/2 z-[600] bg-jl-yellow text-jl-navy border-2 border-jl-navy px-5 py-2 rounded-xl font-display font-black text-base sm:text-lg uppercase tracking-wide shadow-2xl jl-slanted-badge text-center max-w-md">
                            {statusBanner}
                        </div>
                    )}

                    {myRole === 'seeker' && activeTool === 'questions' && (
                        <div className="absolute bottom-28 left-1/2 -translate-x-1/2 z-[550] w-[95%] max-w-lg bg-jl-navy border-3 border-jl-cream rounded-3xl p-4 sm:p-5 shadow-2xl text-jl-cream max-h-[72vh] flex flex-col">
                            <div className="flex justify-between items-center mb-2.5">
                                <div>
                                    <span className="bg-jl-yellow text-jl-navy font-display font-black px-2 py-0.5 rounded text-[11px] uppercase">
                                        📘 OFFICIEL JET LAG HIDE + SEEK REGELBOG (80 SPØRGSMÅL)
                                    </span>
                                    <h3 className="font-display font-black text-2xl uppercase tracking-wide mt-0.5 text-jl-cream">
                                        VÆLG OFFICIELT SPØRGSMÅL
                                    </h3>
                                </div>
                                <button onClick={() => setActiveTool(null)} className="text-jl-cream/60 hover:text-white font-bold text-xl px-2">✕</button>
                            </div>

                            {/* Category Selector Tabs with Official Card Draw Costs */}
                            <div className="grid grid-cols-3 sm:grid-cols-6 gap-1.5 mb-3 bg-jl-dark p-1.5 rounded-2xl border border-jl-cream/15">
                                {[
                                    { id: 'matching', icon: '🧩', label: 'Matching', cost: 'Træk 3, Beh. 1' },
                                    { id: 'measuring', icon: '📏', label: 'Measuring', cost: 'Træk 3, Beh. 1' },
                                    { id: 'radar', icon: '🎯', label: 'Radars', cost: 'Træk 2, Beh. 1' },
                                    { id: 'thermometer', icon: '🌡️', label: 'Thermo', cost: 'Træk 2, Beh. 1' },
                                    { id: 'tentacles', icon: '🐙', label: 'Tentacles', cost: 'Træk 4, Beh. 2' },
                                    { id: 'photos', icon: '📸', label: 'Photos', cost: 'Træk 1, Beh. 1' }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setQuestionTab(tab.id)}
                                        className={`py-1.5 px-1 rounded-xl font-display font-black uppercase text-xs flex flex-col items-center transition-all ${
                                            questionTab === tab.id
                                                ? 'bg-jl-yellow text-jl-navy shadow scale-[1.03]'
                                                : 'text-jl-cream/70 hover:text-white'
                                        }`}
                                    >
                                        <span className="text-base leading-none mb-0.5">{tab.icon}</span>
                                        <span>{tab.label}</span>
                                        <span className="text-[8px] opacity-75 font-sans font-bold">{tab.cost}</span>
                                    </button>
                                ))}
                            </div>

                            <div className="flex-1 overflow-y-auto pr-1 no-scrollbar space-y-3">
                                {/* TAB 1: OFFICIAL RADARS (10 SPØRGSMÅL) */}
                                {questionTab === 'radar' && (
                                    <div className="bg-jl-dark p-4 rounded-2xl border border-jl-cream/15 space-y-3">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <div className="font-display font-black text-lg text-jl-yellow uppercase">
                                                    🎯 RADAR: "Are you within ___ of me?"
                                                </div>
                                                <p className="text-[11px] text-jl-cream/75">
                                                    Officiel pris: Gemmer trækker 2 kort, beholder 1 • 12 sek. telemetri-ventetid
                                                </p>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-3 gap-2">
                                            {OFFICIAL_RADAR_DISTANCES.map(r => {
                                                const used = isQuestionUsed(`radar_${r.km}`);
                                                return (
                                                    <button
                                                        key={r.km}
                                                        onClick={() => setQRadarKm(r.km)}
                                                        className={`p-2 rounded-xl font-display font-black text-xs uppercase border text-center relative ${
                                                            Number(qRadarKm) === r.km
                                                                ? 'bg-jl-yellow text-jl-navy border-white'
                                                                : 'bg-jl-navy text-jl-cream border-jl-cream/20'

                                        ) : (
                                            teamBPlayers.map(p => (
                                                <div key={p.uid} className="font-bold text-jl-cream">• {p.name} {p.uid === user?.uid ? '(Dig)' : ''}</div>
                                            ))
                                        )}
                                    </div>
                                    {myTeam !== 'teamB' && (
                                        <button
                                            onClick={() => setMyTeam('teamB')}
                                            className="w-full bg-jl-navy hover:bg-slate-800 border border-jl-cream/30 rounded-lg py-1 font-display font-bold text-xs uppercase"
                                        >
                                            Skift til Hold 2
                                        </button>
                                    )}
                                </div>
                            </div>

                            <div className="flex gap-2">
                                <button
                                    onClick={handleNextRoundSwapTeams}
                                    className="flex-1 bg-jl-yellow hover:bg-amber-400 text-jl-navy font-display font-black text-sm sm:text-base uppercase py-2.5 rounded-xl shadow"
                                >
                                    🔄 NY RUNDE & BYT HOLD
                                </button>
                                <button
                                    onClick={handleLeaveAndCleanupRoom}
                                    className="px-3 bg-jl-red/20 hover:bg-jl-red text-jl-red hover:text-white border border-jl-red/40 font-display font-bold text-xs uppercase rounded-xl"
                                >
                                    Forlad Rum
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 2. RADIUS TOOL PANEL (WITH LIVE MAP PREVIEW) */}
                    {activeTool === 'radius' && (
                        <div className="absolute bottom-28 left-1/2 -translate-x-1/2 z-[550] w-[94%] max-w-md bg-jl-navy border-3 border-jl-cream rounded-3xl p-5 shadow-2xl text-jl-cream">
                            <div className="flex justify-between items-center mb-2">
                                <h3 className="font-display font-black text-2xl uppercase tracking-wide text-jl-yellow">
                                    🎯 RADIUS-SPØRGSMÅL (LIVE FORHÅNDSVISNING)
                                </h3>
                                <button onClick={() => setActiveTool(null)} className="text-jl-cream/60 hover:text-white font-bold text-xl px-2">✕</button>
                            </div>
                            <p className="text-xs text-jl-cream/75 mb-3">
                                Klik et sted på kortet for at flytte cirklens centrum, eller brug knapperne herunder:
                            </p>

                            <div className="flex gap-2 mb-3">
                                <button
                                    onClick={() => setRadiusCenter({ lat: myCoords.lat, lng: myCoords.lng })}
                                    className="flex-1 bg-jl-dark hover:bg-slate-800 border border-jl-cream/30 rounded-xl py-2 font-display font-bold text-xs uppercase tracking-wider"
                                >
                                    📍 Brug Min Position
                                </button>
                                <button
                                    onClick={() => {
                                        if (mapInstanceRef.current) {
                                            const c = mapInstanceRef.current.getCenter();
                                            setRadiusCenter({ lat: c.lat, lng: c.lng });
                                        }
                                    }}
                                    className="flex-1 bg-jl-dark hover:bg-slate-800 border border-jl-cream/30 rounded-xl py-2 font-display font-bold text-xs uppercase tracking-wider"
                                >
                                    ⊕ Brug Kortets Midte
                                </button>
                            </div>

                            <div className="mb-3">
                                <div className="flex justify-between font-display font-bold uppercase text-sm mb-1">
                                    <span className="text-jl-yellow">Radius (km):</span>
                                    <span>{radiusKm} km</span>
                                </div>
                                <div className="flex items-center gap-3">
                                    <input
                                        type="range"
                                        min="0.5"
                                        max="80"
                                        step="0.5"
                                        value={radiusKm}
                                        onChange={e => setRadiusKm(e.target.value)}
                                        className="flex-1 accent-amber-400"
                                    />
                                    <input
                                        type="number"
                                        value={radiusKm}
                                        onChange={e => setRadiusKm(e.target.value)}
                                        className="w-20 bg-jl-dark border border-jl-cream/30 rounded-lg px-2 py-1 text-center font-bold"
                                    />
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-2.5 mb-4">
                                <button
                                    onClick={() => setRadiusInvert(false)}
                                    className={`p-2.5 rounded-xl border-2 text-left ${
                                        !radiusInvert ? 'bg-jl-red/25 border-jl-red' : 'bg-jl-dark border-jl-cream/15 opacity-60'
                                    }`}
                                >
                                    <div className="font-display font-black text-sm uppercase text-jl-red">
                                        SVAR: NEJ (Uden for {radiusKm} km)
                                    </div>
                                    <div className="text-[11px] text-jl-cream/80">
                                        Farver selve cirklen rød
                                    </div>
                                </button>
                                <button
                                    onClick={() => setRadiusInvert(true)}
                                    className={`p-2.5 rounded-xl border-2 text-left ${
                                        radiusInvert ? 'bg-jl-green/25 border-jl-green' : 'bg-jl-dark border-jl-cream/15 opacity-60'
                                    }`}
                                >
                                    <div className="font-display font-black text-sm uppercase text-jl-green">
                                        SVAR: JA (Inden for {radiusKm} km)
                                    </div>
                                    <div className="text-[11px] text-jl-cream/80">
                                        Farver alt UDENFOR cirklen rødt!
                                    </div>
                                </button>
                            </div>

                            <button
                                onClick={handleSaveRadius}
                                className="w-full bg-jl-red hover:bg-red-600 text-white font-display font-black text-xl uppercase tracking-wider py-3 rounded-xl shadow-lg"
                            >
                                GEM RØD RADIUS PÅ KORTET
                            </button>
                        </div>
                    )}

                    {/* 3. POLYGON / FREEHAND RED ZONE TOOL */}
                    {activeTool === 'polygon' && (
                        <div className="absolute bottom-28 left-1/2 -translate-x-1/2 z-[550] w-[94%] max-w-md bg-jl-navy border-3 border-jl-cream rounded-3xl p-5 shadow-2xl text-jl-cream">
                            <div className="flex justify-between items-center mb-2">
                                <h3 className="font-display font-black text-2xl uppercase tracking-wide text-jl-red">
                                    ✏️ TEGN RØD ZONE ({polyPoints.length} PUNKTER)
                                </h3>
                                <button onClick={() => { setPolyPoints([]); setActiveTool(null); }} className="text-jl-cream/60 hover:text-white font-bold text-xl px-2">✕</button>
                            </div>
                            <p className="text-xs text-jl-cream/75 mb-3">
                                Klik rundt på kortet (mindst 3 hjørner) eller tilføj punkter ved sigtekornet i midten:
                            </p>

                            <div className="flex gap-2 mb-3">
                                <button
                                    onClick={() => {
                                        if (mapInstanceRef.current) {
                                            const c = mapInstanceRef.current.getCenter();
                                            setPolyPoints(prev => [...prev, { lat: c.lat, lng: c.lng }]);
                                        }
                                    }}
                                    className="flex-1 bg-jl-dark hover:bg-slate-800 border border-jl-cream/30 rounded-xl py-2 font-display font-bold text-xs uppercase"
                                >
                                    ⊕ Tilføj Punkt i Midten
                                </button>
                                <button
                                    onClick={() => setPolyPoints(prev => prev.slice(0, -1))}
                                    disabled={polyPoints.length === 0}
                                    className="px-3 bg-jl-dark hover:bg-slate-800 disabled:opacity-40 border border-jl-cream/30 rounded-xl py-2 font-display font-bold text-xs uppercase"
                                >
                                    ↩ Fortryd Punkt
                                </button>
                                <button
                                    onClick={() => setPolyInvert(!polyInvert)}
                                    className={`px-3 rounded-xl border font-display font-bold text-xs uppercase ${
                                        polyInvert ? 'bg-jl-yellow text-jl-navy border-white' : 'bg-jl-dark text-jl-cream border-jl-cream/30'
                                    }`}
                                >
                                    {polyInvert ? 'Udenfor=Rød' : 'Indeni=Rød'}
                                </button>
                            </div>

                            <button
                                onClick={handleSavePolygon}
                                disabled={polyPoints.length < 3}
                                className="w-full bg-jl-red hover:bg-red-600 disabled:opacity-40 text-white font-display font-black text-xl uppercase tracking-wider py-3 rounded-xl shadow-lg"
                            >
                                {polyPoints.length < 3 ? `KLIK ${3 - polyPoints.length} PUNKTER MERE PÅ KORTET` : 'GEM RØD ZONE PÅ KORTET'}
                            </button>
                        </div>
                    )}

                    {/* 4. THERMOMETER TOOL (WARMER / COLDER) */}
                    {activeTool === 'thermometer' && (
                        <div className="absolute bottom-28 left-1/2 -translate-x-1/2 z-[550] w-[94%] max-w-md bg-jl-navy border-3 border-jl-cream rounded-3xl p-5 shadow-2xl text-jl-cream">
                            <div className="flex justify-between items-center mb-2">
                                <h3 className="font-display font-black text-2xl uppercase tracking-wide text-jl-green">
                                    🌡️ TERMOMETER (VARMERE / KOLDERE)
                                </h3>
                                <button onClick={() => { setThermoA(null); setThermoB(null); setActiveTool(null); }} className="text-jl-cream/60 hover:text-white font-bold text-xl px-2">✕</button>
                            </div>
                            <p className="text-xs text-jl-cream/75 mb-3">
                                {!thermoA
                                    ? '1. Klik på kortet for at sætte dit START-punkt (A).'
                                    : !thermoB
                                    ? '2. Klik på kortet for at sætte dit SLUT-punkt (B) efter du har bevæget dig.'
                                    : '3. Vælg om gemmeren sagde Varmere eller Koldere:'}
                            </p>

                            <div className="grid grid-cols-2 gap-2.5 mb-3">
                                <button
                                    onClick={() => setThermoWarmer(true)}
                                    className={`p-2.5 rounded-xl border-2 font-display font-black uppercase ${
                                        thermoWarmer ? 'bg-jl-red text-white border-white' : 'bg-jl-dark text-jl-cream/60 border-jl-cream/20'
                                    }`}
                                >
                                    🔥 VARMERE (Tættere på B)
                                </button>
                                <button
                                    onClick={() => setThermoWarmer(false)}
                                    className={`p-2.5 rounded-xl border-2 font-display font-black uppercase ${
                                        !thermoWarmer ? 'bg-blue-600 text-white border-white' : 'bg-jl-dark text-jl-cream/60 border-jl-cream/20'
                                    }`}
                                >
                                    ❄️ KOLDERE (Tættere på A)
                                </button>
                            </div>

                            <div className="flex gap-2">
                                <button
                                    onClick={() => { setThermoA(null); setThermoB(null); }}
                                    className="px-4 bg-jl-dark border border-jl-cream/30 rounded-xl font-display font-bold uppercase text-xs"
                                >
                                    Nulstil A/B
                                </button>
                                <button
                                    onClick={handleSaveThermometer}
                                    disabled={!thermoA || !thermoB}
                                    className="flex-1 bg-jl-yellow hover:bg-amber-400 disabled:opacity-40 text-jl-navy font-display font-black text-xl uppercase tracking-wider py-3 rounded-xl shadow-lg"
                                >
                                    SKÆR KORTET OVER & GEM
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 5. ZONE LAYER MANAGER */}
                    {activeTool === 'layers' && (
                        <div className="absolute bottom-28 left-1/2 -translate-x-1/2 z-[550] w-[94%] max-w-md bg-jl-navy border-3 border-jl-cream rounded-3xl p-5 shadow-2xl text-jl-cream max-h-[55vh] flex flex-col">
                            <div className="flex justify-between items-center mb-3">
                                <h3 className="font-display font-black text-2xl uppercase tracking-wide text-jl-yellow">
                                    🗂️ AKTIVE RØDE ZONER ({mapObjects.length})
                                </h3>
                                <button onClick={() => setActiveTool(null)} className="text-jl-cream/60 hover:text-white font-bold text-xl px-2">✕</button>
                            </div>

                            <div className="flex-1 overflow-y-auto space-y-2 pr-1 no-scrollbar mb-3">
                                {mapObjects.length === 0 ? (
                                    <div className="text-center py-8 text-jl-cream/50 text-sm">
                                        Ingen røde zoner tegnet endnu. Brug værktøjerne i bunden!
                                    </div>
                                ) : (
                                    mapObjects.map((obj) => (
                                        <div key={obj.id} className="flex items-center justify-between bg-jl-dark border border-jl-cream/20 rounded-xl px-3.5 py-2.5">
                                            <div>
                                                <div className="font-bold text-sm text-jl-cream">{obj.label || obj.type}</div>
                                                <div className="text-[11px] text-jl-cream/50">Af {obj.createdByName || 'Spiller'}</div>
                                            </div>
                                            <button
                                                onClick={() => handleDeleteObject(obj.id)}
                                                className="bg-jl-red/20 hover:bg-jl-red text-jl-red hover:text-white px-3 py-1 rounded-lg font-display font-bold uppercase text-xs transition-colors"
                                            >
                                                Slet
                                            </button>
                                        </div>
                                    ))
                                )}
                            </div>

                            {mapObjects.length > 0 && (
                                <button
                                    onClick={handleClearAllZones}
                                    className="w-full bg-jl-red hover:bg-red-600 text-white font-display font-black uppercase tracking-wider py-2.5 rounded-xl"
                                >
                                    🗑️ RYD ALLE ZONER PÅ KORTET
                                </button>
                            )}
                        </div>
                    )}

                    {/* 6. GAME CHAT & QUICK QUESTIONS DRAWER */}
                    {activeTool === 'chat' && (
                        <div className="absolute bottom-28 right-3 left-3 sm:left-auto sm:w-96 z-[550] bg-jl-navy border-3 border-jl-cream rounded-3xl shadow-2xl flex flex-col overflow-hidden" style={{ height: '430px', maxHeight: '62vh' }}>
                            <div className="bg-jl-dark px-4 py-3 border-b border-jl-cream/20 flex justify-between items-center">
                                <div className="flex items-center gap-2">
                                    <span className="bg-jl-yellow text-jl-navy font-display font-black px-2 py-0.5 rounded text-xs uppercase -rotate-2">
                                        LIVE COMMS
                                    </span>
                                    <h3 className="font-display font-black text-xl text-jl-cream uppercase tracking-wide">
                                        SPØRGSMÅL & CHAT
                                    </h3>
                                </div>
                                <button onClick={() => setActiveTool(null)} className="text-jl-cream/60 hover:text-white font-bold text-lg">✕</button>
                            </div>

                            {/* Quick Jet Lag Question Chips */}
                            <div className="bg-jl-dark/60 px-3 py-2 border-b border-jl-cream/10 flex gap-1.5 overflow-x-auto no-scrollbar">
                                {[
                                    "❓ Er I mere end 10 km fra havet?",
                                    "❓ Er I inden for 15 km af os?",
                                    "❓ Er I inden for 5 km af en S-togsstation?",
                                    "🌡️ Vi har flyttet os 2 km – Varmere eller Koldere?",
                                    "✅ JA!",
                                    "❌ NEJ!"
                                ].map((q, i) => (
                                    <button
                                        key={i}
                                        onClick={() => sendChatMessage(q)}
                                        className="shrink-0 bg-jl-navy hover:bg-jl-yellow hover:text-jl-navy text-jl-cream border border-jl-cream/25 rounded-full px-2.5 py-1 text-[11px] font-bold transition-colors"
                                    >
                                        {q}
                                    </button>
                                ))}
                            </div>

                            {/* Messages List */}
                            <div className="flex-1 overflow-y-auto p-3.5 space-y-2.5 no-scrollbar">
                                {chatMessages.length === 0 ? (
                                    <div className="text-center text-jl-cream/40 text-xs py-10">
                                        Stil det første spørgsmål til det andet hold her!
                                    </div>
                                ) : (
                                    chatMessages.map(m => {
                                        const isMe = m.senderUid === user?.uid;
                                        const isRunner = m.role === 'hider';
                                        return (
                                            <div key={m.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                                                <div className="flex items-center gap-1.5 mb-0.5 px-1">
                                                    <span className={`text-[10px] font-display font-black uppercase px-1.5 py-0.2 rounded ${
                                                        isRunner ? 'bg-jl-green text-white' : 'bg-jl-yellow text-jl-navy'
                                                    }`}>
                                                        {isRunner ? 'GEMMER' : 'FINDER'}
                                                    </span>
                                                    <span className="text-xs font-bold text-jl-cream/80">{m.sender}</span>
                                                </div>
                                                <div className={`px-3.5 py-2 rounded-2xl text-sm font-medium max-w-[85%] shadow ${
                                                    isMe
                                                        ? 'bg-jl-yellow text-jl-navy font-bold rounded-br-xs'
                                                        : 'bg-jl-dark text-jl-cream border border-jl-cream/15 rounded-bl-xs'
                                                }`}>
                                                    {m.text}
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>

                            {/* Input Form */}
                            <form
                                onSubmit={(e) => { e.preventDefault(); sendChatMessage(); }}
                                className="p-2.5 bg-jl-dark border-t border-jl-cream/20 flex gap-2"
                            >
                                <input
                                    type="text"
                                    value={chatInput}
                                    onChange={e => setChatInput(e.target.value)}
                                    placeholder="Skriv spørgsmål eller svar..."
                                    className="flex-1 bg-jl-navy border border-jl-cream/30 rounded-xl px-3.5 py-2 text-sm text-jl-cream placeholder-jl-cream/40 focus:outline-none focus:border-jl-yellow"
                                />
                                <button
                                    type="submit"
                                    className="bg-jl-yellow hover:bg-amber-400 text-jl-navy font-display font-black uppercase px-4 rounded-xl text-sm tracking-wider"
                                >
                                    SEND
                                </button>
                            </form>
                        </div>
                    )}

                    {}
                    {myRole === 'seeker' ? (
                        /* =====================================================================
                           SEEKER (FINDER) INTERFACE DOCK: Question Menu + Map Plotting Tools
                           ===================================================================== */
                        <div className="absolute bottom-2 sm:bottom-3 left-1/2 -translate-x-1/2 z-[500] flex items-end gap-1 sm:gap-3 px-1.5 safe-bottom pointer-events-auto max-w-full">
                            {/* 0. Room & Teams Button */}
                            <div className="flex flex-col items-center jl-hex-shadow">
                                <button
                                    onClick={() => setActiveTool(activeTool === 'room' ? null : 'room')}
                                    className={`jl-hex-outer ${activeTool === 'room' ? 'active-hex' : ''}`}
                                    title="Privat Rum, Hold & Runde-skift"
                                >
                                    <div className="jl-hex-inner bg-jl-navy text-jl-yellow">
                                        <span className="font-display font-black text-base leading-none">R{roomState.roundNumber || 1}</span>
                                        <span className="text-[10px] font-bold text-jl-cream">HOLD</span>
                                    </div>
                                </button>
                                <span className="mt-1 bg-jl-navy text-jl-cream font-display font-extrabold text-[10px] sm:text-[11px] uppercase tracking-wider px-2 py-0.5 rounded border border-jl-cream/30">
                                    RUM / HOLD
                                </span>
                            </div>

                            {/* 1. ALL QUESTIONS MENU (AUTO-RESPONDER + PHOTOS) */}
                            <div className="flex flex-col items-center jl-hex-shadow">
                                <button
                                    onClick={() => setActiveTool(activeTool === 'questions' ? null : 'questions')}
                                    className={`jl-hex-outer ${activeTool === 'questions' ? 'active-hex' : ''}`}
                                    title="Spørgsmåls-Menu: Auto-Radar, Termometer, Matching, Measuring, Tentacles & Foto"
                                >
                                    <div className="jl-hex-inner bg-jl-orange text-jl-cream">
                                        <span className="font-display font-black text-2xl leading-none">?</span>
                                        <span className="text-[9px] font-black uppercase">AUTO</span>
                                    </div>
                                </button>
                                <span className="mt-1 bg-jl-yellow text-jl-navy font-display font-black text-[10px] sm:text-[11px] uppercase tracking-wider px-2 py-0.5 rounded border border-jl-navy shadow">
                                    SPØRGSMÅL
                                </span>
                            </div>

                            {/* 2. Manual Radius Tool */}
                            <div className="flex flex-col items-center jl-hex-shadow">
                                <button
                                    onClick={() => {
                                        if (activeTool !== 'radius' && mapInstanceRef.current) {
                                            const c = mapInstanceRef.current.getCenter();
                                            setRadiusCenter({ lat: c.lat, lng: c.lng });
                                        }
                                        setActiveTool(activeTool === 'radius' ? null : 'radius');
                                    }}
                                    className={`jl-hex-outer ${activeTool === 'radius' ? 'active-hex' : ''}`}
                                    title="Tegn Manuel Radius"
                                >
                                    <div className="jl-hex-inner bg-jl-navy text-jl-cream">
                                        <svg className="w-7 h-7" fill="none" stroke="currentColor" strokeWidth="2.4" viewBox="0 0 24 24">
                                            <circle cx="12" cy="12" r="9" />
                                            <circle cx="12" cy="12" r="3" fill="currentColor" />
                                        </svg>
                                    </div>
                                </button>
                                <span className="mt-1 bg-jl-navy text-jl-cream font-display font-extrabold text-[10px] sm:text-[11px] uppercase tracking-wider px-2 py-0.5 rounded border border-jl-cream/30">
                                    RADIUS
                                </span>
                            </div>

                            {/* 3. Freehand Red Zone Polygon */}
                            <div className="flex flex-col items-center jl-hex-shadow">
                                <button
                                    onClick={() => setActiveTool(activeTool === 'polygon' ? null : 'polygon')}
                                    className={`jl-hex-outer ${activeTool === 'polygon' ? 'active-hex' : ''}`}
                                    title="Tegn Rød Zone manuelt"
                                >
                                    <div className="jl-hex-inner bg-jl-red text-jl-cream">
                                        <svg className="w-7 h-7" fill="none" stroke="currentColor" strokeWidth="2.4" viewBox="0 0 24 24">
                                            <polygon points="12 2 22 8.5 18 21 6 21 2 8.5 12 2" />
                                        </svg>
                                    </div>
                                </button>
                                <span className="mt-1 bg-jl-navy text-jl-cream font-display font-extrabold text-[10px] sm:text-[11px] uppercase tracking-wider px-2 py-0.5 rounded border border-jl-cream/30">
                                    TEGN ZONE
                                </span>
                            </div>

                            {/* 4. Active Zones List / Undo */}
                            <div className="flex flex-col items-center jl-hex-shadow">
                                <button
                                    onClick={() => setActiveTool(activeTool === 'layers' ? null : 'layers')}
                                    className={`jl-hex-outer ${activeTool === 'layers' ? 'active-hex' : ''}`}
                                    title="Administrer og slet røde zoner"
                                >
                                    <div className="jl-hex-inner bg-jl-dark text-jl-cream relative">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24">
                                            <polygon points="12 2 2 7 12 12 22 7 12 2" />
                                            <polyline points="2 17 12 22 22 17" />
                                            <polyline points="2 12 12 17 22 12" />
                                        </svg>
                                        {mapObjects.length > 0 && (
                                            <span className="absolute top-1.5 right-2 bg-jl-red text-white text-[10px] font-black px-1.5 rounded-full">
                                                {mapObjects.length}
                                            </span>
                                        )}
                                    </div>
                                </button>
                                <span className="mt-1 bg-jl-navy text-jl-cream font-display font-extrabold text-[10px] sm:text-[11px] uppercase tracking-wider px-2 py-0.5 rounded border border-jl-cream/30">
                                    ZONER ({mapObjects.length})
                                </span>
                            </div>

                            {/* 5. Live Chat */}
                            <div className="flex flex-col items-center jl-hex-shadow">
                                <button
                                    onClick={() => {
                                        setUnreadCount(0);
                                        setActiveTool(activeTool === 'chat' ? null : 'chat');
                                    }}
                                    className={`jl-hex-outer ${activeTool === 'chat' ? 'active-hex' : ''}`}
                                    title="Åbn Spil-Chat"
                                >
                                    <div className="jl-hex-inner bg-jl-yellow text-jl-navy relative">
                                        <svg className="w-7 h-7" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                                        </svg>
                                        {unreadCount > 0 && (
                                            <span className="absolute top-1.5 right-2 bg-jl-red text-white text-[10px] font-black px-1.5 rounded-full animate-bounce">
                                                {unreadCount}
                                            </span>
                                        )}
                                    </div>
                                </button>
                                <span className="mt-1 bg-jl-navy text-jl-yellow font-display font-extrabold text-[10px] sm:text-[11px] uppercase tracking-wider px-2 py-0.5 rounded border border-jl-yellow/50">
                                    CHAT
                                </span>
                            </div>
                        </div>
                    ) : (
                        /* =====================================================================
                           HIDER (GEMMER) INTERFACE DOCK: Dedicated Runner Surveillance Controls
                           ===================================================================== */
                        <div className="absolute bottom-2 sm:bottom-3 left-1/2 -translate-x-1/2 z-[500] flex items-end gap-1.5 sm:gap-3 px-2 safe-bottom pointer-events-auto max-w-full">
                            {/* 0. Room & Teams */}
                            <div className="flex flex-col items-center jl-hex-shadow">
                                <button
                                    onClick={() => setActiveTool(activeTool === 'room' ? null : 'room')}
                                    className={`jl-hex-outer ${activeTool === 'room' ? 'active-hex' : ''}`}
                                >
                                    <div className="jl-hex-inner bg-jl-navy text-jl-yellow">
                                        <span className="font-display font-black text-base leading-none">R{roomState.roundNumber || 1}</span>
                                        <span className="text-[10px] font-bold text-jl-cream">HOLD</span>
                                    </div>
                                </button>
                                <span className="mt-1 bg-jl-navy text-jl-cream font-display font-extrabold text-[10px] sm:text-[11px] uppercase tracking-wider px-2 py-0.5 rounded border border-jl-cream/30">
                                    RUM / HOLD
                                </span>
                            </div>

                            {/* 1. Hider Question Inbox (Answer Photo/Manual questions) */}
                            <div className="flex flex-col items-center jl-hex-shadow">
                                <button
                                    onClick={() => setActiveTool(activeTool === 'hider_inbox' ? null : 'hider_inbox')}
                                    className={`jl-hex-outer ${activeTool === 'hider_inbox' ? 'active-hex' : ''}`}
                                    title="Se og besvar foto-spørgsmål fra Finderne"
                                >
                                    <div className="jl-hex-inner bg-jl-green text-white relative">
                                        <span className="text-xl leading-none">📸</span>
                                        <span className="text-[9px] font-black uppercase mt-0.5">INDBAKKE</span>
                                        {pendingManualQuestions.length > 0 && (
                                            <span className="absolute top-1 right-2 bg-jl-red text-white text-[10px] font-black px-1.5 rounded-full animate-bounce">
                                                {pendingManualQuestions.length}
                                            </span>
                                        )}
                                    </div>
                                </button>
                                <span className="mt-1 bg-jl-green text-white font-display font-black text-[10px] sm:text-[11px] uppercase tracking-wider px-2 py-0.5 rounded border border-white">
                                    SVAR ({pendingManualQuestions.length})
                                </span>
                            </div>

                            {/* 2. Lock 500m Hiding Zone Center */}
                            <div className="flex flex-col items-center jl-hex-shadow">
                                <button
                                    onClick={() => {
                                        if (hiderLockedSpot) {
                                            setHiderLockedSpot(null);
                                            notify("500m Gemme-zone følger nu din GPS igen.");
                                        } else {
                                            setHiderLockedSpot({ lat: myCoords.lat, lng: myCoords.lng });
                                            notify("🛡️ Dit 500m Gemmested er nu låst fast på kortet!");
                                        }
                                    }}
                                    className={`jl-hex-outer ${hiderLockedSpot ? 'active-hex' : ''}`}
                                    title="Lås dit 500m gemmested på kortet"
                                >
                                    <div className="jl-hex-inner bg-jl-navy text-jl-green">
                                        <span className="text-xl leading-none">🛡️</span>
                                        <span className="text-[9px] font-black uppercase mt-0.5">500M ZONE</span>
                                    </div>
                                </button>
                                <span className="mt-1 bg-jl-navy text-jl-cream font-display font-extrabold text-[10px] sm:text-[11px] uppercase tracking-wider px-2 py-0.5 rounded border border-jl-cream/30">
                                    {hiderLockedSpot ? 'LÅST ZONE' : 'LÅS 500M'}
                                </span>
                            </div>

                            {/* 3. Toggle Peek at Seekers' Red Zones */}
                            <div className="flex flex-col items-center jl-hex-shadow">
                                <button
                                    onClick={() => {
                                        setHiderShowSeekerZones(!hiderShowSeekerZones);
                                        notify(!hiderShowSeekerZones ? "Viser nu Findernes røde zoner på dit kort." : "Findernes røde zoner er skjult (Rent overvågningskort).");
                                    }}
                                    className={`jl-hex-outer ${hiderShowSeekerZones ? 'active-hex' : ''}`}
                                    title="Vis eller skjul hvad Finderne har udelukket på deres kort"
                                >
                                    <div className="jl-hex-inner bg-jl-dark text-jl-cream">
                                        <span className="text-xl leading-none">👁️</span>
                                        <span className="text-[9px] font-black uppercase mt-0.5">ZONER</span>
                                    </div>
                                </button>
                                <span className="mt-1 bg-jl-navy text-jl-cream font-display font-extrabold text-[10px] sm:text-[11px] uppercase tracking-wider px-2 py-0.5 rounded border border-jl-cream/30">
                                    {hiderShowSeekerZones ? 'SKJUL RØD' : 'SE RØD'}
                                </span>
                            </div>

                            {/* 4. Live Chat */}
                            <div className="flex flex-col items-center jl-hex-shadow">
                                <button
                                    onClick={() => {
                                        setUnreadCount(0);
                                        setActiveTool(activeTool === 'chat' ? null : 'chat');
                                    }}
                                    className={`jl-hex-outer ${activeTool === 'chat' ? 'active-hex' : ''}`}
                                >
                                    <div className="jl-hex-inner bg-jl-yellow text-jl-navy relative">
                                        <svg className="w-7 h-7" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                                        </svg>
                                        {unreadCount > 0 && (
                                            <span className="absolute top-1.5 right-2 bg-jl-red text-white text-[10px] font-black px-1.5 rounded-full animate-bounce">
                                                {unreadCount}
                                            </span>
                                        )}
                                    </div>
                                </button>
                                <span className="mt-1 bg-jl-navy text-jl-yellow font-display font-extrabold text-[10px] sm:text-[11px] uppercase tracking-wider px-2 py-0.5 rounded border border-jl-yellow/50">
                                    CHAT
                                </span>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [sessionInfo, setSessionInfo] = useState(() => loadActiveSession()); // Gendanner automatisk aktivt spil ved F5 / opdatering!
            const [isAuthenticating, setIsAuthenticating] = useState(false);
            const [roomError, setRoomError] = useState(null);

            useEffect(() => {
                if (!isCloudEnabled || !auth) {
                    let localUid = null;
                    try {
                        localUid = sessionStorage.getItem('jl_local_uid');
                        if (!localUid) {
                            localUid = 'local_' + Math.random().toString(36).slice(2, 10);
                            sessionStorage.setItem('jl_local_uid', localUid);
                        }
                    } catch (e) {
                        localUid = 'local_' + Math.random().toString(36).slice(2, 10);
                    }
                    setUser({ uid: localUid, isLocal: true });
                    return;
                }

                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (e) {
                        console.warn("Firebase Auth fallback til lokal bruger:", e);
                        setUser({ uid: 'local_' + Math.random().toString(36).slice(2, 10), isLocal: true });
                    }
                };
                initAuth();
                const unsub = onAuthStateChanged(auth, (u) => {
                    if (u) setUser(u);
                });
                return () => unsub();
            }, []);

            // Automatisk baggrunds-oprydning af udløbne rum i Firestore ved opstart
            useEffect(() => {
                if (!isCloudEnabled || !db || !user || user.isLocal) return;
                const roomsCol = collection(db, 'artifacts', appId, 'public', 'data', 'rooms');
                const unsubCleanup = onSnapshot(roomsCol, (snap) => {
                    const now = Date.now();
                    snap.forEach((roomDoc) => {
                        const data = roomDoc.data();
                        const lastActive = data.lastActiveMillis || data.createdAtMillis || 0;
                        if (lastActive > 0 && (now - lastActive) > INACTIVE_ROOM_TIMEOUT_MS) {
                            deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomDoc.id)).catch(() => {});
                        }
                    });
                }, () => {});
                return () => unsubCleanup();
            }, [user]);

            const handleJoinRoom = async ({ playerName, roomCode, isCreating, teamPreference }) => {
                setIsAuthenticating(true);
                setRoomError(null);
                JetLagAudio.init();

                try {
                    let currentUser = user;
                    if (isCloudEnabled && auth && !auth.currentUser) {
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                const cred = await signInWithCustomToken(auth, __initial_auth_token);
                                currentUser = cred.user;
                            } else {
                                const cred = await signInAnonymously(auth);
                                currentUser = cred.user;
                            }
                        } catch (authErr) {
                            currentUser = { uid: 'local_' + Math.random().toString(36).slice(2, 10), isLocal: true };
                            setUser(currentUser);
                        }
                    }

                    let chosenTeam = teamPreference === 'teamB' ? 'teamB' : 'teamA';
                    const now = Date.now();

                    if (isCloudEnabled && db && currentUser && !currentUser.isLocal) {
                        const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                        const snap = await getDoc(roomDocRef);

                        if (isCreating) {
                            const newRoomPayload = {
                                roomCode,
                                roundNumber: 1,
                                hidingTeam: 'teamA',
                                phase: 'hiding',
                                timerEndMillis: now + 45 * 60 * 1000,
                                isRunning: true,
                                botHiderStationIdx: Math.floor(Math.random() * BUILTIN_GEO_DATA.station.length),
                                createdBy: playerName,
                                createdAtMillis: now,
                                lastActiveMillis: now
                            };
                            await setDoc(roomDocRef, newRoomPayload);
                            if (teamPreference === 'auto') chosenTeam = 'teamA';
                        } else {
                            // STRENG VALIDERING: Hvis man vælger "Deltag i rum", SKAL rummet eksistere og være aktivt!
                            if (!snap.exists()) {
                                JetLagAudio.playErrorSound();
                                setRoomError(`Rummet "${roomCode}" er ikke oprettet endnu! Tjek koden eller tryk "➕ Opret Nyt Rum".`);
                                setIsAuthenticating(false);
                                return;
                            }
                            const roomData = snap.data();
                            const lastActive = roomData.lastActiveMillis || roomData.createdAtMillis || now;
                            if ((now - lastActive) > INACTIVE_ROOM_TIMEOUT_MS) {
                                // Rummet er forældet -> Slet det automatisk og afvis login
                                await deleteDoc(roomDocRef).catch(() => {});
                                JetLagAudio.playErrorSound();
                                setRoomError(`Rummet "${roomCode}" var inaktivt og er blevet lukket automatisk. Opret venligst et nyt rum.`);
                                setIsAuthenticating(false);
                                return;
                            }
                            // Opdater tidsstempel på det eksisterende rum
                            await updateDoc(roomDocRef, { lastActiveMillis: now }).catch(() => {});
                            if (teamPreference === 'auto') chosenTeam = 'teamB';
                        }
                    } else {
                        // Lokal tilstand (uden Firebase): Tjek sessionStorage / lokal hukommelse
                        const storedLocalRoom = sessionStorage.getItem(`jl_room_${roomCode}`);
                        const existsLocally = localActiveRoomsRegistry.has(roomCode) || Boolean(storedLocalRoom);

                        if (isCreating) {
                            const newRoomPayload = {
                                roomCode,
                                roundNumber: 1,
                                hidingTeam: 'teamA',
                                phase: 'hiding',
                                timerEndMillis: now + 45 * 60 * 1000,
                                isRunning: true,
                                createdBy: playerName,
                                createdAtMillis: now,
                                lastActiveMillis: now
                            };
                            localActiveRoomsRegistry.set(roomCode, newRoomPayload);
                            try { sessionStorage.setItem(`jl_room_${roomCode}`, JSON.stringify(newRoomPayload)); } catch (e) {}
                            if (teamPreference === 'auto') chosenTeam = 'teamA';
                        } else if (!existsLocally) {
                            JetLagAudio.playErrorSound();
                            setRoomError(`Rummet "${roomCode}" findes ikke! Du skal oprette rummet først på "➕ Opret Nyt Rum".`);
                            setIsAuthenticating(false);
                            return;
                        }
                    }

                    JetLagAudio.playIntroStinger();
                    const newSession = {
                        playerName,
                        roomCode,
                        initialTeam: chosenTeam,
                        teamPreference
                    };
                    saveActiveSession(newSession);
                    setSessionInfo(newSession);
                } catch (e) {
                    console.error("Join room error:", e);
                    setRoomError("Kunne ikke forbinde til rummet. Tjek din internetforbindelse.");
                } finally {
                    setIsAuthenticating(false);
                }
            };

            if (!sessionInfo || !user) {
                return (
                    <LoginScreen
                        onJoinRoom={handleJoinRoom}
                        isAuthenticating={isAuthenticating}
                        isCloudActive={isCloudEnabled && !user?.isLocal}
                        roomError={roomError}
                        onClearError={() => setRoomError(null)}
                    />
                );
            }

            return (
                <GameScreen
                    user={user}
                    sessionInfo={sessionInfo}
                    onLeaveRoom={(reasonMsg) => {
                        clearActiveSession();
                        setSessionInfo(null);
                        if (reasonMsg && typeof reasonMsg === 'string') {
                            setRoomError(reasonMsg);
                        }
                    }}
                    isCloudActive={isCloudEnabled && !user?.isLocal}
                />
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
