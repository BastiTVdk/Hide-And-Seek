        }

            transform: rotate(-4deg);
            box-shadow: 0 4px 0 rgba(18, 26, 36, 0.45);
        }
        
        /* Modernized Jet Lag Bottom Navigation Dock */
        .jl-dock-bar {
            background: rgba(18, 26, 36, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2.5px solid #ECECE4;
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55), 0 4px 0 rgba(18, 26, 36, 0.8);
        }
        .jl-dock-item {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 8px;
            border-radius: 16px;
            transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            touch-action: manipulation;
            min-width: 68px;

            box-shadow: 0 6px 14px rgba(46, 184, 92, 0.45);

        /* Dynamic Atlas Marker on Map */
        .jl-atlas-pin {
            display: inline-flex;

            gap: 4px;

            0% { transform: scale(2.4) rotate(-12deg); opacity: 0; }
            60% { transform: scale(0.92) rotate(-3deg); opacity: 1; }
            80% { transform: scale(1.04) rotate(-5deg); }
            100% { transform: scale(1) rotate(-4deg); opacity: 1; }

            0%, 100% { box-shadow: 0 0 0 0 rgba(243, 178, 41, 0.6); }
            50% { box-shadow: 0 0 0 14px rgba(243, 178, 41, 0); }
        }
        @keyframes jlModalPop {
            0% { opacity: 0; transform: translate(-50%, 28px) scale(0.88); }
            65% { opacity: 1; transform: translate(-50%, -4px) scale(1.02); }
            100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }
        @keyframes jlCenterModalPop {
            0% { opacity: 0; transform: scale(0.84) translateY(20px); }
            65% { opacity: 1; transform: scale(1.03) translateY(-3px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes jlDropdownPop {
            0% { opacity: 0; transform: translateY(-14px) scale(0.94); }
            70% { opacity: 1; transform: translateY(2px) scale(1.01); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes jlToastPop {
            0% { opacity: 0; transform: translate(-50%, -24px) rotate(-8deg) scale(0.8); }
            70% { opacity: 1; transform: translate(-50%, 3px) rotate(-3deg) scale(1.05); }

            animation: radarSweep 2.2s linear infinite;
        }
        .jl-stamp-reveal {
            animation: stampSlam 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;

        .jl-pulse-glow {
            animation: pulseGlow 1.6s infinite;
        }
        .jl-anim-sheet {
            animation: jlModalPop 0.34s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .jl-anim-center {
            animation: jlCenterModalPop 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .jl-anim-dropdown {
            animation: jlDropdownPop 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .jl-anim-toast {
            animation: jlToastPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;

        /* Scrollbars */

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, getDoc, addDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ============================================================================
        // INDSÆT DIN EGEN FIREBASE CONFIG HER HVIS DU ÅBNER FILEN DIREKTE I CHROME:
        // (Se guiden i chatten eller tryk på "⚙️ Chrome / Firebase Guide" inde i appen)
        // ============================================================================
        const EGEN_FIREBASE_CONFIG = {
            apiKey: "AIzaSyBnEPLeHJ6rgEnJZLHqre6ub7YDZw-m5ds",
            authDomain: "jetlag-v2.firebaseapp.com",

            messagingSenderId: "11880952266",
            appId: "1:11880952266:web:5e13b7c14c037f6c479f33"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'jetlag-cph-zone1-99';
        
        let parsedEnvConfig = null;
        try {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                parsedEnvConfig = JSON.parse(__firebase_config);
            }
        } catch (e) {
            console.warn("Kunne ikke læse miljø-config:", e);
        }

        // Prioritér altid EGEN_FIREBASE_CONFIG først, så jeres egen jetlag-v2 server bruges!
        const activeFirebaseConfig = EGEN_FIREBASE_CONFIG.apiKey
            ? EGEN_FIREBASE_CONFIG
            : ((parsedEnvConfig && parsedEnvConfig.apiKey) ? parsedEnvConfig : null);

        let app = null;
        let auth = null;
        let db = null;
        let isCloudEnabled = false;

        if (activeFirebaseConfig) {
            try {
                app = initializeApp(activeFirebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                isCloudEnabled = true;
            } catch (e) {
                console.warn("Firebase initialisering fejlede, starter i lokal tilstand:", e);
            }
        }

        // In-memory BroadcastChannel til lokal test i Chrome (mellem faner) hvis Firebase ikke er sat op endnu
        const localChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('jetlag_local_room_sync') : null;
        // Lokal in-memory liste over aktive rum til lokal fanebaseret test
        const localActiveRoomsRegistry = new Map();

        const { useState, useEffect, useRef, useMemo } = React;

        // ============================================================================
        // JET LAG STUDIO SOUND & PROCEDURAL MUSIC ENGINE (Web Audio API)
        // ============================================================================
        const JetLagAudio = {
            ctx: null,
            masterGain: null,
            compressor: null,
            delayNode: null,
            delayFeedback: null,
            muted: false,
            musicPlaying: false,
            musicTimer: null,
            musicStep: 0,

            init() {
                if (!this.ctx && typeof window !== 'undefined') {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        this.ctx = new AudioCtx();
                        this.compressor = this.ctx.createDynamicsCompressor();
                        this.compressor.threshold.setValueAtTime(-18, this.ctx.currentTime);
                        this.compressor.knee.setValueAtTime(12, this.ctx.currentTime);
                        this.compressor.ratio.setValueAtTime(4, this.ctx.currentTime);
                        this.compressor.attack.setValueAtTime(0.005, this.ctx.currentTime);
                        this.compressor.release.setValueAtTime(0.18, this.ctx.currentTime);

                        this.masterGain = this.ctx.createGain();
                        this.masterGain.gain.setValueAtTime(0.85, this.ctx.currentTime);

                        // Stereo Broadcast Delay / Slapback Echo for atmospheric depth
                        this.delayNode = this.ctx.createDelay(1.0);
                        this.delayNode.delayTime.setValueAtTime(0.24, this.ctx.currentTime);
                        this.delayFeedback = this.ctx.createGain();
                        this.delayFeedback.gain.setValueAtTime(0.26, this.ctx.currentTime);
                        const delayFilter = this.ctx.createBiquadFilter();
                        delayFilter.type = 'lowpass';
                        delayFilter.frequency.setValueAtTime(1800, this.ctx.currentTime);

                        this.delayNode.connect(delayFilter);
                        delayFilter.connect(this.delayFeedback);
                        this.delayFeedback.connect(this.delayNode);
                        this.delayNode.connect(this.compressor);

                        this.compressor.connect(this.masterGain);
                        this.masterGain.connect(this.ctx.destination);
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => {});
                }
            },

            // Rich Detuned Analog Synth / Brass Voice with Lowpass Filter Envelope
            playSynthVoice(freq, {
                type = 'sawtooth',
                detuneCents = 8,
                duration = 0.35,
                delay = 0,
                vol = 0.14,
                attack = 0.015,
                filterStart = 600,
                filterPeak = 2800,
                slideTo = null,
                sendEcho = true
            } = {}) {
                if (this.muted) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const t0 = this.ctx.currentTime + delay;

                    const osc1 = this.ctx.createOscillator();
                    const osc2 = this.ctx.createOscillator();
                    const filter = this.ctx.createBiquadFilter();
                    const gain = this.ctx.createGain();

                    osc1.type = type;
                    osc2.type = type === 'sawtooth' ? 'triangle' : type;
                    osc1.frequency.setValueAtTime(freq, t0);
                    osc2.frequency.setValueAtTime(freq, t0);
                    osc1.detune.setValueAtTime(-detuneCents, t0);
                    osc2.detune.setValueAtTime(detuneCents, t0);

                    if (slideTo) {
                        osc1.frequency.exponentialRampToValueAtTime(slideTo, t0 + duration);
                        osc2.frequency.exponentialRampToValueAtTime(slideTo, t0 + duration);
                    }

                    filter.type = 'lowpass';
                    filter.Q.setValueAtTime(2.5, t0);
                    filter.frequency.setValueAtTime(filterStart, t0);
                    filter.frequency.exponentialRampToValueAtTime(filterPeak, t0 + attack * 1.5);
                    filter.frequency.exponentialRampToValueAtTime(Math.max(250, filterStart * 0.8), t0 + duration);

                    gain.gain.setValueAtTime(0.0001, t0);
                    gain.gain.linearRampToValueAtTime(vol, t0 + attack);
                    gain.gain.exponentialRampToValueAtTime(0.0005, t0 + duration);

                    osc1.connect(filter);
                    osc2.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.compressor);
                    if (sendEcho && this.delayNode) {
                        const echoSend = this.ctx.createGain();
                        echoSend.gain.setValueAtTime(0.32, t0);
                        gain.connect(echoSend);
                        echoSend.connect(this.delayNode);
                    }

                    osc1.start(t0);
                    osc2.start(t0);
                    osc1.stop(t0 + duration + 0.04);
                    osc2.stop(t0 + duration + 0.04);
                } catch (e) {}
            },

            // Crisp Percussion / Hi-Hat / Snare Tick
            playNoisePerc(duration = 0.06, delay = 0, vol = 0.08, bandFreq = 4500) {
                if (this.muted) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const t0 = this.ctx.currentTime + delay;
                    const bufferSize = Math.floor(this.ctx.sampleRate * duration);
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(bandFreq, t0);
                    filter.Q.setValueAtTime(1.8, t0);

                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(vol, t0);
                    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.compressor);
                    noise.start(t0);
                } catch (e) {}
            },

            // Deep Sub-Bass Impact Punch
            playSubDrop(delay = 0, startFreq = 110, endFreq = 36, duration = 0.45, vol = 0.35) {
                if (this.muted) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const t0 = this.ctx.currentTime + delay;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(startFreq, t0);
                    osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + duration);
                    gain.gain.setValueAtTime(0.001, t0);
                    gain.gain.linearRampToValueAtTime(vol, t0 + 0.015);
                    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
                    osc.connect(gain);
                    gain.connect(this.compressor);
                    osc.start(t0);
                    osc.stop(t0 + duration + 0.03);
                } catch (e) {}
            },

            // Iconic Jet Lag Broadcast Title Fanfare (Warm Retro Brass Stinger)
            playIntroStinger() {
                this.playSubDrop(0.0, 95, 42, 0.5, 0.28);
                // F Major -> G Major -> Bb Major -> F Major 9th Broadcast Brass
                const notes = [
                    { f: 349.23, d: 0.00, dur: 0.20 }, // F4
                    { f: 440.00, d: 0.09, dur: 0.20 }, // A4
                    { f: 523.25, d: 0.18, dur: 0.22 }, // C5
                    { f: 587.33, d: 0.28, dur: 0.24 }, // D5
                    { f: 698.46, d: 0.38, dur: 0.65 }, // F5
                    { f: 880.00, d: 0.38, dur: 0.65 }, // A5
                    { f: 1046.50, d: 0.38, dur: 0.70 } // C6
                ];
                notes.forEach(n => {
                    this.playSynthVoice(n.f, {
                        type: 'sawtooth',
                        detuneCents: 10,
                        duration: n.dur,
                        delay: n.d,
                        vol: 0.11,
                        filterStart: 500,
                        filterPeak: 3800
                    });
                });
                this.playNoisePerc(0.14, 0.38, 0.12, 3200);
            },

            // Question Dispatched Satellite Uplink Sound
            playQuestionSent() {
                this.playSubDrop(0, 140, 55, 0.25, 0.22);
                this.playSynthVoice(280, { type: 'sine', duration: 0.26, delay: 0, vol: 0.16, slideTo: 840, filterPeak: 4000 });

            { id: "photo_tallest_mtn", size: "Large", title: "16. Tallest Hill/Mountain from Station", text: "Højeste bakke/høj synlig fra stationen (maks 3x zoom)." },
            { id: "photo_biggest_water", size: "Large", title: "17. Biggest Body of Water in Zone", text: "Største vandområde i din gemmezone (begge bredder eller horisonten skal ses)." },
            { id: "photo_5_buildings", size: "Large", title: "18. Five Buildings", text: "Tag et billede af 5 bygninger på række (fra gadeplan op til 4. sal)." }
        ];

        // ============================================================================
        // GEOMETRI- & VORONOI-MOTOR (SUTHERLAND-HODGMAN I EKSAKTE KILOMETER)
        // ============================================================================
        const getNearestPOI = (lat, lng, listOrCatId) => {
            // Hvis der sendes et kategori-navn (f.eks. 'coastline', 'int_border', 'highspeed_rail'),
            // som har sammenhængende linje-geometri i BUILTIN_LINE_DATA, beregnes den eksakte afstand til selve linjen!
            if (typeof listOrCatId === 'string' && BUILTIN_LINE_DATA[listOrCatId]) {
                const lineCat = BUILTIN_LINE_DATA[listOrCatId];
                const fromPt = turf.point([lng, lat]);
                let bestSnap = null;
                let bestDist = Infinity;
                let bestSegName = lineCat.label;
                let bestIdx = 0;

                lineCat.segments.forEach((seg, idx) => {
                    if (!seg.coords || seg.coords.length < 2) return;
                    const line = turf.lineString(seg.coords);
                    const snapped = turf.nearestPointOnLine(line, fromPt, { units: 'kilometers' });
                    const d = snapped?.properties?.dist ?? turf.pointToLineDistance(fromPt, line, { units: 'kilometers' });
                    if (d < bestDist) {
                        bestDist = d;
                        bestSnap = snapped.geometry.coordinates;
                        bestSegName = seg.name;
                        bestIdx = idx;
                    }
                });

                if (bestSnap) {
                    return {
                        name: bestSegName,
                        lat: bestSnap[1],
                        lng: bestSnap[0],
                        distanceKm: bestDist,
                        index: bestIdx,
                        isContinuousLine: true,
                        categoryId: listOrCatId
                    };
                }
            }

            const list = typeof listOrCatId === 'string' ? BUILTIN_GEO_DATA[listOrCatId] : listOrCatId;
            if (!list || list.length === 0) return null;
            const fromPt = turf.point([lng, lat]);
            let best = null;
            let bestDist = Infinity;
            let bestIdx = 0;

            list.forEach((item, idx) => {
                const d = turf.distance(fromPt, turf.point([item.lng, item.lat]), { units: 'kilometers' });
                if (d < bestDist) {
                    bestDist = d;
                    best = item;
                    bestIdx = idx;
                }
            });

            return best ? { ...best, distanceKm: bestDist, index: bestIdx } : null;
        };

        // Udregner kompasretning (N, NØ, Ø, SØ, S, SV, V, NV) fra Gemmer til Finder
        const getCompassDirection = (fromLat, fromLng, toLat, toLng) => {
            try {
                const bearing = turf.bearing(turf.point([fromLng, fromLat]), turf.point([toLng, toLat]));
                const normalized = (bearing + 360) % 360;
                const dirs = ['N', 'NØ', 'Ø', 'SØ', 'S', 'SV', 'V', 'NV'];
                return dirs[Math.round(normalized / 45) % 8];
            } catch (e) {
                return 'N';
            }
        };

        // Konverterer lat/lng til lokale kilometer-koordinater omkring København (55.676° N)
        const REF_LAT = 55.6761;
        const REF_LNG = 12.5683;
        const KM_PER_LAT = 111.32;
        const KM_PER_LNG = 111.32 * Math.cos((REF_LAT * Math.PI) / 180);

        const toXY = (lat, lng) => ({
            x: (lng - REF_LNG) * KM_PER_LNG,
            y: (lat - REF_LAT) * KM_PER_LAT
        });

        const toLngLat = (x, y) => [
            REF_LNG + x / KM_PER_LNG,
            REF_LAT + y / KM_PER_LAT
        ];

        // Sutherland-Hodgman Polygon Clipping: Beholder punkter P hvor dist(P, keepPt) <= dist(P, excludePt)
        const clipPolygonBisector = (polyXY, keepXY, excludeXY) => {
            if (!polyXY || polyXY.length < 3) return [];
            const dx = excludeXY.x - keepXY.x;
            const dy = excludeXY.y - keepXY.y;
            const midX = (keepXY.x + excludeXY.x) / 2;
            const midY = (keepXY.y + excludeXY.y) / 2;

            // Normalvektor peger fra keep mod exclude; et punkt P er tættere på keep hvis (P - mid) · d <= 0
            const isInside = (p) => (p.x - midX) * dx + (p.y - midY) * dy <= 1e-7;

            const intersect = (a, b) => {
                const va = (a.x - midX) * dx + (a.y - midY) * dy;
                const vb = (b.x - midX) * dx + (b.y - midY) * dy;
                const denom = va - vb;
                if (Math.abs(denom) < 1e-12) return a;
                const t = va / denom;
                return {
                    x: a.x + t * (b.x - a.x),
                    y: a.y + t * (b.y - a.y)
                };
            };

            const out = [];
            for (let i = 0; i < polyXY.length; i++) {
                const cur = polyXY[i];
                const prev = polyXY[(i + polyXY.length - 1) % polyXY.length];
                const curIn = isInside(cur);
                const prevIn = isInside(prev);

                if (curIn) {
                    if (!prevIn) out.push(intersect(prev, cur));
                    out.push(cur);
                } else if (prevIn) {
                    out.push(intersect(prev, cur));
                }
            }
            return out;
        };

        const OUTER_BOUNDS_LNGLAT = [
            [10.2, 54.4],
            [14.2, 54.4],
            [14.2, 56.6],
            [10.2, 56.6],
            [10.2, 54.4]
        ];

        const getInitialBoundsXY = () => [
            toXY(54.4, 10.2),
            toXY(54.4, 14.2),
            toXY(56.6, 14.2),
            toXY(56.6, 10.2)
        ];

        const buildExclusionGeoJSON = (obj) => {
            if (!obj) return null;
            try {
                // 1. RADIUS (Enkelt cirkel eller inverteret cirkel med hul)
                if (obj.type === 'radius') {
                    const circle = turf.circle([obj.lng, obj.lat], Math.max(0.1, Number(obj.radiusKm) || 1), {
                        steps: 72,
                        units: 'kilometers'
                    });
                    if (!obj.invert) return circle;
                    const holeRing = circle.geometry.coordinates[0];
                    return turf.polygon([OUTER_BOUNDS_LNGLAT, holeRing]);
                }

                // 2. COMPOUND RADIUS (Measuring spørgsmål for lufthavne, stationer, kystlinje osv.)
                if (obj.type === 'compound_radius' && Array.isArray(obj.points) && obj.points.length > 0) {
                    const rKm = Math.max(0.15, Number(obj.radiusKm) || 1);
                    const circles = obj.points.map(p =>
                        turf.circle([p.lng, p.lat], rKm, { steps: 48, units: 'kilometers' })
                    );

                    if (!obj.invert) {
                        // Længere væk end rKm -> Farv alle cirklerne røde
                        return turf.featureCollection(circles);
                    }

                    // Tættere på end rKm -> Farv alt UDEN FOR cirklerne rødt
                    let merged = circles[0];
                    for (let i = 1; i < circles.length; i++) {
                        try {
                            const u = turf.union(merged, circles[i]);
                            if (u) merged = u;
                        } catch (e) {}
                    }
                    const worldPoly = turf.polygon([OUTER_BOUNDS_LNGLAT]);
                    try {
                        const diff = turf.difference(worldPoly, merged);
                        if (diff) return diff;
                    } catch (e) {}
                    return merged;
                }

                // 2B. CONTINUOUS LINE BUFFER (Hele Kystlinjen, Hele Landegrænsen, Regionsgrænsen, Højhastighedsbanen m.fl.)
                if (obj.type === 'line_buffer' && Array.isArray(obj.lines) && obj.lines.length > 0) {
                    const rKm = Math.max(0.1, Number(obj.radiusKm) || 1);
                    const multiLine = turf.multiLineString(obj.lines);
                    const buffered = turf.buffer(multiLine, rKm, { units: 'kilometers', steps: 24 });
                    if (!buffered) return null;

                    if (!obj.invert) {
                        // Gemmeren er LÆNGERE VÆK fra kystlinjen/grænsen/banen end Finderen -> Farv hele kyst-/grænse-bæltet rødt!
                        return buffered;
                    }

                    // Gemmeren er TÆTTERE PÅ kystlinjen/grænsen/banen end Finderen -> Farv alt UDEN FOR bæltet rødt!
                    const worldPoly = turf.polygon([OUTER_BOUNDS_LNGLAT]);
                    try {
                        const diff = turf.difference(worldPoly, buffered);
                        if (diff) return diff;
                    } catch (e) {}

                    const geom = buffered.geometry || (buffered.features && buffered.features[0]?.geometry);
                    if (geom && geom.type === 'Polygon') {
                        return turf.polygon([OUTER_BOUNDS_LNGLAT, geom.coordinates[0]]);
                    }
                    if (geom && geom.type === 'MultiPolygon') {
                        const rings = [OUTER_BOUNDS_LNGLAT];
                        geom.coordinates.forEach(polyCoords => {
                            if (polyCoords[0]) rings.push(polyCoords[0]);
                        });
                        return turf.polygon(rings);
                    }
                    return buffered;
                }

                // 3. POLYGON (Frihåndszone eller Landmass)
                if (obj.type === 'polygon' && Array.isArray(obj.coords) && obj.coords.length >= 3) {
                    const ring = obj.coords.map(c => [c.lng, c.lat]);
                    ring.push([obj.coords[0].lng, obj.coords[0].lat]);
                    if (!obj.invert) return turf.polygon([ring]);
                    return turf.polygon([OUTER_BOUNDS_LNGLAT, ring]);
                }

                // 4. THERMOMETER (Eksakt vinkelret halveringslinje i kilometer)
                if (obj.type === 'thermometer' && obj.pointA && obj.pointB) {
                    const aXY = toXY(obj.pointA.lat, obj.pointA.lng);
                    const bXY = toXY(obj.pointB.lat, obj.pointB.lng);
                    // Hvis VARMERE (tættere på B), skal vi farve den kolde halvdel (tættere på A) rød!
                    // Hvis KOLDERE (tættere på A), skal vi farve halvdelen tættere på B rød!
                    const excludeSideCenter = obj.warmer ? aXY : bXY;
                    const keepSideCenter = obj.warmer ? bXY : aXY;

                    const clippedXY = clipPolygonBisector(getInitialBoundsXY(), excludeSideCenter, keepSideCenter);
                    if (clippedXY.length < 3) return null;
                    const ring = clippedXY.map(p => toLngLat(p.x, p.y));
                    ring.push(ring[0]);
                    return turf.polygon([ring]);
                }

                // 5. VORONOI CELL (Matching & Tentacles i eksakte kilometer!)
                if (obj.type === 'voronoi_cell' && Array.isArray(obj.points) && obj.points.length > 0) {
                    const targetIdx = obj.targetIdx ?? 0;
                    const targetPt = obj.points[targetIdx];
                    if (!targetPt) return null;

                    const targetXY = toXY(targetPt.lat, targetPt.lng);
                    let cellXY = getInitialBoundsXY();

                    obj.points.forEach((otherPt, idx) => {
                        if (idx === targetIdx) return;
                        const otherXY = toXY(otherPt.lat, otherPt.lng);
                        if (Math.hypot(otherXY.x - targetXY.x, otherXY.y - targetXY.y) < 0.01) return;
                        cellXY = clipPolygonBisector(cellXY, targetXY, otherXY);
                    });

                    if (cellXY.length < 3) return null;
                    const cellRing = cellXY.map(p => toLngLat(p.x, p.y));
                    cellRing.push(cellRing[0]);

                    if (!obj.invert) {
                        // Svar = NEJ (Ikke denne lufthavn/kommune) -> Farv selve Voronoi-cellen rød
                        return turf.polygon([cellRing]);
                    }
                    // Svar = JA (Match!) -> Farv alt UDEN FOR denne Voronoi-celle rødt
                    return turf.polygon([OUTER_BOUNDS_LNGLAT, cellRing]);
                }
            } catch (err) {
                console.warn("GeoJSON build warning:", err);
            }
            return null;
        };

        // Komprimerer billeder til hurtig overførsel i Foto-spørgsmål
        const compressImageToBase64 = (file, maxWidth = 720, quality = 0.72) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        const scale = Math.min(1, maxWidth / img.width);
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.round(img.width * scale);
                        canvas.height = Math.round(img.height * scale);
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = ev.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        };

        // ============================================================================

        // ============================================================================

        // ============================================================================

                    // Bemærk: Da getDocs ikke altid er nødvendigt hvis onSnapshot kører, importerer vi simpelt:

                                )}
                            </div>

                            {/* Automatic Team Assignment or Specific Team Choice */}
                            <label className="block font-display font-extrabold uppercase tracking-wider text-jl-cream text-sm sm:text-base mb-1.5">
                                3. HOLD-TILDELING (BYTTER HVER RUNDE)
                            </label>
                            <div className="grid grid-cols-3 gap-2 mb-4">
                                <button
                                    type="button"
                                    onClick={() => setTeamPreference('auto')}
                                    className={`p-2 rounded-xl border-2 flex flex-col items-center text-center transition-all ${
                                        teamPreference === 'auto'
                                            ? 'bg-jl-yellow/20 border-jl-yellow text-jl-cream scale-[1.02]'
                                            : 'bg-jl-navy/50 border-jl-cream/15 text-jl-cream/60'
                                    }`}
                                >
                                    <span className="text-base">⚖️</span>
                                    <span className="font-display font-black text-xs sm:text-sm uppercase mt-0.5">AUTO-FORDEL</span>
                                    <span className="text-[9px] leading-tight opacity-75">Balancerer hold</span>
                                </button>

                                <button
                                    type="button"
                                    onClick={() => setTeamPreference('teamA')}
                                    className={`p-2 rounded-xl border-2 flex flex-col items-center text-center transition-all ${
                                        teamPreference === 'teamA'
                                            ? 'bg-jl-green/20 border-jl-green text-jl-cream scale-[1.02]'
                                            : 'bg-jl-navy/50 border-jl-cream/15 text-jl-cream/60'
                                    }`}
                                >
                                    <span className="text-base">🟢</span>
                                    <span className="font-display font-black text-xs sm:text-sm uppercase mt-0.5">HOLD 1 (ALPHA)</span>
                                    <span className="text-[9px] leading-tight opacity-75">Starter Gemmer</span>
                                </button>

                                <button
                                    type="button"
                                    onClick={() => setTeamPreference('teamB')}
                                    className={`p-2 rounded-xl border-2 flex flex-col items-center text-center transition-all ${
                                        teamPreference === 'teamB'
                                            ? 'bg-jl-orange/20 border-jl-orange text-jl-cream scale-[1.02]'
                                            : 'bg-jl-navy/50 border-jl-cream/15 text-jl-cream/60'
                                    }`}
                                >
                                    <span className="text-base">🟠</span>
                                    <span className="font-display font-black text-xs sm:text-sm uppercase mt-0.5">HOLD 2 (BRAVO)</span>
                                    <span className="text-[9px] leading-tight opacity-75">Starter Finder</span>
                                </button>
                            </div>

                            <button
                                type="submit"
                                disabled={!name.trim() || !roomCode.trim() || isAuthenticating}
                                className="w-full bg-jl-yellow hover:bg-amber-400 disabled:opacity-40 text-jl-navy font-display font-black text-xl sm:text-2xl uppercase tracking-wider py-3 rounded-xl shadow-lg transition-transform active:scale-98 flex items-center justify-center gap-2"
                            >
                                {isAuthenticating
                                    ? 'TJEKKER RUM...'
                                    : mode === 'create'
                                    ? `OPRET PRIVAT RUM (${roomCode || '...'}) →`
                                    : `FORBIND TIL RUM (${roomCode || '...'}) →`}
                            </button>

                            <p className="mt-2.5 text-center text-[11px] text-jl-cream/55">
                                🧹 Private rum der ikke længere er i brug ryddes automatisk.
                            </p>
                        </form>
                    </div>

                    {/* Chrome & Firebase Instructions Modal */}
                    {showSetupModal && (
                        <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
                            <div className="bg-jl-navy border-3 border-jl-cream rounded-3xl max-w-lg w-full p-6 text-jl-cream shadow-2xl max-h-[88vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="font-display font-black text-2xl text-jl-yellow uppercase">
                                        ⚙️ SÅDAN BRUGER DU APPEN I CHROME & MED FIREBASE
                                    </h3>
                                    <button onClick={() => setShowSetupModal(false)} className="text-xl font-bold text-jl-cream/60 hover:text-white">✕</button>
                                </div>
                                <div className="space-y-3 text-xs sm:text-sm text-jl-cream/90 leading-relaxed">
                                    <div className="bg-jl-dark p-3.5 rounded-2xl border border-jl-cream/15">
                                        <div className="font-display font-black text-base text-jl-green uppercase mb-1">
                                            1. Hvorfor sagde kortet "API Required"?
                                        </div>
                                        <p>
                                            Når man åbner en <code>.html</code>-fil direkte på computeren i Chrome, blokerer nogle kort-udbydere kortet. Vi har nu skiftet til <b>Esri / OpenStreetMap uden API-krav</b>, så kortet <b>altid</b> virker direkte i Chrome uden API-nøgle!
                                        </p>
                                    </div>

                                    <div className="bg-jl-dark p-3.5 rounded-2xl border border-jl-cream/15">
                                        <div className="font-display font-black text-base text-jl-yellow uppercase mb-1">
                                            2. Sådan opretter du gratis Firebase (til live GPS mellem telefoner):
                                        </div>
                                        <ol className="list-decimal list-inside space-y-1.5">
                                            <li>Gå ind på <b>console.firebase.google.com</b> og klik <b>"Create a project"</b>.</li>
                                            <li>Klik på <b>Web-ikonet (<code>&lt;/&gt;</code>)</b> på forsiden for at oprette en Web-app, og kopiér din <code>firebaseConfig</code>.</li>
                                            <li>I menuen til venstre: Klik <b>Build → Authentication → Sign-in method</b> og slå <b>Anonymous</b> TIL.</li>
                                            <li>I menuen til venstre: Klik <b>Build → Firestore Database → Create database</b> og vælg <b>Start in test mode</b>.</li>
                                            <li>Åbn denne HTML-fil i en teksteditor, og indsæt dine nøgler i <code>EGEN_FIREBASE_CONFIG</code> øverst i koden!</li>
                                        </ol>
                                    </div>
                                </div>
                                <button
                                    onClick={() => setShowSetupModal(false)}
                                    className="mt-5 w-full bg-jl-yellow text-jl-navy font-display font-black text-lg uppercase py-2.5 rounded-xl"
                                >
                                    FORSTÅET – TILBAGE TIL SPILLET
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const GameScreen = ({ user, sessionInfo, onLeaveRoom, isCloudActive }) => {
            const { playerName, roomCode, initialTeam } = sessionInfo;

            const mapInstanceRef = useRef(null);
            const tileLayerRef = useRef(null);
            const tileProviderIdxRef = useRef(0);
            const layersRef = useRef({
                exclusions: L.layerGroup(),
                preview: L.layerGroup(),
                hubs: L.layerGroup(),
                atlas: L.layerGroup(),
                hiderZone: L.layerGroup(),
                players: L.layerGroup()
            });

            // Synchronized Room State
            const [myTeam, setMyTeam] = useState(initialTeam || 'teamA'); // 'teamA' (Hold 1) or 'teamB' (Hold 2)
            const [players, setPlayers] = useState([]);
            const [mapObjects, setMapObjects] = useState(() => {
                try {
                    const cached = localStorage.getItem(`jl_objects_${roomCode}`) || sessionStorage.getItem(`jl_objects_${roomCode}`);
                    return cached ? JSON.parse(cached) : [];
                } catch (e) { return []; }
            });
            const [chatMessages, setChatMessages] = useState(() => {
                try {
                    const cached = localStorage.getItem(`jl_chat_${roomCode}`) || sessionStorage.getItem(`jl_chat_${roomCode}`);
                    return cached ? JSON.parse(cached) : [];
                } catch (e) { return []; }
            });
            const [questionsLog, setQuestionsLog] = useState(() => {
                try {
                    const cached = localStorage.getItem(`jl_questions_${roomCode}`) || sessionStorage.getItem(`jl_questions_${roomCode}`);
                    return cached ? JSON.parse(cached) : [];
                } catch (e) { return []; }
            });
            const [roomState, setRoomState] = useState(() => {
                try {
                    const cached = localStorage.getItem(`jl_room_${roomCode}`) || sessionStorage.getItem(`jl_room_${roomCode}`);
                    if (cached) return JSON.parse(cached);
                } catch (e) {}
                return {
                    roomCode,
                    roundNumber: 1,
                    hidingTeam: 'teamA',
                    phase: 'hiding',
                    timerEndMillis: Date.now() + 45 * 60 * 1000,
                    isRunning: false,
                    botHiderStationIdx: 11 // Default simulated hider at Hillerød/Lyngby if no human Hider in room
                };
            });

            // Derived Role for current player in the current round!
            const myRole = myTeam === roomState.hidingTeam ? 'hider' : 'seeker';

            // Opdater gemt session hvis spilleren skifter hold inde i rummet
            useEffect(() => {
                saveActiveSession({
                    playerName,
                    roomCode,
                    initialTeam: myTeam
                });
            }, [playerName, roomCode, myTeam]);

            // Gem lokale kopier i både localStorage og sessionStorage så intet går tabt ved F5 / side-opdatering
            useEffect(() => {
                try {
                    localStorage.setItem(`jl_objects_${roomCode}`, JSON.stringify(mapObjects));
                    sessionStorage.setItem(`jl_objects_${roomCode}`, JSON.stringify(mapObjects));
                } catch (e) {}
            }, [mapObjects, roomCode]);

            useEffect(() => {
                try {
                    localStorage.setItem(`jl_questions_${roomCode}`, JSON.stringify(questionsLog));
                    sessionStorage.setItem(`jl_questions_${roomCode}`, JSON.stringify(questionsLog));
                } catch (e) {}
            }, [questionsLog, roomCode]);

            useEffect(() => {
                try {
                    localStorage.setItem(`jl_chat_${roomCode}`, JSON.stringify(chatMessages));
                    sessionStorage.setItem(`jl_chat_${roomCode}`, JSON.stringify(chatMessages));
                } catch (e) {}
            }, [chatMessages, roomCode]);

            // Local UI & Map states
            const [mapTheme, setMapTheme] = useState('map-mint');
            const [showHubs, setShowHubs] = useState(true);
            const [soundMuted, setSoundMuted] = useState(false);
            const [musicPlaying, setMusicPlaying] = useState(false);
            const [wakeLockActive, setWakeLockActive] = useState(false);
            const [burgerMenuOpen, setBurgerMenuOpen] = useState(false);
            const [trackerCollapsed, setTrackerCollapsed] = useState(false);
            const [simulateBotChasers, setSimulateBotChasers] = useState(false);
            const [botChaserTick, setBotChaserTick] = useState(0);
            const [hiderShowSeekerZones, setHiderShowSeekerZones] = useState(false); // Hiders get a clean map by default!
            const [hiderLockedSpot, setHiderLockedSpot] = useState(null);
            const [activeTool, setActiveTool] = useState(null);
            // Tools: 'questions', 'atlas', 'seeker_tools', 'hider_tactics', 'hider_inbox', 'radius', 'polygon', 'thermometer', 'layers', 'chat', 'room'
            const [questionTab, setQuestionTab] = useState('radar'); // 'radar', 'thermometer', 'measuring', 'matching', 'tentacles', 'photos'

            // Dynamic Map Atlas & Live Category Inspector States (Available to BOTH Hiders and Seekers!)
            const [activeAtlasCategory, setActiveAtlasCategory] = useState(null);
            const [showAtlasVoronoi, setShowAtlasVoronoi] = useState(true);
            const [atlasModalTab, setAtlasModalTab] = useState('map_layers'); // 'map_layers' | 'all_questions'
            const [isScanningOsm, setIsScanningOsm] = useState(false);
            const [osmRevision, setOsmRevision] = useState(0); // Tvinger re-render når nye OSM-punkter hentes live
            const [nowMillis, setNowMillis] = useState(Date.now());

            const [statusBanner, setStatusBanner] = useState(null);
            const [manualGpsMode, setManualGpsMode] = useState(false);
            const [myCoords, setMyCoords] = useState({ lat: 55.6761, lng: 12.5683 });
            const [unreadCount, setUnreadCount] = useState(0);
            const prevQuestionsCountRef = useRef(questionsLog.length);
            const [pendingTelemetry, setPendingTelemetry] = useState(null);
            const [telemetryMinimized, setTelemetryMinimized] = useState(false);
            const telemetryTimerRef = useRef(null);
            const telemetryCompleteFnRef = useRef(null);
            const [revealOverlay, setRevealOverlay] = useState(null);
            // { category, headline, subtext, isPositive, cardReward }

            // Hider & Seeker Live Question Timer Tick (1s interval)
            useEffect(() => {
                const iv = setInterval(() => setNowMillis(Date.now()), 1000);
                return () => clearInterval(iv);
            }, []);

            // Funktion til at hente 100% af en kategori live fra OpenStreetMap
            const handleScanLiveOSM = async (catId) => {
                const targetCat = catId || effectiveDynamicCategory || 'library';
                if (!OSM_QUERY_MAP[targetCat]) {
                    notify("Denne kategori har allerede 100% verificerede grænser indbygget!");
                    return;
                }
                setIsScanningOsm(true);
                JetLagAudio.playUiClick(840);
                try {
                    const updatedList = await fetchLiveOSMCategory(targetCat);
                    setOsmRevision(r => r + 1);
                    if (updatedList) {
                        notify(`🌍 OpenStreetMap Live: ${updatedList.length} lokationer indlæst på kortet!`);
                    }
                } catch (e) {
                    notify("Bruger indbygget verificeret datasæt (OSM travlt lige nu).");
                } finally {
                    setIsScanningOsm(false);
                }
            };

            // Seeker Question Menu & Manual Tool Builder States
            const [qRadarKm, setQRadarKm] = useState(4.828);
            const [qMeasureTarget, setQMeasureTarget] = useState('lufthavn');
            const [qMatchCategory, setQMatchCategory] = useState('lufthavn');
            const [qTentacleId, setQTentacleId] = useState('museum_1m');
            const [customQuestionText, setCustomQuestionText] = useState("");

            // Hider Manual Answer & Photo Upload state
            const [answeringQuestionId, setAnsweringQuestionId] = useState(null);
            const [hiderAnswerText, setHiderAnswerText] = useState("");
            const [hiderPhotoData, setHiderPhotoData] = useState(null);
            const [isUploadingPhoto, setIsUploadingPhoto] = useState(false);

            // Manual Drawing States
            const [radiusCenter, setRadiusCenter] = useState({ lat: 55.6761, lng: 12.5683 });
            const [radiusKm, setRadiusKm] = useState(10);
            const [radiusInvert, setRadiusInvert] = useState(false);

            const [polyPoints, setPolyPoints] = useState([]);
            const [polyInvert, setPolyInvert] = useState(false);

            const [thermoA, setThermoA] = useState(null);
            const [thermoB, setThermoB] = useState(null);
            const [thermoWarmer, setThermoWarmer] = useState(true);

            const [chatInput, setChatInput] = useState("");
            const [clockDisplay, setClockDisplay] = useState("45:00");

            const activeToolRef = useRef(activeTool);
            const questionTabRef = useRef(questionTab);
            const manualGpsRef = useRef(manualGpsMode);
            const thermoARef = useRef(thermoA);
            const thermoBRef = useRef(thermoB);

            useEffect(() => {
                activeToolRef.current = activeTool;
                questionTabRef.current = questionTab;
                manualGpsRef.current = manualGpsMode;
                thermoARef.current = thermoA;
                thermoBRef.current = thermoB;
            }, [activeTool, questionTab, manualGpsMode, thermoA, thermoB]);

            // Close Seeker-only tools if role flips to Hider (and vice versa)
            useEffect(() => {
                setActiveTool(null);
            }, [myRole]);

            const notify = (msg) => {
                setStatusBanner(msg);
                setTimeout(() => setStatusBanner(null), 5000);
            };

            // Mobile Screen Wake Lock (Forhindrer at telefonen går i sort mens man løber rundt i København)
            useEffect(() => {
                let wakeLockSentinel = null;
                const requestWakeLock = async () => {
                    if ('wakeLock' in navigator) {
                        try {
                            wakeLockSentinel = await navigator.wakeLock.request('screen');
                            setWakeLockActive(true);
                            wakeLockSentinel.addEventListener('release', () => setWakeLockActive(false));
                        } catch (e) {
                            setWakeLockActive(false);
                        }
                    }
                };
                requestWakeLock();
                const handleVisibilityChange = () => {
                    if (document.visibilityState === 'visible') requestWakeLock();
                };
                document.addEventListener('visibilitychange', handleVisibilityChange);
                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    if (wakeLockSentinel) wakeLockSentinel.release().catch(() => {});
                    JetLagAudio.stopBackgroundMusic();
                };
            }, []);

            // Room Activity Heartbeat + Auto-Delete Room when last player leaves
            useEffect(() => {
                if (!user || !roomCode) return;

                const touchRoomActivity = async () => {
                    const now = Date.now();
                    localActiveRoomsRegistry.set(roomCode, { ...roomState, lastActiveMillis: now });
                    try {
                        localStorage.setItem(`jl_room_${roomCode}`, JSON.stringify({ ...roomState, lastActiveMillis: now }));
                        sessionStorage.setItem(`jl_room_${roomCode}`, JSON.stringify({ ...roomState, lastActiveMillis: now }));
                    } catch (e) {}

                    if (isCloudActive && db) {
                        try {
                            const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                            await updateDoc(roomDocRef, { lastActiveMillis: now }).catch(() => {});
                        } catch (e) {}
                    }
                };

                touchRoomActivity();
                const hbInterval = setInterval(touchRoomActivity, 45000);
                return () => clearInterval(hbInterval);
            }, [user, roomCode, isCloudActive]);

            // Explicit Leave & Auto-Cleanup if Room becomes Empty
            const handleLeaveAndCleanupRoom = async () => {
                if (telemetryTimerRef.current) {
                    clearInterval(telemetryTimerRef.current);
                    telemetryTimerRef.current = null;
                }
                JetLagAudio.stopBackgroundMusic();
                clearActiveSession();
                const remainingOtherPlayers = players.filter(p => p.uid !== user?.uid && (Date.now() - (p.updatedAtMillis || 0)) < STALE_PLAYER_TIMEOUT_MS);

                if (isCloudActive && db && user) {
                    try {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'players', `${roomCode}_${user.uid}`));
                        // Hvis der ikke er flere aktive spillere tilbage i rummet, rydder vi hele det private rum!
                        if (remainingOtherPlayers.length === 0) {
                            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode));
                            for (const obj of mapObjects) {
                                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mapObjects', obj.id));
                            }
                            for (const q of questionsLog) {
                                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'questions', q.id));
                            }
                            for (const m of chatMessages) {
                                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'chat', m.id));
                            }
                        }
                    } catch (e) {
                        console.warn("Cleanup warning:", e);
                    }
                } else if (remainingOtherPlayers.length === 0) {
                    await deleteEntireRoomByCode(roomCode);
                }

                onLeaveRoom();
            };

            useEffect(() => {
                if (mapInstanceRef.current) return;

                const map = L.map('map-container', {
                    zoomControl: false,
                    attributionControl: false
                }).setView([55.6761, 12.5683], 11);

                const loadTileLayer = (providerIndex) => {
                    const url = FREE_TILE_SERVERS[providerIndex % FREE_TILE_SERVERS.length];
                    if (tileLayerRef.current) {
                        map.removeLayer(tileLayerRef.current);
                    }
                    const layer = L.tileLayer(url, {
                        maxZoom: 19
                    });
                    layer.on('tileerror', () => {
                        if (tileProviderIdxRef.current < FREE_TILE_SERVERS.length - 1) {
                            tileProviderIdxRef.current += 1;
                            loadTileLayer(tileProviderIdxRef.current);
                        }
                    });
                    layer.addTo(map);
                    tileLayerRef.current = layer;
                };

                loadTileLayer(0);

                L.control.zoom({ position: 'topright' }).addTo(map);

                layersRef.current.exclusions.addTo(map);
                layersRef.current.preview.addTo(map);
                layersRef.current.hubs.addTo(map);
                layersRef.current.atlas.addTo(map);
                layersRef.current.hiderZone.addTo(map);
                layersRef.current.players.addTo(map);

                setTimeout(() => map.invalidateSize(), 150);
                window.addEventListener('resize', () => map.invalidateSize());

                map.on('click', (e) => {
                    const { lat, lng } = e.latlng;
                    const tool = activeToolRef.current;
                    const qTab = questionTabRef.current;

                    if (manualGpsRef.current && !tool) {
                        setMyCoords({ lat, lng });
                        return;
                    }

                    if (tool === 'radius') {
                        setRadiusCenter({ lat, lng });
                    } else if (tool === 'polygon') {
                        setPolyPoints(prev => [...prev, { lat, lng }]);
                    } else if (tool === 'thermometer' || (tool === 'questions' && qTab === 'thermometer')) {
                        if (!thermoARef.current) {
                            setThermoA({ lat, lng });
                        } else if (!thermoBRef.current) {
                            setThermoB({ lat, lng });
                        } else {
                            setThermoA({ lat, lng });
                            setThermoB(null);
                        }
                    }
                });

                mapInstanceRef.current = map;
            }, []);

            useEffect(() => {
                if (!user) return;

                const handleLocalMessage = (event) => {
                    const data = event.data;
                    if (!data || data.roomCode !== roomCode) return;
                    if (data.kind === 'roomState') setRoomState(data.payload);
                    if (data.kind === 'playerUpdate') {
                        setPlayers(prev => {
                            const others = prev.filter(p => p.uid !== data.payload.uid);
                            return [...others, data.payload];
                        });
                    }
                    if (data.kind === 'addObject') setMapObjects(prev => [...prev, data.payload]);
                    if (data.kind === 'deleteObject') setMapObjects(prev => prev.filter(o => o.id !== data.id));
                    if (data.kind === 'clearObjects') setMapObjects([]);
                    if (data.kind === 'questionUpsert') {
                        setQuestionsLog(prev => {
                            const others = prev.filter(q => q.id !== data.payload.id);
                            return [...others, data.payload].sort((a, b) => (a.createdAtMillis || 0) - (b.createdAtMillis || 0));
                        });
                    }
                    if (data.kind === 'clearQuestions') setQuestionsLog([]);
                    if (data.kind === 'chat') {
                        setChatMessages(prev => [...prev, data.payload]);
                        if (activeToolRef.current !== 'chat') setUnreadCount(c => c + 1);
                    }
                };

                if (localChannel) {
                    localChannel.addEventListener('message', handleLocalMessage);
                }

                if (!isCloudActive || !db) {
                    return () => {
                        if (localChannel) localChannel.removeEventListener('message', handleLocalMessage);
                    };
                }

                const playersCol = collection(db, 'artifacts', appId, 'public', 'data', 'players');
                const objectsCol = collection(db, 'artifacts', appId, 'public', 'data', 'mapObjects');
                const chatCol = collection(db, 'artifacts', appId, 'public', 'data', 'chat');
                const questionsCol = collection(db, 'artifacts', appId, 'public', 'data', 'questions');
                const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                const unsubPlayers = onSnapshot(playersCol, (snap) => {
                    const list = [];
                    snap.forEach(d => {
                        const p = { id: d.id, ...d.data() };
                        if (p.roomCode === roomCode) list.push(p);
                    });
                    setPlayers(list);
                }, (err) => console.error("Players listener error:", err));

                const unsubObjects = onSnapshot(objectsCol, (snap) => {
                    const list = [];
                    snap.forEach(d => {
                        const obj = { id: d.id, ...d.data() };
                        if (obj.roomCode === roomCode) list.push(obj);
                    });
                    list.sort((a, b) => (a.createdAtMillis || 0) - (b.createdAtMillis || 0));
                    setMapObjects(list);
                }, (err) => console.error("Objects listener error:", err));

                const unsubQuestions = onSnapshot(questionsCol, (snap) => {
                    const list = [];
                    snap.forEach(d => {
                        const q = { id: d.id, ...d.data() };
                        if (q.roomCode === roomCode) list.push(q);
                    });
                    list.sort((a, b) => (a.createdAtMillis || 0) - (b.createdAtMillis || 0));
                    setQuestionsLog(list);
                }, (err) => console.error("Questions listener error:", err));

                const unsubChat = onSnapshot(chatCol, (snap) => {
                    const list = [];
                    snap.forEach(d => {
                        const m = { id: d.id, ...d.data() };
                        if (m.roomCode === roomCode) list.push(m);
                    });
                    list.sort((a, b) => (a.createdAtMillis || 0) - (b.createdAtMillis || 0));
                    setChatMessages(list);
                    if (activeToolRef.current !== 'chat' && list.length > 0) {
                        setUnreadCount(c => c + 1);
                    }
                }, (err) => console.error("Chat listener error:", err));

                const unsubRoom = onSnapshot(roomDocRef, (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        setRoomState(data);
                        try { sessionStorage.setItem(`jl_room_${roomCode}`, JSON.stringify(data)); } catch (e) {}
                    } else {
                        // Hvis rummet er blevet slettet/lukket fordi det ikke længere er i brug
                        JetLagAudio.stopBackgroundMusic();
                        clearActiveSession();
                        onLeaveRoom("Rummet blev lukket, da det ikke længere var i brug.");
                    }
                }, (err) => console.error("Room listener error:", err));

                return () => {
                    unsubPlayers();
                    unsubObjects();
                    unsubQuestions();
                    unsubChat();
                    unsubRoom();
                    if (localChannel) localChannel.removeEventListener('message', handleLocalMessage);
                };
            }, [user, roomCode, isCloudActive]);

            useEffect(() => {
                if (!user) return;

                const pushMyPosition = async (lat, lng) => {
                    const playerPayload = {
                        uid: user.uid,
                        roomCode,
                        name: playerName,
                        team: myTeam,
                        role: myRole,
                        lat,
                        lng,
                        updatedAtMillis: Date.now()
                    };

                    setPlayers(prev => {
                        const others = prev.filter(p => p.uid !== user.uid);
                        return [...others, playerPayload];
                    });

                    if (localChannel) {
                        localChannel.postMessage({ roomCode, kind: 'playerUpdate', payload: playerPayload });
                    }

                    if (isCloudActive && db) {
                        try {
                            const myDoc = doc(db, 'artifacts', appId, 'public', 'data', 'players', `${roomCode}_${user.uid}`);
                            await setDoc(myDoc, {
                                ...playerPayload,
                                timestamp: serverTimestamp()
                            });
                        } catch (err) {
                            console.error("GPS sync error:", err);
                        }
                    }
                };

                pushMyPosition(myCoords.lat, myCoords.lng);

                if (manualGpsMode || !navigator.geolocation) return;

                const watchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        const { latitude, longitude } = pos.coords;
                        setMyCoords({ lat: latitude, lng: longitude });
                        pushMyPosition(latitude, longitude);
                    },
                    (err) => console.warn("Geolocation warning:", err),
                    { enableHighAccuracy: true, maximumAge: 8000, timeout: 6000 }
                );

                return () => navigator.geolocation.clearWatch(watchId);
            }, [user, roomCode, playerName, myTeam, myRole, manualGpsMode, myCoords.lat, myCoords.lng, isCloudActive]);

            // Resolve active Hider GPS for automatic question answering (uses real Hider player if present, else Bot Hider in Zone 1-99)
            const activeHiderTarget = useMemo(() => {
                const realHider = players.find(p => p.team === roomState.hidingTeam && typeof p.lat === 'number');
                if (realHider) {
                    return {
                        lat: realHider.lat,
                        lng: realHider.lng,
                        isBot: false,
                        name: realHider.name
                    };
                }
                const idx = (roomState.botHiderStationIdx || 11) % BUILTIN_GEO_DATA.station.length;
                const st = BUILTIN_GEO_DATA.station[idx];
                return {
                    lat: st.lat,
                    lng: st.lng,
                    isBot: true,
                    name: `Bot-Gemmer (${st.name})`
                };
            }, [players, roomState.hidingTeam, roomState.botHiderStationIdx]);

            // Opdater simuleret Bot-Finder hvert 4. sekund hvis slået til under test
            useEffect(() => {
                if (!simulateBotChasers) return;
                const iv = setInterval(() => setBotChaserTick(t => t + 1), 4000);
                return () => clearInterval(iv);
            }, [simulateBotChasers]);

            // Beregn alle Findere (Chasers) med live afstand, kompasretning og tidsstempel til Gemmerens radar
            const chasersWithDistance = useMemo(() => {
                const seekerList = players
                    .filter(p => p.team !== roomState.hidingTeam && typeof p.lat === 'number')
                    .map(p => ({ ...p, isBot: false }));

                if (simulateBotChasers) {
                    const stList = BUILTIN_GEO_DATA.station;
                    const botSt = stList[(botChaserTick + 3) % stList.length];
                    seekerList.push({
                        uid: 'bot_chaser_alpha',
                        name: 'Bot-Finder (Test)',
                        team: roomState.hidingTeam === 'teamA' ? 'teamB' : 'teamA',
                        role: 'seeker',
                        lat: botSt.lat + 0.002 * Math.sin(botChaserTick),
                        lng: botSt.lng + 0.002 * Math.cos(botChaserTick),
                        updatedAtMillis: Date.now(),
                        isBot: true
                    });
                }

                const hiderPt = turf.point([myCoords.lng, myCoords.lat]);
                return seekerList.map(s => {
                    const d = turf.distance(hiderPt, turf.point([s.lng, s.lat]), { units: 'kilometers' });
                    const compass = getCompassDirection(myCoords.lat, myCoords.lng, s.lat, s.lng);
                    const secsAgo = Math.max(0, Math.floor((nowMillis - (s.updatedAtMillis || nowMillis)) / 1000));
                    return { ...s, distanceKm: d, compass, secsAgo };
                }).sort((a, b) => a.distanceKm - b.distanceKm);
            }, [players, roomState.hidingTeam, myCoords, simulateBotChasers, botChaserTick, nowMillis]);

            // Hjælpefunktion til at zoome kortet så Gemmeren ser både sig selv og alle Findere
            const fitMapToChasers = () => {
                if (!mapInstanceRef.current) return;
                JetLagAudio.playUiClick();
                if (chasersWithDistance.length === 0) {
                    mapInstanceRef.current.flyTo([myCoords.lat, myCoords.lng], 13, { duration: 0.6 });
                    return;
                }
                const pts = [[myCoords.lat, myCoords.lng], ...chasersWithDistance.map(c => [c.lat, c.lng])];
                const bounds = L.latLngBounds(pts);
                mapInstanceRef.current.fitBounds(bounds, { padding: [70, 70], maxZoom: 15 });
            };

            // Kopiér rum-kode til udklipsholder
            const copyRoomCodeToClipboard = () => {
                JetLagAudio.playUiClick();
                try {
                    const el = document.createElement('textarea');
                    el.value = roomCode;
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);
                    notify(`🔑 Rum-kode "${roomCode}" kopieret!`);
                } catch (e) {
                    notify(`🔑 Rum-kode: ${roomCode}`);
                }
            };

            // Afspil advarselslyd hos Gemmeren når der kommer et nyt spørgsmål fra Finderne
            useEffect(() => {
                if (questionsLog.length > prevQuestionsCountRef.current) {
                    const newest = questionsLog[questionsLog.length - 1];
                    if (myRole === 'hider' && newest && newest.status === 'pending') {
                        JetLagAudio.playHiderAlert();
                    }
                }
                prevQuestionsCountRef.current = questionsLog.length;
            }, [questionsLog, myRole]);

            // Pending manual/photo/GPS questions waiting for the Hider to accept or answer
            const pendingManualQuestions = useMemo(() => {
                return questionsLog.filter(q => q.status === 'pending');
            }, [questionsLog]);

            // Aktivt afventende spørgsmål (5-min GPS eller 20-min Foto) synkroniseret på tværs af begge hold
            const activePendingQuestion = useMemo(() => {
                const list = questionsLog.filter(q => q.status === 'pending');
                return list.length > 0 ? list[list.length - 1] : null;
            }, [questionsLog]);

            // Håndterer når et 5-minutters GPS-spørgsmål accepteres af Gemmeren ELLER når de 5 minutter udløber automatisk!
            const finalizePendingQuestion = async (qObj, customOverrideBool = null, answeredByLabel = "Automatisk (5 min udløbet)") => {
                if (!qObj || qObj.status !== 'pending') return;

                if (qObj.questionType === 'gps' && qObj.autoPayload) {
                    const p = qObj.autoPayload;
                    const finalPositive = typeof customOverrideBool === 'boolean' ? customOverrideBool : p.isPositive;
                    const finalHeadline = typeof customOverrideBool === 'boolean'
                        ? (finalPositive ? p.posHeadline || p.headline : p.negHeadline || p.headline)
                        : p.headline;
                    const finalAnswerText = typeof customOverrideBool === 'boolean'
                        ? (finalPositive ? p.posAnswerText || p.answerText : p.negAnswerText || p.answerText)
                        : p.answerText;

                    // Opdater zone-objektets invert hvis Gemmeren overstyrer JA/NEJ manuelt
                    const zoneToSave = { ...p.zoneObject };
                    if (typeof customOverrideBool === 'boolean' && customOverrideBool !== p.isPositive) {
                        if (zoneToSave.type === 'thermometer') {
                            zoneToSave.warmer = finalPositive;
                        } else {
                            zoneToSave.invert = !zoneToSave.invert;
                        }
                    }

                    await saveMapObject(zoneToSave);

                    const updatedQ = {
                        ...qObj,
                        status: 'answered',
                        answerText: finalAnswerText,
                        answeredBy: answeredByLabel,
                        answeredAtMillis: Date.now()
                    };
                    await upsertQuestionRecord(updatedQ);
                    await sendChatMessage(`🚨 SVAR BEKRÆFTET (${answeredByLabel}) PÅ ${qObj.category}: ${finalAnswerText}`);
                    triggerBroadcastReveal({
                        category: `${qObj.category} SVAR`,
                        headline: finalHeadline,
                        subtext: finalAnswerText,
                        isPositive: finalPositive,
                        cardReward: qObj.cardReward || p.cardReward
                    });
                } else if (qObj.questionType === 'photo') {
                    // 20-minutters Foto-tidsfrist udløbet automatisk
                    const timeoutText = "⏰ 20 MIN. TIDSFRIST UDLØBET! Systemet har automatisk lukket spørgsmålet.";
                    const updatedQ = {
                        ...qObj,
                        status: 'answered',
                        answerText: timeoutText,
                        answeredBy: 'System (20m udløbet)',
                        answeredAtMillis: Date.now()
                    };
                    await upsertQuestionRecord(updatedQ);
                    await sendChatMessage(`⏰ FOTO-TIDSFRIST UDLØBET (20 MIN) på "${qObj.title}"!`);
                    triggerBroadcastReveal({
                        category: 'FOTO TIDSFRIST',
                        headline: '⏰ 20 MINUTTER UDLØBET!',
                        subtext: `Tidsfristen for "${qObj.title}" er gået.`,
                        isPositive: false,
                        cardReward: 'Tidsfrist overskredet'
                    });
                }
            };

            // Automatisk 5-min (GPS) og 20-min (Foto) deadline-overvågning
            const finalizingIdsRef = useRef(new Set());
            useEffect(() => {
                if (!user) return;
                questionsLog.forEach(q => {
                    if (q.status === 'pending' && q.deadlineMillis && nowMillis >= q.deadlineMillis) {
                        if (!finalizingIdsRef.current.has(q.id)) {
                            finalizingIdsRef.current.add(q.id);
                            finalizePendingQuestion(q, null, q.questionType === 'photo' ? 'System (20 min udløbet)' : 'System (5 min auto-svar)');
                        }
                    }
                });
            }, [nowMillis, questionsLog, user]);

            // 45-Minute Hide Countdown Timer Effect
            useEffect(() => {
                const interval = setInterval(() => {
                    if (!roomState.isRunning || !roomState.timerEndMillis) {
                        if (!roomState.timerEndMillis) setClockDisplay("45:00");
                        return;
                    }
                    const remainingMs = Math.max(0, roomState.timerEndMillis - Date.now());
                    const totalSecs = Math.floor(remainingMs / 1000);
                    const mins = String(Math.floor(totalSecs / 60)).padStart(2, '0');
                    const secs = String(totalSecs % 60).padStart(2, '0');
                    setClockDisplay(`${mins}:${secs}`);
                }, 500);
                return () => clearInterval(interval);
            }, [roomState]);

            // DYNAMISKE STATIONER PÅ KORTET: Viser altid de nærmeste stationer (S-tog, Regional, Metro & Lokalbaner)
            // omkring spilleren med live afstand, og skifter automatisk når man bevæger sig!
            useEffect(() => {
                if (!mapInstanceRef.current) return;
                layersRef.current.hubs.clearLayers();
                if (!showHubs) return;

                const myPt = turf.point([myCoords.lng, myCoords.lat]);
                const allStationsWithDist = BUILTIN_GEO_DATA.station.map((st, idx) => {
                    const dKm = turf.distance(myPt, turf.point([st.lng, st.lat]), { units: 'kilometers' });
                    return { ...st, distanceKm: dKm, idx };
                }).sort((a, b) => a.distanceKm - b.distanceKm);

                // Vis de 18 stationer man er tættest på lige nu (opdaterer straks når man rykker sig!)
                const nearestStations = allStationsWithDist.slice(0, 18);

                // Tegn en diskret stiplet forbindelseslinje til den absolut nærmeste station (#1)
                if (nearestStations.length > 0) {
                    const closest = nearestStations[0];
                    L.polyline([[myCoords.lat, myCoords.lng], [closest.lat, closest.lng]], {
                        color: '#F3B229',
                        weight: 2.5,
                        dashArray: '4, 6',
                        opacity: 0.85,
                        interactive: false
                    }).addTo(layersRef.current.hubs);
                }

                nearestStations.forEach((st, rank) => {
                    const isClosest = rank === 0;
                    const isLokal = (st.line || '').includes('Lokalbane');
                    const dText = st.distanceKm < 1
                        ? `${Math.round(st.distanceKm * 1000)}m`
                        : `${st.distanceKm.toFixed(1)}km`;

                    const badgeStyle = isClosest
                        ? 'background:#F3B229;color:#1B2634;border:2px solid #FFFFFF;font-weight:900;box-shadow:0 0 0 4px rgba(243,178,41,0.35),0 4px 10px rgba(0,0,0,0.45);'
                        : isLokal
                        ? 'border-color:#2EB85C;color:#ECECE4;'
                        : '';

                    const icon = L.divIcon({
                        className: '',
                        html: `<div class="jl-hub-marker" style="${badgeStyle}">${isClosest ? '★ ' : isLokal ? '🛤️ ' : '🚆 '}${st.name} <span style="opacity:0.85;font-size:10px;">(${dText})</span></div>`,
                        iconSize: [120, 22],
                        iconAnchor: [60, 11]
                    });
                    L.marker([st.lat, st.lng], {
                        icon,
                        interactive: false,
                        zIndexOffset: isClosest ? 600 : 200
                    }).addTo(layersRef.current.hubs);
                });

                BUILTIN_GEO_DATA.lufthavn.slice(0, 2).forEach(ap => {
