                    const dKm = turf.distance(myPt, turf.point([ap.lng, ap.lat]), { units: 'kilometers' });
                    const icon = L.divIcon({
                        className: '',
                        html: `<div class="jl-hub-marker" style="border-color:#F3B229;color:#F3B229;">✈️ ${ap.name} (${dKm.toFixed(1)}km)</div>`,
                        iconSize: [140, 20],
                        iconAnchor: [70, 10]
                    });
                    L.marker([ap.lat, ap.lng], { icon, interactive: false }).addTo(layersRef.current.hubs);
                });
            }, [showHubs, myCoords, osmRevision]);

            // Render Hider's 500m Hiding Spot & Tactical Vectors to Chasers (ONLY visible to Hider!)
            useEffect(() => {
                if (!mapInstanceRef.current) return;
                layersRef.current.hiderZone.clearLayers();

                if (myRole !== 'hider') return;

                const spot = hiderLockedSpot || myCoords;
                // 500m Legal Hiding Zone Circle (Jet Lag Green)
                const zoneCircle = turf.circle([spot.lng, spot.lat], 0.5, { steps: 48, units: 'kilometers' });
                L.geoJSON(zoneCircle, {
                    interactive: false,
                    style: {
                        color: '#2EB85C',
                        weight: 3,
                        dashArray: '6, 4',
                        fillColor: '#2EB85C',
                        fillOpacity: 0.22
                    }
                }).addTo(layersRef.current.hiderZone);

                // Draw tactical tracking lines & distance badges from Hider to every Chaser on the map!
                chasersWithDistance.forEach(chaser => {
                    const isDanger = chaser.distanceKm < 2;
                    L.polyline([[myCoords.lat, myCoords.lng], [chaser.lat, chaser.lng]], {
                        color: isDanger ? '#DB3832' : '#F3B229',
                        weight: isDanger ? 4 : 3,
                        dashArray: '6, 8',
                        interactive: false
                    }).addTo(layersRef.current.hiderZone);

                    // Tegn også en synlig radar-halo rundt om hver Finder, så Gemmeren altid kan spotte dem ved lavt zoom
                    L.circleMarker([chaser.lat, chaser.lng], {
                        radius: 26,
                        color: isDanger ? '#DB3832' : '#F3B229',
                        weight: 2,
                        fillColor: isDanger ? '#DB3832' : '#F3B229',
                        fillOpacity: 0.18,
                        interactive: false
                    }).addTo(layersRef.current.hiderZone);
                });
            }, [myRole, myCoords, hiderLockedSpot, chasersWithDistance]);

            // Render Saved Red Exclusion Zones on Map (Seekers always see them; Hiders only see them if toggled on!)
            useEffect(() => {
                if (!mapInstanceRef.current) return;
                layersRef.current.exclusions.clearLayers();

                if (myRole === 'hider' && !hiderShowSeekerZones) return;

                mapObjects.forEach(obj => {
                    const geo = buildExclusionGeoJSON(obj);
                    if (geo) {
                        const layer = L.geoJSON(geo, {
                            style: {
                                color: '#DB3832',
                                weight: myRole === 'hider' ? 2 : 3,
                                dashArray: '8, 6',
                                fillColor: '#DB3832',
                                fillOpacity: myRole === 'hider' ? 0.22 : 0.42,
                                fillRule: 'evenodd'
                            }
                        }).addTo(layersRef.current.exclusions);

                        if (myRole === 'seeker') {
                            layer.bindPopup(`
                                <div style="font-family:'Plus Jakarta Sans',sans-serif; padding:4px; min-width:170px;">
                                    <div style="font-weight:800; color:#1B2634; font-size:14px; margin-bottom:2px;">${obj.label || 'Rød Udelukkelseszone'}</div>
                                    <div style="font-size:11px; color:#64748b; margin-bottom:8px;">Tilføjet af ${obj.createdByName || 'Spiller'}</div>
                                    <button id="remove-zone-${obj.id}" style="width:100%; background:#DB3832; color:white; font-weight:700; border:none; padding:6px 10px; border-radius:6px; cursor:pointer;">
                                        Slet Zone
                                    </button>
                                </div>
                            `);

                            layer.on('popupopen', () => {
                                const btn = document.getElementById(`remove-zone-${obj.id}`);
                                if (btn) btn.onclick = () => handleDeleteObject(obj.id);
                            });
                        }
                    }

                    // Vis reference-punkter (f.eks. Lufthavne / Museer / Hospitaler) så man kan se præcis hvorfor linjen skærer der!
                    if (obj.refPoints && Array.isArray(obj.refPoints)) {
                        obj.refPoints.forEach(pt => {
                            if (typeof pt.lat === 'number' && typeof pt.lng === 'number' && pt.name) {
                                const chipIcon = L.divIcon({
                                    className: '',
                                    html: `<div class="jl-poi-chip">📍 ${pt.name}</div>`,
                                    iconSize: [110, 20],
                                    iconAnchor: [55, 10]
                                });
                                L.marker([pt.lat, pt.lng], { icon: chipIcon, interactive: false }).addTo(layersRef.current.exclusions);
                            }
                        });
                    }
                });
            }, [mapObjects, myRole, hiderShowSeekerZones]);

            useEffect(() => {
                if (!mapInstanceRef.current) return;
                layersRef.current.preview.clearLayers();

                if (activeTool === 'radius') {
                    const previewGeo = buildExclusionGeoJSON({
                        type: 'radius',
                        lat: radiusCenter.lat,
                        lng: radiusCenter.lng,
                        radiusKm: parseFloat(radiusKm) || 1,
                        invert: radiusInvert
                    });
                    if (previewGeo) {
                        L.geoJSON(previewGeo, {
                            interactive: false,
                            style: {
                                color: '#F3B229',
                                weight: 3,
                                dashArray: '6, 6',
                                fillColor: '#DB3832',
                                fillOpacity: 0.35
                            }
                        }).addTo(layersRef.current.preview);
                    }
                    L.circleMarker([radiusCenter.lat, radiusCenter.lng], {
                        radius: 8,
                        color: '#1B2634',
                        weight: 3,
                        fillColor: '#F3B229',
                        fillOpacity: 1,
                        interactive: false
                    }).addTo(layersRef.current.preview);
                }

                if (activeTool === 'polygon' && polyPoints.length > 0) {
                    const latlngs = polyPoints.map(p => [p.lat, p.lng]);
                    L.polyline(latlngs, { color: '#F3B229', weight: 3, dashArray: '5, 5', interactive: false }).addTo(layersRef.current.preview);
                    polyPoints.forEach((p, idx) => {
                        L.circleMarker([p.lat, p.lng], {
                            radius: 6,
                            color: '#1B2634',
                            weight: 2,
                            fillColor: idx === 0 ? '#2EB85C' : '#F3B229',
                            fillOpacity: 1,
                            interactive: false
                        }).addTo(layersRef.current.preview);
                    });
                    if (polyPoints.length >= 3) {
                        const previewGeo = buildExclusionGeoJSON({
                            type: 'polygon',
                            coords: polyPoints,
                            invert: polyInvert
                        });
                        if (previewGeo) {
                            L.geoJSON(previewGeo, {
                                interactive: false,
                                style: {
                                    color: '#F3B229',
                                    weight: 2,
                                    fillColor: '#DB3832',
                                    fillOpacity: 0.35
                                }
                            }).addTo(layersRef.current.preview);
                        }
                    }
                }

                if (activeTool === 'thermometer' || (activeTool === 'questions' && questionTab === 'thermometer')) {
                    if (thermoA) {
                        L.circleMarker([thermoA.lat, thermoA.lng], {
                            radius: 9, color: '#1B2634', weight: 3, fillColor: '#3b82f6', fillOpacity: 1, interactive: false
                        }).bindTooltip("START (A)", { permanent: true, direction: "top" }).addTo(layersRef.current.preview);
                    }
                    if (thermoB) {
                        L.circleMarker([thermoB.lat, thermoB.lng], {
                            radius: 9, color: '#1B2634', weight: 3, fillColor: '#DB3832', fillOpacity: 1, interactive: false
                        }).bindTooltip("SLUT (B)", { permanent: true, direction: "top" }).addTo(layersRef.current.preview);
                    }
                    if (thermoA && thermoB) {
                        L.polyline([[thermoA.lat, thermoA.lng], [thermoB.lat, thermoB.lng]], {
                            color: '#1B2634', weight: 4, dashArray: '6, 6', interactive: false
                        }).addTo(layersRef.current.preview);

                        if (activeTool === 'thermometer') {
                            const previewGeo = buildExclusionGeoJSON({
                                type: 'thermometer',
                                pointA: thermoA,
                                pointB: thermoB,
                                warmer: thermoWarmer
                            });
                            if (previewGeo) {
                                L.geoJSON(previewGeo, {
                                    interactive: false,
                                    style: {
                                        color: '#F3B229',
                                        weight: 3,
                                        dashArray: '8, 6',
                                        fillColor: '#DB3832',
                                        fillOpacity: 0.38
                                    }
                                }).addTo(layersRef.current.preview);
                            }
                        }
                    }
                }
            }, [activeTool, questionTab, radiusCenter, radiusKm, radiusInvert, polyPoints, polyInvert, thermoA, thermoB, thermoWarmer]);

            // Render Jet Lag Player Pins (Enforcing strict Hide & Seek visibility rules!)
            useEffect(() => {
                if (!mapInstanceRef.current || !user) return;
                layersRef.current.players.clearLayers();

                // Kombinér rigtige spillere + eventuelle simulerede Bot-Findere (kun synlige for Gemmer)
                const combinedList = [...players];
                if (myRole === 'hider' && simulateBotChasers) {
                    chasersWithDistance.forEach(ch => {
                        if (ch.isBot && !combinedList.some(p => p.uid === ch.uid)) {
                            combinedList.push(ch);
                        }
                    });
                }

                combinedList.forEach(p => {
                    const isMe = p.uid === user.uid;
                    const playerEffectiveRole = p.team === roomState.hidingTeam ? 'hider' : 'seeker';

                    // Rule: Hiders (Hold Gemmer) see EVERYONE (especially all Seekers!). Seekers (Hold Finder) ONLY see Seekers!
                    const isVisible = isMe || myRole === 'hider' || playerEffectiveRole === 'seeker';

                    if (!isVisible || typeof p.lat !== 'number' || typeof p.lng !== 'number') return;

                    const isRunner = playerEffectiveRole === 'hider';
                    const initials = (p.name || 'JL').slice(0, 2).toUpperCase();
                    const roleText = isRunner ? 'RUNNER' : 'CHASERS';
                    const pinClass = isRunner ? 'runner' : 'chaser';
                    const teamLabel = p.team === 'teamA' ? 'H1' : 'H2';

                    // Hvis jeg er Gemmer og kigger på en Finder, viser vi også den direkte afstand lige på Finderens kort-pin!
                    let distBadgeHtml = '';
                    if (myRole === 'hider' && !isRunner && !isMe) {
                        const dKm = turf.distance(turf.point([myCoords.lng, myCoords.lat]), turf.point([p.lng, p.lat]), { units: 'kilometers' });
                        const dText = dKm < 1 ? `${Math.round(dKm * 1000)}m` : `${dKm.toFixed(1)}km`;
                        distBadgeHtml = `<div style="background:#DB3832;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:11px;padding:0 6px;border-radius:999px;border:1.5px solid #fff;margin-top:1px;">🎯 ${dText}</div>`;
                    }

                    const icon = L.divIcon({
                        className: '',
                        html: `
                            <div class="jl-pin-wrapper">
                                <div class="jl-pin-circle ${pinClass}">
                                    <div class="jl-pin-inner-avatar">${initials}</div>
                                </div>
                                <div class="jl-pin-banner ${pinClass}">${roleText}</div>
                                <div class="jl-pin-pointer ${pinClass}"></div>
                                <div class="jl-pin-name-tag">[${teamLabel}] ${p.name}${isMe ? ' (DIG)' : ''}</div>
                                ${distBadgeHtml}
                            </div>
                        `,
                        iconSize: [68, 96],
                        iconAnchor: [34, 72]
                    });

                    L.marker([p.lat, p.lng], {
                        icon,
                        zIndexOffset: !isRunner ? 1000 : 500
                    }).addTo(layersRef.current.players);
                });
            }, [players, myRole, roomState.hidingTeam, user, myCoords, simulateBotChasers, chasersWithDistance]);

            const saveMapObject = async (newObj) => {
                const fullObj = {
                    ...newObj,
                    id: `zone_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                    roomCode,
                    createdBy: user.uid,
                    createdByName: playerName,
                    createdAtMillis: Date.now()
                };

                if (!isCloudActive || !db) {
                    setMapObjects(prev => [...prev, fullObj]);
                    if (localChannel) localChannel.postMessage({ roomCode, kind: 'addObject', payload: fullObj });
                    return;
                }

                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'mapObjects'), fullObj);
            };

            const upsertQuestionRecord = async (qRecord) => {
                setQuestionsLog(prev => {
                    const others = prev.filter(q => q.id !== qRecord.id);
                    return [...others, qRecord].sort((a, b) => (a.createdAtMillis || 0) - (b.createdAtMillis || 0));
                });

                if (localChannel) {
                    localChannel.postMessage({ roomCode, kind: 'questionUpsert', payload: qRecord });
                }

                if (isCloudActive && db) {
                    try {
                        const qDoc = doc(db, 'artifacts', appId, 'public', 'data', 'questions', qRecord.id);
                        await setDoc(qDoc, qRecord);
                    } catch (e) {
                        console.error("Question save error:", e);
                    }
                }
            };

            // ============================================================================
            // 5 MINUTTERS GEMMER-ACCEPT / AUTO-SVAR MOTOR & 20 MINUTTERS FOTO-TIMER
            // ============================================================================
            const formatDurationMmSs = (totalSecs) => {
                const safeSecs = Math.max(0, Math.floor(totalSecs));
                const m = Math.floor(safeSecs / 60);
                const s = safeSecs % 60;
                return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            };

            const skipTelemetryWaitNow = async () => {
                if (activePendingQuestion) {
                    await finalizePendingQuestion(activePendingQuestion, null, `${playerName} (Hurtig-Svar)`);
                }
                if (telemetryTimerRef.current) {
                    clearInterval(telemetryTimerRef.current);
                    telemetryTimerRef.current = null;
                }
                const fn = telemetryCompleteFnRef.current;
                telemetryCompleteFnRef.current = null;
                setPendingTelemetry(null);
                setTelemetryMinimized(false);
                if (fn) await fn();
            };

            // Opretter et synkroniseret 5-minutters GPS-spørgsmål, som Gemmeren kan acceptere/besvare inden for 5 min,
            // eller som systemet automatisk besvarer og tegner på kortet, når de 5 minutter er gået!
            const dispatchSyncedGpsQuestion = async ({
                questionKey,
                category,
                title,
                questionText,
                cardReward,
                headline,
                answerText,
                isPositive,
                zoneObject
            }) => {
                setActiveTool(null);
                setTelemetryMinimized(false);
                JetLagAudio.playQuestionSent();

                const waitSecs = 5 * 60; // 5 minutter (300 sekunder) til at Gemmeren kan acceptere, ellers svarer systemet selv!
                const now = Date.now();
                const qRecord = {
                    id: `q_${now}_${Math.random().toString(36).slice(2, 5)}`,
                    questionKey,
                    roomCode,
                    questionType: 'gps',
                    category,
                    title,
                    questionText,
                    cardReward,
                    status: 'pending',
                    autoAnswered: true,
                    askedBy: playerName,
                    createdAtMillis: now,
                    durationSecs: waitSecs,
                    deadlineMillis: now + waitSecs * 1000,
                    autoPayload: {
                        headline,
                        answerText,
                        isPositive,
                        cardReward,
                        zoneObject
                    }
                };

                await upsertQuestionRecord(qRecord);
                await sendChatMessage(`📡 [SPØRGSMÅL SENDT — ${category}]: "${questionText}" (Gemmer har 05:00 min til at acceptere – ellers svarer systemet automatisk! Belønning: ${cardReward})`);
                notify("📡 Spørgsmål sendt! Gemmer har 5 min til at acceptere (ellers auto-svarer systemet).");
            };

            const triggerBroadcastReveal = ({ category, headline, subtext, isPositive, cardReward }) => {
                JetLagAudio.playAnswerReveal(isPositive);
                setRevealOverlay({ category, headline, subtext, isPositive, cardReward });
                setTimeout(() => {
                    setRevealOverlay(prev => (prev && prev.headline === headline ? null : prev));
                }, 5500);
            };

            // Tjek om et spørgsmål allerede er brugt i denne runde
            const isQuestionUsed = (qKey) => {
                return questionsLog.some(q => q.questionKey === qKey);
            };

            // 1. OFFICIAL RADAR QUESTION ("Are you within X of me?") — 5 min Gemmer-Accept / Auto-Svar
            const handleAskAutoRadar = async (customKm) => {
                if (!user || activePendingQuestion) return;
                const km = parseFloat(customKm ?? qRadarKm) || 4.828;
                const kmLabel = km < 1 ? `${Math.round(km * 1000)} m` : `${km.toFixed(1)} km`;
                const qText = `🎯 Radar: "Er du inden for ${kmLabel} af mig?"`;

                const seekerPt = turf.point([myCoords.lng, myCoords.lat]);
                const hiderPt = turf.point([activeHiderTarget.lng, activeHiderTarget.lat]);
                const actualDist = turf.distance(seekerPt, hiderPt, { units: 'kilometers' });
                const isInside = actualDist <= km;

                const headline = isInside ? `✅ JA! INDEN FOR ${kmLabel}` : `❌ NEJ! UDEN FOR ${kmLabel}`;
                const answerText = isInside
                    ? `✅ JA! Gemmeren ER inden for ${kmLabel} af jer! (Alt uden for ${kmLabel} er nu farvet rødt)`
                    : `❌ NEJ! Gemmeren er IKKE inden for ${kmLabel} af jer! (Cirklen på ${kmLabel} er nu farvet rød)`;

                await dispatchSyncedGpsQuestion({
                    questionKey: `radar_${km}`,
                    category: 'RADAR',
                    title: `RADAR (${kmLabel})`,
                    questionText: qText,
                    cardReward: 'Træk 2 kort, behold 1',
                    headline,
                    answerText,
                    isPositive: isInside,
                    zoneObject: {
                        type: 'radius',
                        lat: myCoords.lat,
                        lng: myCoords.lng,
                        radiusKm: km,
                        invert: isInside,
                        label: `Radar (${kmLabel}): ${isInside ? 'JA (Indenfor)' : 'NEJ (Udenfor)'}`
                    }
                });
            };

            // 2. OFFICIAL THERMOMETER QUESTION ("After traveling X, am I hotter or colder?") — 5 min Gemmer-Accept / Auto-Svar
            const handleAskAutoThermometer = async () => {
                if (!user || !thermoA || !thermoB || activePendingQuestion) return;
                const ptA = turf.point([thermoA.lng, thermoA.lat]);
                const ptB = turf.point([thermoB.lng, thermoB.lat]);
                const moveDist = turf.distance(ptA, ptB, { units: 'kilometers' }).toFixed(2);
                const snapA = { ...thermoA };
                const snapB = { ...thermoB };
                const qText = `🌡️ Thermometer: "Efter at have rejst ${moveDist} km (fra A til B), er jeg så Varmere eller Koldere?"`;

                const hiderPt = turf.point([activeHiderTarget.lng, activeHiderTarget.lat]);
                const distA = turf.distance(ptA, hiderPt, { units: 'kilometers' });
                const distB = turf.distance(ptB, hiderPt, { units: 'kilometers' });
                const isWarmer = distB < distA;

                const headline = isWarmer ? `🔥 VARMERE! (HOTTER)` : `❄️ KOLDERE! (COLDER)`;
                const answerText = isWarmer
                    ? `🔥 VARMERE! I er kommet tættere på gemmeren ved punkt B! (Den kolde halvdel mod A er nu skåret væk og farvet rød)`
                    : `❄️ KOLDERE! I er kommet længere væk ved punkt B! (Halvdelen mod B er nu skåret væk og farvet rød)`;

                setThermoA(null);
                setThermoB(null);

                await dispatchSyncedGpsQuestion({
                    questionKey: `thermo_${moveDist}`,
                    category: 'THERMOMETER',
                    title: `TERMOMETER (${moveDist} km)`,
                    questionText: qText,
                    cardReward: 'Træk 2 kort, behold 1',
                    headline,
                    answerText,
                    isPositive: isWarmer,
                    zoneObject: {
                        type: 'thermometer',
                        pointA: snapA,
                        pointB: snapB,
                        warmer: isWarmer,
                        refPoints: [
                            { name: "Start (A)", lat: snapA.lat, lng: snapA.lng },
                            { name: "Slut (B)", lat: snapB.lat, lng: snapB.lng }
                        ],
                        label: `Termometer (${moveDist} km): ${isWarmer ? 'VARMERE 🔥' : 'KOLDERE ❄️'}`
                    }
                });
            };

            // 3. OFFICIAL MEASURING QUESTION ("Compared to me, are you closer to or further from ___?") — 5 min Gemmer-Accept / Auto-Svar
            const handleAskAutoMeasuring = async () => {
                if (!user || activePendingQuestion) return;
                const qMeta = OFFICIAL_MEASURING_QUESTIONS.find(q => q.id === qMeasureTarget) || OFFICIAL_MEASURING_QUESTIONS[0];
                const isLineCategory = Boolean(BUILTIN_LINE_DATA[qMeta.id]);

                const seekerNearest = isLineCategory
                    ? getNearestPOI(myCoords.lat, myCoords.lng, qMeta.id)
                    : getNearestPOI(myCoords.lat, myCoords.lng, BUILTIN_GEO_DATA[qMeta.id] || BUILTIN_GEO_DATA.lufthavn);
                if (!seekerNearest) return;

                const seekerDist = Math.max(0.15, parseFloat(seekerNearest.distanceKm.toFixed(2)));
                const qText = `📏 Measuring: "Sammenlignet med mig (${seekerDist} km), er du så tættere på eller længere fra ${qMeta.label}?"`;

                const hiderNearest = isLineCategory
                    ? getNearestPOI(activeHiderTarget.lat, activeHiderTarget.lng, qMeta.id)
                    : getNearestPOI(activeHiderTarget.lat, activeHiderTarget.lng, BUILTIN_GEO_DATA[qMeta.id] || BUILTIN_GEO_DATA.lufthavn);
                const hiderCloser = hiderNearest.distanceKm <= seekerNearest.distanceKm;

                const headline = hiderCloser ? `🌊 TÆTTERE PÅ! (CLOSER)` : `🏔️ LÆNGERE VÆK! (FURTHER)`;
                const answerText = hiderCloser
                    ? `🌊 TÆTTERE PÅ! Gemmeren er TÆTTERE på ${qMeta.label} end jer (< ${seekerDist} km). Alt længere væk end ${seekerDist} km langs hele ${isLineCategory ? 'strækningen/kysten' : 'kategorien'} er nu farvet rødt!`
                    : `🏔️ LÆNGERE VÆK! Gemmeren er LÆNGERE fra ${qMeta.label} end jer (> ${seekerDist} km). Hele ${isLineCategory ? 'bæltet langs strækningen/kysten' : 'området'} inden for ${seekerDist} km er nu farvet rødt!`;

                const list = BUILTIN_GEO_DATA[qMeta.id] || BUILTIN_GEO_DATA.lufthavn;
                const zoneObject = isLineCategory
                    ? {
                        type: 'line_buffer',
                        category: qMeta.id,
                        lines: BUILTIN_LINE_DATA[qMeta.id].segments.map(s => s.coords),
                        refPoints: [seekerNearest],
                        radiusKm: seekerDist,
                        invert: hiderCloser,
                        label: `Measuring (${qMeta.label}, ${seekerDist} km): ${hiderCloser ? 'Tættere på' : 'Længere væk'}`
                    }
                    : {
                        type: 'compound_radius',
                        category: qMeta.id,
                        points: list.map(p => ({ lat: p.lat, lng: p.lng })),
                        refPoints: list.length <= 12 ? list : [seekerNearest],
                        radiusKm: seekerDist,
                        invert: hiderCloser,
                        label: `Measuring (${qMeta.label}, ${seekerDist} km): ${hiderCloser ? 'Tættere på' : 'Længere væk'}`
                    };

                await dispatchSyncedGpsQuestion({
                    questionKey: `measure_${qMeta.id}`,
                    category: 'MEASURING',
                    title: `MEASURING: ${qMeta.label}`,
                    questionText: qText,
                    cardReward: 'Træk 3 kort, behold 1',
                    headline,
                    answerText,
                    isPositive: hiderCloser,
                    zoneObject
                });
            };

            // 4. OFFICIAL MATCHING QUESTION ("Is your nearest ___ the same as my ___?") — 5 min Gemmer-Accept / Auto-Svar
            const handleAskAutoMatching = async () => {
                if (!user || activePendingQuestion) return;
                const qMeta = OFFICIAL_MATCHING_QUESTIONS.find(q => q.id === qMatchCategory) || OFFICIAL_MATCHING_QUESTIONS[0];

                // Hvis spørgsmålet er "Street or Path" sendes det til Gemmerens indbakke
                if (qMeta.mode === 'manual') {
                    handleSendManualOrPhotoQuestion({
                        id: qMeta.id,
                        type: 'text',
                        title: `🧩 Matching: ${qMeta.label}`,
                        text: `Er din gade/sti den samme som vores nuværende gade? (Svar JA eller NEJ — Træk 3 kort, behold 1)`
                    });
                    return;
                }

                // Special officiel Matching: Station's Name Length
                if (qMeta.mode === 'station_length') {
                    const stList = BUILTIN_GEO_DATA.station;
                    const seekerSt = getNearestPOI(myCoords.lat, myCoords.lng, stList);
                    const seekerLen = seekerSt.name.length;
                    const qText = `🧩 Matching: "Har din nærmeste togstation samme navnelængde som vores (${seekerSt.name} = ${seekerLen} tegn)?"`;

                    const hiderSt = getNearestPOI(activeHiderTarget.lat, activeHiderTarget.lng, stList);
                    const isSameLen = hiderSt.name.length === seekerLen;
                    const headline = isSameLen ? `✅ JA! (${seekerLen} TEGN)` : `❌ NEJ! (IKKE ${seekerLen} TEGN)`;
                    const answerText = isSameLen
                        ? `✅ JA! Gemmerens nærmeste station har OGSÅ ${seekerLen} tegn i navnet!`
                        : `❌ NEJ! Gemmerens nærmeste station har IKKE ${seekerLen} tegn i navnet!`;

                    const excludedStations = stList.filter(s => isSameLen ? s.name.length !== seekerLen : s.name.length === seekerLen);

                    await dispatchSyncedGpsQuestion({
                        questionKey: `match_${qMeta.id}`,
                        category: 'MATCHING',
                        title: `STATIONSNAVN LÆNGDE (${seekerLen} TEGN)`,
                        questionText: qText,
                        cardReward: 'Træk 3 kort, behold 1',
                        headline,
                        answerText,
                        isPositive: isSameLen,
                        zoneObject: {
                            type: 'compound_radius',
                            points: excludedStations.map(s => ({ lat: s.lat, lng: s.lng })),
                            radiusKm: 0.6,
                            invert: false,
                            label: `Stationsnavn (${seekerLen} tegn): ${isSameLen ? 'JA' : 'NEJ'}`
                        }
                    });
                    return;
                }

                // Special officiel Matching: Transit Line
                if (qMeta.mode === 'line_match') {
                    const stList = BUILTIN_GEO_DATA.station;
                    const seekerSt = getNearestPOI(myCoords.lat, myCoords.lng, stList);
                    const qText = `🧩 Matching: "Stopper vores nuværende toglinje (${seekerSt.line} ved ${seekerSt.name}) på din station?"`;

                    const hiderSt = getNearestPOI(activeHiderTarget.lat, activeHiderTarget.lng, stList);
                    const seekerLines = (seekerSt.line || '').split('/').map(s => s.trim());
                    const hiderLines = (hiderSt.line || '').split('/').map(s => s.trim());
                    const isMatch = seekerLines.some(l => hiderLines.includes(l));
                    const headline = isMatch ? `✅ JA! SAMME TOGLINJE` : `❌ NEJ! ANDEN TOGLINJE`;
                    const answerText = isMatch
                        ? `✅ JA! Gemmerens station betjenes OGSÅ af ${seekerSt.line}!`
                        : `❌ NEJ! Gemmerens station betjenes IKKE af ${seekerSt.line}!`;

                    const excludedLineStations = stList.filter(s => {
                        const sLines = (s.line || '').split('/').map(x => x.trim());
                        const shares = seekerLines.some(l => sLines.includes(l));
                        return isMatch ? !shares : shares;
                    });

                    await dispatchSyncedGpsQuestion({
                        questionKey: `match_${qMeta.id}`,
                        category: 'MATCHING',
                        title: `TRANSIT LINE (${seekerSt.line})`,
                        questionText: qText,
                        cardReward: 'Træk 3 kort, behold 1',
                        headline,
                        answerText,
                        isPositive: isMatch,
                        zoneObject: {
                            type: 'compound_radius',
                            points: excludedLineStations.map(s => ({ lat: s.lat, lng: s.lng })),
                            radiusKm: 0.6,
                            invert: false,
                            label: `Toglinje (${seekerSt.line}): ${isMatch ? 'JA' : 'NEJ'}`
                        }
                    });
                    return;
                }

                // Special officiel Matching: Landmass (Sjælland vs. Amager)
                if (qMeta.mode === 'landmass') {
                    const amagerPoly = [
                        { lat: 55.695, lng: 12.565 },
                        { lat: 55.700, lng: 12.640 },
                        { lat: 55.550, lng: 12.690 },
                        { lat: 55.550, lng: 12.510 },
                        { lat: 55.645, lng: 12.540 }
                    ];
                    const ring = amagerPoly.map(p => [p.lng, p.lat]);
                    ring.push([amagerPoly[0].lng, amagerPoly[0].lat]);
                    const amagerTurf = turf.polygon([ring]);
                    const seekerOnAmager = turf.booleanPointInPolygon(turf.point([myCoords.lng, myCoords.lat]), amagerTurf);
                    const seekerLand = seekerOnAmager ? 'Amager' : 'Sjælland';
                    const qText = `🧩 Matching: "Er du på samme landmasse/ø som os (${seekerLand})?"`;

                    const hiderOnAmager = turf.booleanPointInPolygon(turf.point([activeHiderTarget.lng, activeHiderTarget.lat]), amagerTurf);
                    const isSame = seekerOnAmager === hiderOnAmager;
                    const hiderStayAmager = (seekerOnAmager && isSame) || (!seekerOnAmager && !isSame);
                    const headline = isSame ? `✅ JA! PÅ ${seekerLand.toUpperCase()}` : `❌ NEJ! IKKE PÅ ${seekerLand.toUpperCase()}`;
                    const answerText = isSame
                        ? `✅ JA! Gemmeren er OGSÅ på ${seekerLand}!`
                        : `❌ NEJ! Gemmeren er IKKE på ${seekerLand}!`;

                    await dispatchSyncedGpsQuestion({
                        questionKey: `match_${qMeta.id}`,
                        category: 'MATCHING',
                        title: `LANDMASS (${seekerLand})`,
                        questionText: qText,
                        cardReward: 'Træk 3 kort, behold 1',
                        headline,
                        answerText,
                        isPositive: isSame,
                        zoneObject: {
                            type: 'polygon',
                            coords: amagerPoly,
                            invert: hiderStayAmager,
                            label: `Landmass (${seekerLand}): ${isSame ? 'JA' : 'NEJ'}`
                        }
                    });
                    return;
                }

                // Standard Eksakt Kilometer-Voronoi Matching (Lufthavne, Kommuner, Bydele, Museer, Biografer, Hospitaler, Biblioteker osv.)
                const list = BUILTIN_GEO_DATA[qMeta.id] || BUILTIN_GEO_DATA.lufthavn;
                const seekerNearest = getNearestPOI(myCoords.lat, myCoords.lng, list);
                if (!seekerNearest) return;
                const qText = `🧩 Matching: "Er din nærmeste ${qMeta.label} den samme som vores (${seekerNearest.name})?"`;

                const hiderNearest = getNearestPOI(activeHiderTarget.lat, activeHiderTarget.lng, list);
                const isSame = seekerNearest.index === hiderNearest.index;

                const headline = isSame ? `✅ JA! MATCH (${seekerNearest.name})` : `❌ NEJ! IKKE ${seekerNearest.name}`;
                const answerText = isSame
                    ? `✅ JA (MATCH)! Gemmerens nærmeste ${qMeta.label} er OGSÅ ${seekerNearest.name}! (Alt uden for denne Voronoi-zone er nu farvet rødt)`
                    : `❌ NEJ (IKKE MATCH)! Gemmerens nærmeste ${qMeta.label} er IKKE ${seekerNearest.name}! (Voronoi-zonen for ${seekerNearest.name} er nu skåret væk og farvet rød)`;

                await dispatchSyncedGpsQuestion({
                    questionKey: `match_${qMeta.id}`,
                    category: 'MATCHING',
                    title: `MATCHING: ${seekerNearest.name}`,
                    questionText: qText,
                    cardReward: 'Træk 3 kort, behold 1',
                    headline,
                    answerText,
                    isPositive: isSame,
                    zoneObject: {
                        type: 'voronoi_cell',
                        points: list.map(p => ({ lat: p.lat, lng: p.lng, name: p.name })),
                        refPoints: list.length <= 15 ? list : [seekerNearest],
                        targetIdx: seekerNearest.index,
                        invert: isSame,
                        label: `Matching (${seekerNearest.name}): ${isSame ? 'JA' : 'NEJ'}`
                    }
                });
            };

            // 5. OFFICIAL TENTACLES QUESTION ("Within X miles of me, which Y are you nearest to?") — 5 min Gemmer-Accept / Auto-Svar
            const handleAskAutoTentacles = async () => {
                if (!user || activePendingQuestion) return;
                const tMeta = OFFICIAL_TENTACLE_QUESTIONS.find(t => t.id === qTentacleId) || OFFICIAL_TENTACLE_QUESTIONS[0];
                const km = tMeta.radiusKm;
                const kmLabel = `${km.toFixed(1)} km`;
                const list = BUILTIN_GEO_DATA[tMeta.cat] || BUILTIN_GEO_DATA.museum;
                const qText = `🐙 Tentacles: "${tMeta.label} — Hvilken ${tMeta.shortTitle} inden for ${kmLabel} af os er du tættest på?"`;

                const seekerPt = turf.point([myCoords.lng, myCoords.lat]);
                const hiderPt = turf.point([activeHiderTarget.lng, activeHiderTarget.lat]);
                const distToHider = turf.distance(seekerPt, hiderPt, { units: 'kilometers' });

                let candidates = list.filter(item =>
                    turf.distance(seekerPt, turf.point([item.lng, item.lat]), { units: 'kilometers' }) <= km
                );
                if (candidates.length < 2) candidates = list;

                if (distToHider > km) {
                    const headline = `❌ UDEN FOR RÆKKEVIDDE (> ${kmLabel})`;
                    const answerText = `❌ UDEN FOR RÆKKEVIDDE! Gemmeren er slet ikke inden for ${kmLabel} af jer! (Cirklen på ${kmLabel} er nu farvet rød)`;
                    await dispatchSyncedGpsQuestion({
                        questionKey: `tentacle_${tMeta.id}`,
                        category: 'TENTACLES',
                        title: `TENTACLES (${tMeta.shortTitle})`,
                        questionText: qText,
                        cardReward: 'Træk 4 kort, behold 2',
                        headline,
                        answerText,
                        isPositive: false,
                        zoneObject: {
                            type: 'radius',
                            lat: myCoords.lat,
                            lng: myCoords.lng,
                            radiusKm: km,
                            invert: false,
                            label: `Tentacles (${kmLabel}): Uden for rækkevidde`
                        }
                    });
                    return;
                }

                const winningPOI = getNearestPOI(activeHiderTarget.lat, activeHiderTarget.lng, candidates);
                const headline = `🐙 HIT: ${winningPOI.name.toUpperCase()}`;
                const answerText = `🐙 TENTACLES HIT! Inden for ${kmLabel} er gemmeren tættest på ${winningPOI.name}! (Kun denne tentakel-zone er nu åben)`;

                await dispatchSyncedGpsQuestion({
                    questionKey: `tentacle_${tMeta.id}`,
                    category: 'TENTACLES',
                    title: `TENTACLES (${tMeta.shortTitle})`,
                    questionText: qText,
                    cardReward: 'Træk 4 kort, behold 2',
                    headline,
                    answerText,
                    isPositive: true,
                    zoneObject: {
                        type: 'voronoi_cell',
                        points: candidates.map(p => ({ lat: p.lat, lng: p.lng, name: p.name })),
                        refPoints: candidates,
                        targetIdx: winningPOI.index,
                        invert: true,
                        label: `Tentacles: Tættest på ${winningPOI.name}`
                    }
                });
            };

            // 6. SEND PHOTO / MANUAL QUESTION TO HIDER'S SCREEN (20 MINUTTERS TIDSFRIST!)
            const handleSendManualOrPhotoQuestion = async (preset) => {
                if (!user) return;
                const qText = preset ? preset.text : customQuestionText.trim();
                const qTitle = preset ? preset.title : '❓ Manuelt Spørgsmål';
                if (!qText) return;

                JetLagAudio.playQuestionSent();
                const isTextMatch = preset?.type === 'text';
                const waitSecs = isTextMatch ? 5 * 60 : 20 * 60; // 20 minutter til billeder, 5 minutter til tekst-spørgsmål!
                const now = Date.now();

                const qObj = {
                    id: `q_${now}_${Math.random().toString(36).slice(2, 5)}`,
                    questionKey: preset?.id || `custom_${now}`,
                    roomCode,
                    questionType: isTextMatch ? 'manual' : 'photo',
                    category: isTextMatch ? 'MATCHING (5 MIN)' : 'PHOTO (20 MIN • TRÆK 1 KORT)',
                    title: qTitle,
                    questionText: qText,
                    cardReward: isTextMatch ? 'Træk 3 kort, behold 1' : 'Træk 1 kort',
                    answerText: null,
                    photoBase64: null,
                    status: 'pending',
                    autoAnswered: false,
                    askedBy: playerName,
                    createdAtMillis: now,
                    durationSecs: waitSecs,
                    deadlineMillis: now + waitSecs * 1000
                };

                await upsertQuestionRecord(qObj);
                await sendChatMessage(`📸 ${isTextMatch ? 'SPØRGSMÅL' : 'FOTO-SPØRGSMÅL'} SENDT TIL GEMMERE: ${qTitle} — "${qText}" (Tidsfrist: ${isTextMatch ? '05:00' : '20:00'} min | Gemmer: ${qObj.cardReward})`);
                setCustomQuestionText("");
                setActiveTool(null);
                notify(`📸 Sendt til Gemmerne! De har nu ${isTextMatch ? '5' : '20'} minutter til at svare.`);
            };

            // HIDER SUBMITS ANSWER / PHOTO TO PENDING QUESTION
            const handleHiderSubmitAnswer = async (questionObj) => {
                if (!user || !questionObj) return;
                const finalAnswer = hiderAnswerText.trim() || (hiderPhotoData ? "📸 Billede sendt!" : "Besvaret af Gemmer");
                const updated = {
                    ...questionObj,
                    answerText: finalAnswer,
                    photoBase64: hiderPhotoData || null,
                    status: 'answered',
                    answeredBy: playerName,
                    answeredAtMillis: Date.now()
                };

                await upsertQuestionRecord(updated);
                await sendChatMessage(`✅ SVAR FRA GEMMER (${playerName}) på "${questionObj.title}": ${finalAnswer}`);
                setAnsweringQuestionId(null);
                setHiderAnswerText("");
                setHiderPhotoData(null);
                notify("Dit svar/billede er sendt til Finderne!");
            };

            const handlePhotoFileChange = async (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                setIsUploadingPhoto(true);
                try {
                    const compressed = await compressImageToBase64(file);
                    setHiderPhotoData(compressed);
                } catch (err) {
                    console.error("Image compression error:", err);
                } finally {
                    setIsUploadingPhoto(false);
                }
            };

            const handleDeleteObject = async (id) => {
                if (!user) return;
                if (!isCloudActive || !db) {
                    setMapObjects(prev => prev.filter(o => o.id !== id));
                    if (localChannel) localChannel.postMessage({ roomCode, kind: 'deleteObject', id });
                    notify("Rød zone fjernet fra kortet.");
                    return;
                }
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mapObjects', id));
                    notify("Rød zone fjernet fra kortet.");
                } catch (e) {
                    console.error(e);
                }
            };

            const handleClearAllZones = async () => {
                if (!user) return;
                if (!isCloudActive || !db) {
                    setMapObjects([]);
                    if (localChannel) localChannel.postMessage({ roomCode, kind: 'clearObjects' });
                    notify("Alle røde zoner i rummet er ryddet!");
                    return;
                }
                try {
                    for (const obj of mapObjects) {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mapObjects', obj.id));
                    }
                    notify("Alle røde zoner i rummet er ryddet!");
                } catch (e) {
                    console.error(e);
                }
            };

            // NEW ROUND: Swap Hider & Seeker Teams automatically + Reset 45m Timer + Clear Zones!
            const handleNextRoundSwapTeams = async () => {
                if (!user) return;
                const nextRound = (roomState.roundNumber || 1) + 1;
                const nextHidingTeam = roomState.hidingTeam === 'teamA' ? 'teamB' : 'teamA';
                const randomStationIdx = Math.floor(Math.random() * BUILTIN_GEO_DATA.station.length);
                const updatedRoom = {
                    roomCode,
                    roundNumber: nextRound,
                    hidingTeam: nextHidingTeam,
                    phase: 'hiding',
                    timerEndMillis: Date.now() + 45 * 60 * 1000,
                    isRunning: true,
                    botHiderStationIdx: randomStationIdx,
                    updatedBy: playerName
                };

                setRoomState(updatedRoom);
                setHiderLockedSpot(null);
                if (localChannel) {
                    localChannel.postMessage({ roomCode, kind: 'roomState', payload: updatedRoom });
                    localChannel.postMessage({ roomCode, kind: 'clearObjects' });
                    localChannel.postMessage({ roomCode, kind: 'clearQuestions' });
                }

                if (isCloudActive && db) {
                    try {
                        const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                        await setDoc(roomDocRef, updatedRoom);
                        for (const obj of mapObjects) {
                            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mapObjects', obj.id));
                        }
                        for (const q of questionsLog) {
                            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'questions', q.id));
                        }
                    } catch (e) {
                        console.error(e);
                    }
                } else {
                    setMapObjects([]);
                    setQuestionsLog([]);
                }

                const newHiderName = nextHidingTeam === 'teamA' ? 'Hold 1 (Alpha)' : 'Hold 2 (Bravo)';
                notify(`🔄 RUNDE ${nextRound}: Holdene har byttet! ${newHiderName} er nu GEMMERE!`);
            };

            // START COMPLETELY NEW GAME: Reset to Round 1, Clear Zones, Questions & Restart 45m Timer
            const handleStartNewGame = async () => {
                if (!user) return;
                if (telemetryTimerRef.current) {
                    clearInterval(telemetryTimerRef.current);
                    telemetryTimerRef.current = null;
                }
                setPendingTelemetry(null);
                setRevealOverlay(null);
                setHiderLockedSpot(null);
                setActiveTool(null);

                const randomStationIdx = Math.floor(Math.random() * BUILTIN_GEO_DATA.station.length);
                const freshRoom = {
                    roomCode,
                    roundNumber: 1,
                    hidingTeam: 'teamA',
                    phase: 'hiding',
                    timerEndMillis: Date.now() + 45 * 60 * 1000,
                    isRunning: true,
                    botHiderStationIdx: randomStationIdx,
                    updatedBy: playerName,
                    lastActiveMillis: Date.now()
                };

                setRoomState(freshRoom);
                setMapObjects([]);
                setQuestionsLog([]);

                try {
                    localStorage.setItem(`jl_room_${roomCode}`, JSON.stringify(freshRoom));
                    sessionStorage.setItem(`jl_room_${roomCode}`, JSON.stringify(freshRoom));
                    localStorage.removeItem(`jl_objects_${roomCode}`);
                    sessionStorage.removeItem(`jl_objects_${roomCode}`);
                    localStorage.removeItem(`jl_questions_${roomCode}`);
                    sessionStorage.removeItem(`jl_questions_${roomCode}`);
                } catch (e) {}

                if (localChannel) {
                    localChannel.postMessage({ roomCode, kind: 'roomState', payload: freshRoom });
                    localChannel.postMessage({ roomCode, kind: 'clearObjects' });
                    localChannel.postMessage({ roomCode, kind: 'clearQuestions' });
                }

                if (isCloudActive && db) {
                    try {
                        const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                        await setDoc(roomDocRef, freshRoom);
                        for (const obj of mapObjects) {
                            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mapObjects', obj.id));
                        }
                        for (const q of questionsLog) {
                            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'questions', q.id));
                        }
                    } catch (e) {
                        console.error("New game reset error:", e);
                    }
                }

                JetLagAudio.playIntroStinger();
                await sendChatMessage(`🆕 NYT SPIL STARTET AF ${playerName.toUpperCase()}! Runde 1 er begyndt, alle zoner er ryddet, og 45-minutters uret tæller ned!`);
                notify("🆕 Nyt spil startet! Alt er nulstillet til Runde 1.");
            };

            const handleSaveRadius = async () => {
                if (!user) return;
                const km = parseFloat(radiusKm) || 10;
                const label = radiusInvert
                    ? `Inden for ${km} km (Udenfor = Rød)`
                    : `Ikke inden for ${km} km (Cirkel = Rød)`;

                await saveMapObject({
                    type: 'radius',
                    lat: radiusCenter.lat,
                    lng: radiusCenter.lng,
                    radiusKm: km,
                    invert: radiusInvert,
                    label
                });
                setActiveTool(null);
                notify(`Manuel Radius (${km} km) plottet på kortet!`);
            };

            const handleSavePolygon = async () => {
                if (!user || polyPoints.length < 3) return;
                await saveMapObject({
                    type: 'polygon',
                    coords: polyPoints,
                    invert: polyInvert,
                    label: polyInvert ? 'Omvendt Polygon-Zone' : 'Tegnet Rød Zone'
                });
                setPolyPoints([]);
                setActiveTool(null);
                notify("Rød zone gemt på kortet!");
            };

            const handleSaveThermometer = async () => {
                if (!user || !thermoA || !thermoB) return;
                await saveMapObject({
                    type: 'thermometer',
                    pointA: thermoA,
                    pointB: thermoB,
                    warmer: thermoWarmer,
                    label: `Manuelt Termometer (${thermoWarmer ? 'Varmere mod B' : 'Koldere mod A'})`
                });
                setThermoA(null);
                setThermoB(null);
                setActiveTool(null);
                notify("Termometer-halvdel farvet rød!");
            };

            const handleStart45MinTimer = async () => {
                if (!user) return;
                const updated = {
                    ...roomState,
                    phase: 'hiding',
                    timerEndMillis: Date.now() + 45 * 60 * 1000,
                    isRunning: true,
                    updatedBy: playerName
                };
                setRoomState(updated);
                if (localChannel) localChannel.postMessage({ roomCode, kind: 'roomState', payload: updated });
                if (isCloudActive && db) {
                    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                    await setDoc(roomDocRef, updated);
                }
                notify("45 minutters Gemme-tid er startet!");
            };

            const handleTogglePhase = async () => {
                if (!user) return;
                const nextPhase = roomState.phase === 'hiding' ? 'seeking' : 'hiding';
                const updated = {
                    ...roomState,
                    phase: nextPhase,
                    timerEndMillis: nextPhase === 'hiding' ? Date.now() + 45 * 60 * 1000 : null,
                    isRunning: nextPhase === 'hiding',
                    updatedBy: playerName
                };
                setRoomState(updated);
                if (localChannel) localChannel.postMessage({ roomCode, kind: 'roomState', payload: updated });
                if (isCloudActive && db) {
                    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                    await setDoc(roomDocRef, updated);
                }
            };

            const sendChatMessage = async (textToSend) => {
                const msg = (textToSend ?? chatInput).trim();
                if (!msg || !user) return;
                const payload = {
                    id: `msg_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`,
                    roomCode,
                    senderUid: user.uid,
                    sender: playerName,
                    team: myTeam,
                    role: myRole,
                    text: msg,
                    createdAtMillis: Date.now()
                };
                if (!textToSend) setChatInput("");

                if (!isCloudActive || !db) {
                    setChatMessages(prev => [...prev, payload]);
                    if (localChannel) localChannel.postMessage({ roomCode, kind: 'chat', payload });
                    return;
                }

                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'chat'), payload);
                } catch (e) {
                    console.error(e);
                }
            };

            const teamAPlayers = players.filter(p => p.team === 'teamA');
            const teamBPlayers = players.filter(p => p.team === 'teamB');

            // Compute live preview info for Seeker's Official Measuring & Matching tabs
            const myNearestMatchPOI = useMemo(() => {
                const list = BUILTIN_GEO_DATA[qMatchCategory] || BUILTIN_GEO_DATA.lufthavn;
                return getNearestPOI(myCoords.lat, myCoords.lng, list);
            }, [myCoords, qMatchCategory, osmRevision]);

            const myMeasurePreviewKm = useMemo(() => {
                const nearest = BUILTIN_LINE_DATA[qMeasureTarget]
                    ? getNearestPOI(myCoords.lat, myCoords.lng, qMeasureTarget)
                    : getNearestPOI(myCoords.lat, myCoords.lng, BUILTIN_GEO_DATA[qMeasureTarget] || BUILTIN_GEO_DATA.lufthavn);
                return nearest ? `${nearest.name} (${nearest.distanceKm.toFixed(2)} km)` : '0 km';
            }, [myCoords, qMeasureTarget, osmRevision]);

            // Hvilken kategori skal vises dynamisk på kortet lige nu?
            // Enten den kategori spilleren har valgt i Kort-Atlasset, ELLER den kategori Finderen kigger på i Spørgsmåls-menuen!
            const effectiveDynamicCategory = useMemo(() => {
                if (activeAtlasCategory) return activeAtlasCategory;
                if (activeTool === 'questions') {
                    if (questionTab === 'matching') {
                        const m = OFFICIAL_MATCHING_QUESTIONS.find(q => q.id === qMatchCategory);
                        if (m && (BUILTIN_GEO_DATA[m.id] || BUILTIN_LINE_DATA[m.id])) return m.id;
                        if (m && m.mode === 'station_length') return 'station';
                    }
                    if (questionTab === 'measuring') {
                        if (BUILTIN_GEO_DATA[qMeasureTarget] || BUILTIN_LINE_DATA[qMeasureTarget]) return qMeasureTarget;
                    }
                    if (questionTab === 'tentacles') {
                        const t = OFFICIAL_TENTACLE_QUESTIONS.find(x => x.id === qTentacleId);
                        if (t && BUILTIN_GEO_DATA[t.cat]) return t.cat;
                    }
                }
                return null;
            }, [activeAtlasCategory, activeTool, questionTab, qMatchCategory, qMeasureTarget, qTentacleId]);

            const dynamicCategoryMeta = useMemo(() => {
                if (!effectiveDynamicCategory) return null;
                return ATLAS_CATEGORIES.find(c => c.id === effectiveDynamicCategory) || {
                    id: effectiveDynamicCategory,
                    icon: '📍',
                    label: effectiveDynamicCategory.toUpperCase()
                };
            }, [effectiveDynamicCategory]);

            const nearestDynamicPOI = useMemo(() => {
                if (!effectiveDynamicCategory) return null;
                if (BUILTIN_LINE_DATA[effectiveDynamicCategory]) {
                    return getNearestPOI(myCoords.lat, myCoords.lng, effectiveDynamicCategory);
                }
                if (!BUILTIN_GEO_DATA[effectiveDynamicCategory]) return null;
                return getNearestPOI(myCoords.lat, myCoords.lng, BUILTIN_GEO_DATA[effectiveDynamicCategory]);
            }, [effectiveDynamicCategory, myCoords, osmRevision]);

            // Nærmeste station til spilleren (opdaterer live når man bevæger sig på kortet)
            const hiderNearestStation = useMemo(() => {
                const spot = (myRole === 'hider' && hiderLockedSpot) ? hiderLockedSpot : myCoords;
                return getNearestPOI(spot.lat, spot.lng, BUILTIN_GEO_DATA.station);
            }, [myRole, myCoords, hiderLockedSpot, osmRevision]);

            // Dynamisk optegning af valgt kort-kategori (Sammenhængende Kystlinjer/Grænser/Højhastighedsbaner, Lokalbaner, Voronoi-zoner m.m.)
            useEffect(() => {
                if (!mapInstanceRef.current || !layersRef.current.atlas) return;
                layersRef.current.atlas.clearLayers();

                if (!effectiveDynamicCategory) return;
                const catMeta = dynamicCategoryMeta || { icon: '📍', label: effectiveDynamicCategory };

                // Håndtér sammenhængende linje-kategorier (Kystlinje, Landegrænse, Regionsgrænse, Landsdelsgrænse, Højhastighedsbane)
                if (BUILTIN_LINE_DATA[effectiveDynamicCategory]) {
                    const lineData = BUILTIN_LINE_DATA[effectiveDynamicCategory];
                    const nearestOnLine = getNearestPOI(myCoords.lat, myCoords.lng, effectiveDynamicCategory);

                    // Tegn hele den sammenhængende kystlinje / grænse / højhastighedsbane på kortet
                    lineData.segments.forEach(seg => {
                        const latLngs = seg.coords.map(c => [c[1], c[0]]);
                        L.polyline(latLngs, {
                            color: lineData.color || '#0ea5e9',
                            weight: 5,
                            opacity: 0.9,
                            interactive: false
                        }).addTo(layersRef.current.atlas);
                    });

                    // Hvis Zoner/Buffer-forhåndsvisning er slået til, vis det sammenhængende afstandsbælte omkring hele linjen!
                    if (showAtlasVoronoi && nearestOnLine) {
                        const previewBuffer = buildExclusionGeoJSON({
                            type: 'line_buffer',
                            lines: lineData.segments.map(s => s.coords),
                            radiusKm: Math.max(0.2, nearestOnLine.distanceKm),
                            invert: false
                        });
                        if (previewBuffer) {
                            L.geoJSON(previewBuffer, {
                                interactive: false,
                                style: {
                                    color: lineData.color || '#0ea5e9',
                                    weight: 2,
                                    dashArray: '6, 6',
                                    fillColor: lineData.color || '#0ea5e9',
                                    fillOpacity: 0.14
                                }
                            }).addTo(layersRef.current.atlas);
                        }
                    }

                    // Tegn vinkelret måle-vektor fra spilleren til det nærmeste punkt på den sammenhængende linje
                    if (nearestOnLine) {
                        L.polyline([[myCoords.lat, myCoords.lng], [nearestOnLine.lat, nearestOnLine.lng]], {
                            color: '#2EB85C',
                            weight: 3.5,
                            dashArray: '6, 6',
                            interactive: false
                        }).addTo(layersRef.current.atlas);

                        const dText = nearestOnLine.distanceKm < 1
                            ? `${Math.round(nearestOnLine.distanceKm * 1000)}m`
                            : `${nearestOnLine.distanceKm.toFixed(2)}km`;

                        const snapIcon = L.divIcon({
                            className: '',
                            html: `
                                <div class="jl-atlas-pin nearest-highlight">
                                    <span>${catMeta.icon}</span>
                                    <span>Nærmeste punkt (${dText})</span>
                                </div>
                            `,
                            iconSize: [0, 0]
                        });
                        L.marker([nearestOnLine.lat, nearestOnLine.lng], {
                            icon: snapIcon,
                            zIndexOffset: 900
                        }).addTo(layersRef.current.atlas);
                    }
                    return;
                }

                const list = BUILTIN_GEO_DATA[effectiveDynamicCategory];
                if (!list || list.length === 0) return;

                const nearest = getNearestPOI(myCoords.lat, myCoords.lng, list);

                // 1. Hvis kategorien er Jernbaner/Stationer, Lokalbaner eller Metro -> Tegn linjenetværket!
                if (catMeta.showRail) {
                    TRANSIT_NETWORK_LINES.forEach(line => {
                        if (effectiveDynamicCategory === 'lokalbane' && !line.isLokalbane) return;
                        L.polyline(line.coords, {
                            color: line.color,
                            weight: line.isLokalbane ? 3.5 : 4,
                            opacity: 0.88,
                            dashArray: line.name.includes('Metro') ? '4, 6' : line.isLokalbane ? '8, 4' : null,
                            interactive: false
                        }).addTo(layersRef.current.atlas);
                    });
                }

                // 2. Hvis Voronoi-skæringslinjer er slået til -> Tegn den aktive Voronoi-celle omkring spillerens nærmeste punkt
                // samt skæringslinjerne mellem alle punkterne i kategorien!
                if (showAtlasVoronoi && list.length >= 2 && list.length <= 35) {
                    list.forEach((pt, idx) => {
                        const isMyCell = nearest && nearest.index === idx;
                        const cellGeo = buildExclusionGeoJSON({
                            type: 'voronoi_cell',
                            points: list,
                            targetIdx: idx,
                            invert: false
                        });
                        if (cellGeo) {
                            L.geoJSON(cellGeo, {
                                interactive: false,
                                style: {
                                    color: isMyCell ? '#2EB85C' : '#F3B229',
                                    weight: isMyCell ? 3 : 1.5,
                                    dashArray: isMyCell ? null : '5, 5',
                                    fillColor: isMyCell ? '#2EB85C' : '#F3B229',
                                    fillOpacity: isMyCell ? 0.14 : 0.03
                                }
                            }).addTo(layersRef.current.atlas);
                        }
                    });
                }

                // 3. Hvis Finderen er på Tentacles-fanen -> Tegn rækkevidden (1 Mile eller 15 Miles) omkring Finderen
                if (activeTool === 'questions' && questionTab === 'tentacles') {
                    const tMeta = OFFICIAL_TENTACLE_QUESTIONS.find(x => x.id === qTentacleId);
                    if (tMeta) {
                        const reachCircle = turf.circle([myCoords.lng, myCoords.lat], tMeta.radiusKm, { steps: 64, units: 'kilometers' });
                        L.geoJSON(reachCircle, {
                            interactive: false,
                            style: {
                                color: '#a855f7',
                                weight: 3,
                                dashArray: '6, 6',
                                fillColor: '#a855f7',
                                fillOpacity: 0.1
                            }
                        }).addTo(layersRef.current.atlas);
                    }
                }

                // 4. Tegn direkte stiplet vektor-linje fra spilleren til nærmeste punkt i kategorien
                if (nearest) {
                    L.polyline([[myCoords.lat, myCoords.lng], [nearest.lat, nearest.lng]], {
                        color: '#2EB85C',
                        weight: 3.5,
                        dashArray: '6, 6',
                        interactive: false
                    }).addTo(layersRef.current.atlas);
                }

                // 5. Tegn punkterne i kategorien (Ved mange stationer vises de 35 nærmeste dynamisk ud fra spillerens position!)
                const myPt = turf.point([myCoords.lng, myCoords.lat]);
                const enrichedList = list.map((item, idx) => ({
                    ...item,
                    idx,
                    dKm: turf.distance(myPt, turf.point([item.lng, item.lat]), { units: 'kilometers' })
                }));

                const visibleItems = enrichedList.length > 40
                    ? [...enrichedList].sort((a, b) => a.dKm - b.dKm).slice(0, 35)
                    : enrichedList;

                visibleItems.forEach((item) => {
                    const dText = item.dKm < 1 ? `${Math.round(item.dKm * 1000)}m` : `${item.dKm.toFixed(1)}km`;
                    const isNearest = nearest && nearest.index === item.idx;

                    const pinIcon = L.divIcon({
                        className: '',
                        html: `
                            <div class="jl-atlas-pin ${isNearest ? 'nearest-highlight' : ''}">
                                <span>${catMeta.icon}</span>
                                <span>${item.name}</span>
                                <span style="opacity:0.8; font-size:10px; padding-left:3px;">(${dText})</span>
                            </div>
                        `,
                        iconSize: [0, 0]
                    });

                    L.marker([item.lat, item.lng], {
                        icon: pinIcon,
                        zIndexOffset: isNearest ? 850 : 400
                    }).addTo(layersRef.current.atlas);
                });
            }, [effectiveDynamicCategory, dynamicCategoryMeta, myCoords, showAtlasVoronoi, activeTool, questionTab, qTentacleId, osmRevision]);

            return (
                <div className={`relative w-full h-full overflow-hidden select-none ${mapTheme}`}>
                    {/* Full-Screen Leaflet Map */}
                    <div id="map-container" />

                    {/* Center Crosshair when placing Radius or Polygon points */}
                    {(activeTool === 'radius' || activeTool === 'polygon' || activeTool === 'thermometer' || (activeTool === 'questions' && questionTab === 'thermometer')) && (
                        <div className="map-crosshair flex flex-col items-center">
                            <div className="w-8 h-8 rounded-full border-2 border-jl-navy bg-jl-yellow/40 flex items-center justify-center shadow">
                                <div className="w-2 h-2 rounded-full bg-jl-red" />
                            </div>
                        </div>
                    )}

                    {/* TOP BROADCAST BAR (Ultra-Clean Single-Row Mobile HUD + Burger Menu) */}
                    <div className="absolute top-0 left-0 right-0 z-[500] px-2 pt-1.5 sm:p-3 safe-top pointer-events-none">
                        <div className="pointer-events-auto flex items-center justify-between gap-1.5 bg-jl-navy/95 border-2 border-jl-cream rounded-2xl px-2.5 py-1.5 shadow-2xl backdrop-blur-md">
                            {/* Left: Room Code + Role Badge */}
                            <div className="flex items-center gap-1.5 min-w-0">
                                <button
                                    onClick={() => {
                                        JetLagAudio.playUiClick();
                                        setBurgerMenuOpen(false);
                                        setActiveTool(activeTool === 'room' ? null : 'room');
                                    }}
                                    className="bg-jl-dark border border-jl-yellow/50 px-2 py-1 rounded-xl text-left hover:border-jl-yellow transition-colors shrink-0 active:scale-95"
                                    title="Åbn Rum & Hold-oversigt"
                                >
                                    <div className="text-[8px] sm:text-[9px] font-display font-bold uppercase text-jl-cream/60 leading-none">
                                        R{roomState.roundNumber || 1} • KODE
                                    </div>
                                    <div className="font-display font-black text-sm sm:text-lg text-jl-yellow tracking-wider leading-tight">
                                        🔑 {roomCode}
                                    </div>
                                </button>

                                <div className={`px-2 py-0.5 sm:py-1 rounded font-display font-black text-[11px] sm:text-sm uppercase tracking-wider -rotate-2 border shrink-0 ${
                                    myRole === 'hider'
                                        ? 'bg-jl-green text-white border-white'
                                        : 'bg-jl-yellow text-jl-navy border-jl-navy'
                                }`}>
                                    {myRole === 'hider' ? '🏃 GEMMER' : '🔍 FINDER'}
                                </div>

                                <div className="hidden md:block pl-1.5 truncate">
                                    <div className="font-display font-black text-sm text-jl-cream leading-none uppercase truncate">
                                        {playerName} ({myTeam === 'teamA' ? 'Hold 1' : 'Hold 2'})
                                    </div>
                                    <div className="text-[10px] font-bold text-jl-cream/70 truncate">
                                        {myRole === 'hider'
                                            ? `Overvåger ${chasersWithDistance.length} finder(e) live`
                                            : activeHiderTarget.isBot
                                            ? '🤖 Auto-Svar (Bot-Gemmer)'
                                            : `📡 Forbundet til ${activeHiderTarget.name}`}
                                    </div>
                                </div>
                            </div>

                            {/* Center/Right: 45-Min Timer + Burger Menu Button */}
                            <div className="flex items-center gap-2 shrink-0">
                                <div
                                    onClick={handleTogglePhase}
                                    className="flex flex-col items-end cursor-pointer bg-jl-dark/80 hover:bg-jl-dark px-2.5 py-1 rounded-xl border border-jl-cream/15 active:scale-95"
                                    title="Tryk for at skifte mellem 45m Gemme-tid og Jagt"
                                >
                                    <span className="text-[8px] sm:text-[9px] font-display font-black uppercase tracking-widest text-jl-yellow leading-none">
                                        {roomState.phase === 'hiding' ? '⏱ GEMME-TID' : '🚨 JAGT AKTIV'}
                                    </span>
                                    <span className="font-display font-black text-lg sm:text-2xl text-jl-cream leading-none tracking-wider">
                                        {roomState.phase === 'hiding' ? clockDisplay : 'JAGT'}
                                    </span>
                                </div>

                                {/* Burger Menu Toggle Button */}
                                <button
                                    onClick={() => {
                                        JetLagAudio.playUiClick(760);
                                        setBurgerMenuOpen(prev => !prev);
                                    }}
                                    className={`w-10 h-10 sm:w-11 sm:h-11 rounded-xl border-2 flex flex-col items-center justify-center gap-1 transition-all active:scale-95 relative ${
                                        burgerMenuOpen
                                            ? 'bg-jl-yellow text-jl-navy border-white'
                                            : 'bg-jl-dark text-jl-cream border-jl-cream/35 hover:border-jl-yellow'
                                    }`}
                                    title="Åbn Menu & Indstillinger"
                                >
                                    <span className="font-display font-black text-xl leading-none">
                                        {burgerMenuOpen ? '✕' : '☰'}
                                    </span>
                                    {manualGpsMode && (
                                        <span className="absolute -top-1 -right-1 w-3 h-3 rounded-full bg-jl-red border border-white animate-ping" />
                                    )}
                                </button>
                            </div>
                        </div>

                        {/* BURGER MENU DROPDOWN PANEL (Samler alle sekundære knapper og indstillinger pænt til mobil) */}
                        {burgerMenuOpen && (
                            <div className="jl-anim-dropdown pointer-events-auto mt-2 ml-auto w-full sm:w-80 bg-jl-navy/98 border-3 border-jl-cream rounded-3xl p-4 shadow-2xl text-jl-cream backdrop-blur-md max-h-[80vh] overflow-y-auto no-scrollbar">
                                <div className="flex items-center justify-between pb-2.5 mb-3 border-b border-jl-cream/15">
                                    <div>
                                        <div className="font-display font-black text-lg uppercase text-jl-yellow leading-none">
                                            ⚙️ KONTROLPANEL & MENU
                                        </div>
                                        <div className="text-[11px] text-jl-cream/70 mt-0.5">
                                            Spiller: <b>{playerName}</b> ({myTeam === 'teamA' ? 'Hold 1' : 'Hold 2'})
