                const qMeta = OFFICIAL_MEASURING_QUESTIONS.find(q => q.id === qMeasureTarget) || OFFICIAL_MEASURING_QUESTIONS[0];
                const list = BUILTIN_GEO_DATA[qMeta.id] || BUILTIN_GEO_DATA.lufthavn;
                const seekerNearest = getNearestPOI(myCoords.lat, myCoords.lng, list);
                if (!seekerNearest) return;
                const seekerDist = Math.max(0.25, parseFloat(seekerNearest.distanceKm.toFixed(2)));
                const qText = `📏 Measuring: "Sammenlignet med mig (${seekerDist} km), er du så tættere på eller længere fra ${qMeta.label}?"`;

                runWithBroadcastSuspense({
                    category: 'MEASURING',
                    title: `MEASURING: ${qMeta.label}`,
                    questionText: qText,
                    cardReward: 'Træk 3 kort, behold 1',
                    onComplete: async () => {
                        const hiderNearest = getNearestPOI(activeHiderTarget.lat, activeHiderTarget.lng, list);
                        const hiderCloser = hiderNearest.distanceKm <= seekerNearest.distanceKm;

                        const headline = hiderCloser ? `🌊 TÆTTERE PÅ! (CLOSER)` : `🏔️ LÆNGERE VÆK! (FURTHER)`;
                        const answerText = hiderCloser
                            ? `🌊 TÆTTERE PÅ! Gemmeren er TÆTTERE på ${qMeta.label} end jer (< ${seekerDist} km). Alt længere væk end ${seekerDist} km er nu farvet rødt!`
                            : `🏔️ LÆNGERE VÆK! Gemmeren er LÆNGERE fra ${qMeta.label} end jer (> ${seekerDist} km). Cirklerne på ${seekerDist} km er nu farvet røde!`;

                        await saveMapObject({
                            type: 'compound_radius',
                            category: qMeta.id,
                            points: list.map(p => ({ lat: p.lat, lng: p.lng })),
                            refPoints: list.length <= 12 ? list : [seekerNearest],
                            radiusKm: seekerDist,
                            invert: hiderCloser,
                            label: `Measuring (${qMeta.label}, ${seekerDist} km): ${hiderCloser ? 'Tættere på' : 'Længere væk'}`
                        });

                        await upsertQuestionRecord({
                            id: `q_${Date.now()}`,
                            questionKey: `measure_${qMeta.id}`,
                            roomCode,
                            category: 'MEASURING',
                            questionText: qText,
                            answerText,
                            status: 'answered',
                            autoAnswered: true,
                            askedBy: playerName,
                            createdAtMillis: Date.now()
                        });
                        await sendChatMessage(`🚨 SVAR PÅ MEASURING: ${answerText}`);
                        triggerBroadcastReveal({
                            category: 'MEASURING SVAR',
                            headline,
                            subtext: answerText,
                            isPositive: hiderCloser,
                            cardReward: 'Gemmer trækker 3 kort, beholder 1'
                        });
                    }
                });
            };

            // 4. OFFICIAL MATCHING QUESTION ("Is your nearest ___ the same as my ___?") — Cost: Draw 3, Keep 1
            const handleAskAutoMatching = () => {
                if (!user || pendingTelemetry) return;
                const qMeta = OFFICIAL_MATCHING_QUESTIONS.find(q => q.id === qMatchCategory) || OFFICIAL_MATCHING_QUESTIONS[0];

                // Hvis spørgsmålet er "Street or Path" sendes det til Gemmerens indbakke
                if (qMeta.mode === 'manual') {
                    handleSendManualOrPhotoQuestion({
                        id: qMeta.id,
                        type: 'text',
                        title: `🧩 Matching: ${qMeta.label}`,
                        text: `Er din gade/sti den samme som vores nuværende gade? (Svar JA eller NEJ — Træk 3 kort, behold 1)`
                    });
                    return;
                }

                // Special officiel Matching: Station's Name Length (antal tegn i nærmeste stations navn!)
                if (qMeta.mode === 'station_length') {
                    const stList = BUILTIN_GEO_DATA.station;
                    const seekerSt = getNearestPOI(myCoords.lat, myCoords.lng, stList);
                    const seekerLen = seekerSt.name.length;
                    const qText = `🧩 Matching: "Har din nærmeste togstation samme navnelængde som vores (${seekerSt.name} = ${seekerLen} tegn)?"`;

                    runWithBroadcastSuspense({
                        category: 'MATCHING',
                        title: `STATIONSNAVN LÆNGDE (${seekerLen} TEGN)`,
                        questionText: qText,
                        cardReward: 'Træk 3 kort, behold 1',
                        onComplete: async () => {
                            const hiderSt = getNearestPOI(activeHiderTarget.lat, activeHiderTarget.lng, stList);
                            const isSameLen = hiderSt.name.length === seekerLen;
                            const headline = isSameLen ? `✅ JA! (${seekerLen} TEGN)` : `❌ NEJ! (IKKE ${seekerLen} TEGN)`;
                            const answerText = isSameLen
                                ? `✅ JA! Gemmerens nærmeste station har OGSÅ ${seekerLen} tegn i navnet!`
                                : `❌ NEJ! Gemmerens nærmeste station har IKKE ${seekerLen} tegn i navnet!`;

                            // Udeluk alle stationer der ikke passer (0.5 km cirkler omkring udelukkede stationer)
                            const excludedStations = stList.filter(s => isSameLen ? s.name.length !== seekerLen : s.name.length === seekerLen);
                            await saveMapObject({
                                type: 'compound_radius',
                                points: excludedStations.map(s => ({ lat: s.lat, lng: s.lng })),
                                radiusKm: 0.8,
                                invert: false,
                                label: `Stationsnavn (${seekerLen} tegn): ${isSameLen ? 'JA' : 'NEJ'}`
                            });

                            await upsertQuestionRecord({
                                id: `q_${Date.now()}`,
                                questionKey: `match_${qMeta.id}`,
                                roomCode,
                                category: 'MATCHING',
                                questionText: qText,
                                answerText,
                                status: 'answered',
                                autoAnswered: true,
                                askedBy: playerName,
                                createdAtMillis: Date.now()
                            });
                            await sendChatMessage(`🚨 SVAR PÅ MATCHING: ${answerText}`);
                            triggerBroadcastReveal({
                                category: 'MATCHING SVAR',
                                headline,
                                subtext: answerText,
                                isPositive: isSameLen,
                                cardReward: 'Gemmer trækker 3 kort, beholder 1'
                            });
                        }
                    });
                    return;
                }

                // Special officiel Matching: Transit Line
                if (qMeta.mode === 'line_match') {
                    const stList = BUILTIN_GEO_DATA.station;
                    const seekerSt = getNearestPOI(myCoords.lat, myCoords.lng, stList);
                    const qText = `🧩 Matching: "Stopper vores nuværende toglinje (${seekerSt.line} ved ${seekerSt.name}) på din station?"`;

                    runWithBroadcastSuspense({
                        category: 'MATCHING',
                        title: `TRANSIT LINE (${seekerSt.line})`,
                        questionText: qText,
                        cardReward: 'Træk 3 kort, behold 1',
                        onComplete: async () => {
                            const hiderSt = getNearestPOI(activeHiderTarget.lat, activeHiderTarget.lng, stList);
                            const seekerLines = seekerSt.line.split('/').map(s => s.trim());
                            const hiderLines = hiderSt.line.split('/').map(s => s.trim());
                            const isMatch = seekerLines.some(l => hiderLines.includes(l));
                            const headline = isMatch ? `✅ JA! SAMME TOGLINJE` : `❌ NEJ! ANDEN TOGLINJE`;
                            const answerText = isMatch
                                ? `✅ JA! Gemmerens station betjenes OGSÅ af ${seekerSt.line}!`
                                : `❌ NEJ! Gemmerens station betjenes IKKE af ${seekerSt.line}!`;

                            await upsertQuestionRecord({
                                id: `q_${Date.now()}`,
                                questionKey: `match_${qMeta.id}`,
                                roomCode,
                                category: 'MATCHING',
                                questionText: qText,
                                answerText,
                                status: 'answered',
                                autoAnswered: true,
                                askedBy: playerName,
                                createdAtMillis: Date.now()
                            });
                            await sendChatMessage(`🚨 SVAR PÅ MATCHING: ${answerText}`);
                            triggerBroadcastReveal({
                                category: 'MATCHING SVAR',
                                headline,
                                subtext: answerText,
                                isPositive: isMatch,
                                cardReward: 'Gemmer trækker 3 kort, beholder 1'
                            });
                        }
                    });
                    return;
                }

                // Special officiel Matching: Landmass (Sjælland vs. Amager)
                if (qMeta.mode === 'landmass') {
                    const amagerPoly = [
                        { lat: 55.695, lng: 12.565 },
                        { lat: 55.700, lng: 12.640 },
                        { lat: 55.550, lng: 12.690 },
                        { lat: 55.550, lng: 12.510 },
                        { lat: 55.645, lng: 12.540 }
                    ];
                    const ring = amagerPoly.map(p => [p.lng, p.lat]);
                    ring.push([amagerPoly[0].lng, amagerPoly[0].lat]);
                    const amagerTurf = turf.polygon([ring]);
                    const seekerOnAmager = turf.booleanPointInPolygon(turf.point([myCoords.lng, myCoords.lat]), amagerTurf);
                    const seekerLand = seekerOnAmager ? 'Amager' : 'Sjælland';
                    const qText = `🧩 Matching: "Er du på samme landmasse/ø som os (${seekerLand})?"`;

                    runWithBroadcastSuspense({
                        category: 'MATCHING',
                        title: `LANDMASS (${seekerLand})`,
                        questionText: qText,
                        cardReward: 'Træk 3 kort, behold 1',
                        onComplete: async () => {
                            const hiderOnAmager = turf.booleanPointInPolygon(turf.point([activeHiderTarget.lng, activeHiderTarget.lat]), amagerTurf);
                            const isSame = seekerOnAmager === hiderOnAmager;
                            const hiderStayAmager = (seekerOnAmager && isSame) || (!seekerOnAmager && !isSame);
                            const headline = isSame ? `✅ JA! PÅ ${seekerLand.toUpperCase()}` : `❌ NEJ! IKKE PÅ ${seekerLand.toUpperCase()}`;
                            const answerText = isSame
                                ? `✅ JA! Gemmeren er OGSÅ på ${seekerLand}!`
                                : `❌ NEJ! Gemmeren er IKKE på ${seekerLand}!`;

                            await saveMapObject({
                                type: 'polygon',
                                coords: amagerPoly,
                                invert: hiderStayAmager,
                                label: `Landmass (${seekerLand}): ${isSame ? 'JA' : 'NEJ'}`
                            });

                            await upsertQuestionRecord({
                                id: `q_${Date.now()}`,
                                questionKey: `match_${qMeta.id}`,
                                roomCode,
                                category: 'MATCHING',
                                questionText: qText,
                                answerText,
                                status: 'answered',
                                autoAnswered: true,
                                askedBy: playerName,
                                createdAtMillis: Date.now()
                            });
                            await sendChatMessage(`🚨 SVAR PÅ MATCHING: ${answerText}`);
                            triggerBroadcastReveal({
                                category: 'MATCHING SVAR',
                                headline,
                                subtext: answerText,
                                isPositive: isSame,
                                cardReward: 'Gemmer trækker 3 kort, beholder 1'
                            });
                        }
                    });
                    return;
                }

                // Standard Eksakt Kilometer-Voronoi Matching (Lufthavne, Kommuner, Bydele, Museer, Biografer, Hospitaler osv.)
                const list = BUILTIN_GEO_DATA[qMeta.id] || BUILTIN_GEO_DATA.lufthavn;
                const seekerNearest = getNearestPOI(myCoords.lat, myCoords.lng, list);
                if (!seekerNearest) return;
                const qText = `🧩 Matching: "Er din nærmeste ${qMeta.label} den samme som vores (${seekerNearest.name})?"`;

                runWithBroadcastSuspense({
                    category: 'MATCHING',
                    title: `MATCHING: ${seekerNearest.name}`,
                    questionText: qText,
                    cardReward: 'Træk 3 kort, behold 1',
                    onComplete: async () => {
                        const hiderNearest = getNearestPOI(activeHiderTarget.lat, activeHiderTarget.lng, list);
                        const isSame = seekerNearest.index === hiderNearest.index;

                        const headline = isSame ? `✅ JA! MATCH (${seekerNearest.name})` : `❌ NEJ! IKKE ${seekerNearest.name}`;
                        const answerText = isSame
                            ? `✅ JA (MATCH)! Gemmerens nærmeste ${qMeta.label} er OGSÅ ${seekerNearest.name}! (Alt uden for denne Voronoi-zone er nu farvet rødt)`
                            : `❌ NEJ (IKKE MATCH)! Gemmerens nærmeste ${qMeta.label} er IKKE ${seekerNearest.name}! (Voronoi-zonen for ${seekerNearest.name} er nu skåret væk og farvet rød)`;

                        await saveMapObject({
                            type: 'voronoi_cell',
                            points: list.map(p => ({ lat: p.lat, lng: p.lng, name: p.name })),
                            refPoints: list.length <= 15 ? list : [seekerNearest],
                            targetIdx: seekerNearest.index,
                            invert: isSame,
                            label: `Matching (${seekerNearest.name}): ${isSame ? 'JA' : 'NEJ'}`
                        });

                        await upsertQuestionRecord({
                            id: `q_${Date.now()}`,
                            questionKey: `match_${qMeta.id}`,
                            roomCode,
                            category: 'MATCHING',
                            questionText: qText,
                            answerText,
                            status: 'answered',
                            autoAnswered: true,
                            askedBy: playerName,
                            createdAtMillis: Date.now()
                        });
                        await sendChatMessage(`🚨 SVAR PÅ MATCHING: ${answerText}`);
                        triggerBroadcastReveal({
                            category: 'MATCHING SVAR',
                            headline,
                            subtext: answerText,
                            isPositive: isSame,
                            cardReward: 'Gemmer trækker 3 kort, beholder 1'
                        });
                    }
                });
            };

            // 5. OFFICIAL TENTACLES QUESTION ("Within X miles of me, which Y are you nearest to?") — Cost: Draw 4, Keep 2
            const handleAskAutoTentacles = () => {
                if (!user || pendingTelemetry) return;
                const tMeta = OFFICIAL_TENTACLE_QUESTIONS.find(t => t.id === qTentacleId) || OFFICIAL_TENTACLE_QUESTIONS[0];
                const km = tMeta.radiusKm;
                const kmLabel = `${km.toFixed(1)} km`;
                const list = BUILTIN_GEO_DATA[tMeta.cat] || BUILTIN_GEO_DATA.museum;
                const qText = `🐙 Tentacles: "${tMeta.label} — Hvilken ${tMeta.shortTitle} inden for ${kmLabel} af os er du tættest på?"`;

                runWithBroadcastSuspense({
                    category: 'TENTACLES',
                    title: `TENTACLES (${tMeta.shortTitle})`,
                    questionText: qText,
                    cardReward: 'Træk 4 kort, behold 2',
                    onComplete: async () => {
                        const seekerPt = turf.point([myCoords.lng, myCoords.lat]);
                        const hiderPt = turf.point([activeHiderTarget.lng, activeHiderTarget.lat]);
                        const distToHider = turf.distance(seekerPt, hiderPt, { units: 'kilometers' });

                        let candidates = list.filter(item =>
                            turf.distance(seekerPt, turf.point([item.lng, item.lat]), { units: 'kilometers' }) <= km
                        );
                        if (candidates.length < 2) candidates = list;

                        if (distToHider > km) {
                            const headline = `❌ UDEN FOR RÆKKEVIDDE (> ${kmLabel})`;
                            const answerText = `❌ UDEN FOR RÆKKEVIDDE! Gemmeren er slet ikke inden for ${kmLabel} af jer! (Cirklen på ${kmLabel} er nu farvet rød)`;
                            await saveMapObject({
                                type: 'radius',
                                lat: myCoords.lat,
                                lng: myCoords.lng,
                                radiusKm: km,
                                invert: false,
                                label: `Tentacles (${kmLabel}): Uden for rækkevidde`
                            });

                            await upsertQuestionRecord({
                                id: `q_${Date.now()}`,
                                questionKey: `tentacle_${tMeta.id}`,
                                roomCode,
                                category: 'TENTACLES',
                                questionText: qText,
                                answerText,
                                status: 'answered',
                                autoAnswered: true,
                                askedBy: playerName,
                                createdAtMillis: Date.now()
                            });
                            await sendChatMessage(`🚨 SVAR PÅ TENTACLES: ${answerText}`);
                            triggerBroadcastReveal({
                                category: 'TENTACLES SVAR',
                                headline,
                                subtext: answerText,
                                isPositive: false,
                                cardReward: 'Gemmer trækker 4 kort, beholder 2'
                            });
                            return;
                        }

                        const winningPOI = getNearestPOI(activeHiderTarget.lat, activeHiderTarget.lng, candidates);
                        const headline = `🐙 HIT: ${winningPOI.name.toUpperCase()}`;
                        const answerText = `🐙 TENTACLES HIT! Inden for ${kmLabel} er gemmeren tættest på ${winningPOI.name}! (Kun denne tentakel-zone er nu åben)`;

                        await saveMapObject({
                            type: 'voronoi_cell',
                            points: candidates.map(p => ({ lat: p.lat, lng: p.lng, name: p.name })),
                            refPoints: candidates,
                            targetIdx: winningPOI.index,
                            invert: true,
                            label: `Tentacles: Tættest på ${winningPOI.name}`
                        });

                        await upsertQuestionRecord({
                            id: `q_${Date.now()}`,
                            questionKey: `tentacle_${tMeta.id}`,
                            roomCode,
                            category: 'TENTACLES',
                            questionText: qText,
                            answerText,
                            status: 'answered',
                            autoAnswered: true,
                            askedBy: playerName,
                            createdAtMillis: Date.now()
                        });
                        await sendChatMessage(`🚨 SVAR PÅ TENTACLES: ${answerText}`);
                        triggerBroadcastReveal({
                            category: 'TENTACLES SVAR',
                            headline,
                            subtext: answerText,
                            isPositive: true,
                            cardReward: 'Gemmer trækker 4 kort, beholder 2'
                        });
                    }
                });
            };

            // 6. SEND PHOTO / MANUAL QUESTION TO HIDER'S SCREEN
            const handleSendManualOrPhotoQuestion = async (preset) => {
                if (!user) return;
                const qText = preset ? preset.text : customQuestionText.trim();
                const qTitle = preset ? preset.title : '❓ Manuelt Spørgsmål';
                if (!qText) return;

                JetLagAudio.playQuestionSent();

                const qObj = {
                    id: `q_${Date.now()}`,
                    questionKey: preset?.id || `custom_${Date.now()}`,
                    roomCode,
                    category: preset?.type === 'text' ? 'MATCHING' : 'PHOTO (TRÆK 1 KORT)',
                    title: qTitle,
                    questionText: qText,
                    answerText: null,
                    photoBase64: null,
                    status: 'pending',
                    autoAnswered: false,
                    askedBy: playerName,
                    createdAtMillis: Date.now()
                };

                await upsertQuestionRecord(qObj);
                await sendChatMessage(`📸 FOTO-SPØRGSMÅL SENDT TIL GEMMERE: ${qTitle} — "${qText}" (Svartid: 10-20 min | Gemmer trækker 1 kort)`);
                setCustomQuestionText("");
                setActiveTool(null);
                notify("Officielt Foto-spørgsmål sendt direkte til Gemmernes skærm!");
            };

            // HIDER SUBMITS ANSWER / PHOTO TO PENDING QUESTION
            const handleHiderSubmitAnswer = async (questionObj) => {
                if (!user || !questionObj) return;
                const finalAnswer = hiderAnswerText.trim() || (hiderPhotoData ? "📸 Billede sendt!" : "Besvaret af Gemmer");
                const updated = {
                    ...questionObj,
                    answerText: finalAnswer,
                    photoBase64: hiderPhotoData || null,
                    status: 'answered',
                    answeredBy: playerName,
                    answeredAtMillis: Date.now()
                };

                await upsertQuestionRecord(updated);
                await sendChatMessage(`✅ SVAR FRA GEMMER (${playerName}) på "${questionObj.title}": ${finalAnswer}`);
                setAnsweringQuestionId(null);
                setHiderAnswerText("");
                setHiderPhotoData(null);
                notify("Dit svar/billede er sendt til Finderne!");
            };

            const handlePhotoFileChange = async (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                setIsUploadingPhoto(true);
                try {
                    const compressed = await compressImageToBase64(file);
                    setHiderPhotoData(compressed);
                } catch (err) {
                    console.error("Image compression error:", err);
                } finally {
                    setIsUploadingPhoto(false);
                }
            };

            const handleDeleteObject = async (id) => {
                if (!user) return;
                if (!isCloudActive || !db) {
                    setMapObjects(prev => prev.filter(o => o.id !== id));
                    if (localChannel) localChannel.postMessage({ roomCode, kind: 'deleteObject', id });
                    notify("Rød zone fjernet fra kortet.");
                    return;
                }
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mapObjects', id));
                    notify("Rød zone fjernet fra kortet.");
                } catch (e) {
                    console.error(e);
                }
            };

            const handleClearAllZones = async () => {
                if (!user) return;
                if (!isCloudActive || !db) {
                    setMapObjects([]);
                    if (localChannel) localChannel.postMessage({ roomCode, kind: 'clearObjects' });
                    notify("Alle røde zoner i rummet er ryddet!");
                    return;
                }
                try {
                    for (const obj of mapObjects) {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mapObjects', obj.id));
                    }
                    notify("Alle røde zoner i rummet er ryddet!");
                } catch (e) {
                    console.error(e);
                }
            };

            // NEW ROUND: Swap Hider & Seeker Teams automatically + Reset 45m Timer + Clear Zones!
            const handleNextRoundSwapTeams = async () => {
                if (!user) return;
                const nextRound = (roomState.roundNumber || 1) + 1;
                const nextHidingTeam = roomState.hidingTeam === 'teamA' ? 'teamB' : 'teamA';
                const randomStationIdx = Math.floor(Math.random() * BUILTIN_GEO_DATA.station.length);
                const updatedRoom = {
                    roomCode,
                    roundNumber: nextRound,
                    hidingTeam: nextHidingTeam,
                    phase: 'hiding',
                    timerEndMillis: Date.now() + 45 * 60 * 1000,
                    isRunning: true,
                    botHiderStationIdx: randomStationIdx,
                    updatedBy: playerName
                };

                setRoomState(updatedRoom);
                setHiderLockedSpot(null);
                if (localChannel) {
                    localChannel.postMessage({ roomCode, kind: 'roomState', payload: updatedRoom });
                    localChannel.postMessage({ roomCode, kind: 'clearObjects' });
                    localChannel.postMessage({ roomCode, kind: 'clearQuestions' });
                }

                if (isCloudActive && db) {
                    try {
                        const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                        await setDoc(roomDocRef, updatedRoom);
                        for (const obj of mapObjects) {
                            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mapObjects', obj.id));
                        }
                        for (const q of questionsLog) {
                            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'questions', q.id));
                        }
                    } catch (e) {
                        console.error(e);
                    }
                } else {
                    setMapObjects([]);
                    setQuestionsLog([]);
                }

                const newHiderName = nextHidingTeam === 'teamA' ? 'Hold 1 (Alpha)' : 'Hold 2 (Bravo)';
                notify(`🔄 RUNDE ${nextRound}: Holdene har byttet! ${newHiderName} er nu GEMMERE!`);
            };

            const handleSaveRadius = async () => {
                if (!user) return;
                const km = parseFloat(radiusKm) || 10;
                const label = radiusInvert
                    ? `Inden for ${km} km (Udenfor = Rød)`
                    : `Ikke inden for ${km} km (Cirkel = Rød)`;

                await saveMapObject({
                    type: 'radius',
                    lat: radiusCenter.lat,
                    lng: radiusCenter.lng,
                    radiusKm: km,
                    invert: radiusInvert,
                    label
                });
                setActiveTool(null);
                notify(`Manuel Radius (${km} km) plottet på kortet!`);
            };

            const handleSavePolygon = async () => {
                if (!user || polyPoints.length < 3) return;
                await saveMapObject({
                    type: 'polygon',
                    coords: polyPoints,
                    invert: polyInvert,
                    label: polyInvert ? 'Omvendt Polygon-Zone' : 'Tegnet Rød Zone'
                });
                setPolyPoints([]);
                setActiveTool(null);
                notify("Rød zone gemt på kortet!");
            };

            const handleSaveThermometer = async () => {
                if (!user || !thermoA || !thermoB) return;
                await saveMapObject({
                    type: 'thermometer',
                    pointA: thermoA,
                    pointB: thermoB,
                    warmer: thermoWarmer,
                    label: `Manuelt Termometer (${thermoWarmer ? 'Varmere mod B' : 'Koldere mod A'})`
                });
                setThermoA(null);
                setThermoB(null);
                setActiveTool(null);
                notify("Termometer-halvdel farvet rød!");
            };

            const handleStart45MinTimer = async () => {
                if (!user) return;
                const updated = {
                    ...roomState,
                    phase: 'hiding',
                    timerEndMillis: Date.now() + 45 * 60 * 1000,
                    isRunning: true,
                    updatedBy: playerName
                };
                setRoomState(updated);
                if (localChannel) localChannel.postMessage({ roomCode, kind: 'roomState', payload: updated });
                if (isCloudActive && db) {
                    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                    await setDoc(roomDocRef, updated);
                }
                notify("45 minutters Gemme-tid er startet!");
            };

            const handleTogglePhase = async () => {
                if (!user) return;
                const nextPhase = roomState.phase === 'hiding' ? 'seeking' : 'hiding';
                const updated = {
                    ...roomState,
                    phase: nextPhase,
                    timerEndMillis: nextPhase === 'hiding' ? Date.now() + 45 * 60 * 1000 : null,
                    isRunning: nextPhase === 'hiding',
                    updatedBy: playerName
                };
                setRoomState(updated);
                if (localChannel) localChannel.postMessage({ roomCode, kind: 'roomState', payload: updated });
                if (isCloudActive && db) {
                    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                    await setDoc(roomDocRef, updated);
                }
            };

            const sendChatMessage = async (textToSend) => {
                const msg = (textToSend ?? chatInput).trim();
                if (!msg || !user) return;
                const payload = {
                    id: `msg_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`,
                    roomCode,
                    senderUid: user.uid,
                    sender: playerName,
                    team: myTeam,
                    role: myRole,
                    text: msg,
                    createdAtMillis: Date.now()
                };
                if (!textToSend) setChatInput("");

                if (!isCloudActive || !db) {
                    setChatMessages(prev => [...prev, payload]);
                    if (localChannel) localChannel.postMessage({ roomCode, kind: 'chat', payload });
                    return;
                }

                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'chat'), payload);
                } catch (e) {
                    console.error(e);
                }
            };

            const teamAPlayers = players.filter(p => p.team === 'teamA');
            const teamBPlayers = players.filter(p => p.team === 'teamB');

            // Compute live preview info for Seeker's Official Measuring & Matching tabs
            const myNearestMatchPOI = useMemo(() => {
                const list = BUILTIN_GEO_DATA[qMatchCategory] || BUILTIN_GEO_DATA.lufthavn;
                return getNearestPOI(myCoords.lat, myCoords.lng, list);
            }, [myCoords, qMatchCategory]);

            const myMeasurePreviewKm = useMemo(() => {
                const list = BUILTIN_GEO_DATA[qMeasureTarget] || BUILTIN_GEO_DATA.lufthavn;
                const nearest = getNearestPOI(myCoords.lat, myCoords.lng, list);
                return nearest ? `${nearest.name} (${nearest.distanceKm.toFixed(2)} km)` : '0 km';
            }, [myCoords, qMeasureTarget]);

            return (
                <div className={`relative w-full h-full overflow-hidden select-none ${mapTheme}`}>
                    {/* Full-Screen Leaflet Map */}
                    <div id="map-container" />

                    {/* Center Crosshair when placing Radius or Polygon points */}
                    {(activeTool === 'radius' || activeTool === 'polygon' || activeTool === 'thermometer' || (activeTool === 'questions' && questionTab === 'thermometer')) && (
                        <div className="map-crosshair flex flex-col items-center">
                            <div className="w-8 h-8 rounded-full border-2 border-jl-navy bg-jl-yellow/40 flex items-center justify-center shadow">
                                <div className="w-2 h-2 rounded-full bg-jl-red" />
                            </div>
                        </div>
                    )}

                    {/* TOP BROADCAST BAR (Jet Lag TV HUD Style) */}
                    <div className="absolute top-0 left-0 right-0 z-[500] p-2.5 sm:p-3 pointer-events-none flex flex-wrap items-start justify-between gap-2">
                        {/* Left: Room Code + Team & Automatic Role Badge */}
                        <div className="pointer-events-auto flex items-center gap-2 bg-jl-navy border-2 border-jl-cream rounded-2xl px-3 py-1.5 shadow-xl">
                            <button
                                onClick={() => setActiveTool(activeTool === 'room' ? null : 'room')}
                                className="bg-jl-dark border border-jl-yellow/50 px-2.5 py-1 rounded-xl text-left hover:border-jl-yellow transition-colors"
                                title="Åbn Rum & Hold-oversigt"
                            >
                                <div className="text-[9px] font-display font-bold uppercase text-jl-cream/60 leading-none">
                                    RUM • RUNDE {roomState.roundNumber || 1}
                                </div>
                                <div className="font-display font-black text-lg text-jl-yellow tracking-widest leading-tight">
                                    🔑 {roomCode}
                                </div>
                            </button>

                            <div className={`px-2.5 py-1 rounded font-display font-black text-xs sm:text-sm uppercase tracking-wider -rotate-2 border ${
                                myRole === 'hider'
                                    ? 'bg-jl-green text-white border-white'
                                    : 'bg-jl-yellow text-jl-navy border-jl-navy'
                            }`}>
                                {myRole === 'hider' ? '🏃 GEMMER-INTERFACE' : '🔍 FINDER-INTERFACE'}
                            </div>

                            <div className="pr-1 hidden sm:block">
                                <div className="font-display font-black text-base text-jl-cream leading-none uppercase">
                                    {playerName} ({myTeam === 'teamA' ? 'Hold 1' : 'Hold 2'})
                                </div>
                                <div className="text-[10px] font-bold text-jl-cream/70">
                                    {myRole === 'hider'
                                        ? `Live overvågning af ${chasersWithDistance.length} finder(e)`
                                        : activeHiderTarget.isBot
                                        ? '🤖 Auto-Svar aktiv (Test Bot-Gemmer)'
                                        : `📡 Auto-Svar forbundet til ${activeHiderTarget.name}`}
                                </div>
                            </div>
                        </div>

                        {/* Center: 45-Min Hide Timer, Game Phase & "NY RUNDE / BYT HOLD" */}
                        <div className="pointer-events-auto flex items-center gap-2 bg-jl-navy border-2 border-jl-cream rounded-2xl px-3 py-1.5 shadow-xl">
                            <div className="flex flex-col">
                                <span className="text-[10px] font-display font-black uppercase tracking-widest text-jl-yellow">
                                    {roomState.phase === 'hiding' ? `⏱ GEMME-TID (RUNDE ${roomState.roundNumber || 1})` : `🚨 JAGTEN ER I GANG (RUNDE ${roomState.roundNumber || 1})`}
                                </span>
                                <span className="font-display font-black text-2xl sm:text-3xl text-jl-cream leading-none tracking-wider">
                                    {roomState.phase === 'hiding' ? clockDisplay : 'JAGT AKTIV'}
                                </span>
                            </div>
                            <div className="flex flex-col gap-1 ml-1.5">
                                <div className="flex gap-1">
                                    <button
                                        onClick={handleStart45MinTimer}
                                        className="bg-jl-green hover:bg-emerald-500 text-white font-display font-bold text-[11px] uppercase px-2 py-0.5 rounded shadow"
                                    >
                                        Start 45m
                                    </button>
                                    <button
                                        onClick={handleTogglePhase}
                                        className="bg-jl-orange hover:bg-amber-600 text-white font-display font-bold text-[11px] uppercase px-2 py-0.5 rounded shadow"
                                    >
                                        {roomState.phase === 'hiding' ? 'Start Jagt' : 'Gemme-tid'}
                                    </button>
                                </div>
                                <button
                                    onClick={handleNextRoundSwapTeams}
                                    className="bg-jl-yellow hover:bg-amber-300 text-jl-navy font-display font-black text-[11px] uppercase px-2 py-0.5 rounded shadow tracking-wider"
                                    title="Start næste runde og byt automatisk hvem der er Gemmer og Finder!"
                                >
                                    🔄 Ny Runde (Byt Hold)
                                </button>
                            </div>
                        </div>

                        {/* Right: Map Theme, Zone 1-99 Hubs & GPS Simulator Toggle */}
                        <div className="pointer-events-auto flex items-center gap-1.5 bg-jl-navy/95 border-2 border-jl-cream rounded-2xl p-1.5 shadow-xl">
                            <button
                                onClick={() => {
                                    const nextMuted = !soundMuted;
                                    setSoundMuted(nextMuted);
                                    JetLagAudio.muted = nextMuted;
                                    if (!nextMuted) JetLagAudio.playIntroStinger();
                                }}
                                className={`px-2.5 py-1.5 rounded-xl font-display font-bold text-xs uppercase tracking-wider ${
                                    !soundMuted ? 'bg-jl-green text-white' : 'bg-jl-dark text-jl-cream/50'
                                }`}
                                title="Slå Jet Lag lydeffekter til/fra"
                            >
